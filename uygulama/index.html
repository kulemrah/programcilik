<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="programcilik-kabuk" content="1">
<title>Programcılık</title>
<meta name="description" content="Bilgisayar Programcılığı ders notları, temrinler ve 42 Tarzı kartlar">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1720">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Programcılık">
<script>
/* Kurulum olayı sayfa yüklenirken çok erken tetiklenebiliyor; buradan
   yakalanmazsa kimse dinlemediği için kayboluyor ve düğme hiç çıkmıyor. */
window.kurulumOlayi = null;
window.addEventListener("beforeinstallprompt", function (olay) {
  olay.preventDefault();
  window.kurulumOlayi = olay;
  window.dispatchEvent(new Event("kurulum-hazir"));
});
window.addEventListener("appinstalled", function () {
  window.kurulumOlayi = null;
  window.dispatchEvent(new Event("kurulum-bitti"));
});
</script>
<style>
/* ---- Renk değişkenleri: gece varsayılan ---- */
:root{
  --zemin:#0F1720;
  --yuzey:#17222D;
  --yuzey2:#1E2B38;
  --cizgi:#27353F;
  --yazi:#DDE5EC;
  --sonuk:#8395A5;
  --vurgu:#E3A85C;
  --vurgu-zemin:rgba(227,168,92,.14);
  --dogru:#62B49B;
  --dogru-zemin:rgba(98,180,155,.16);
  --boya:#F2736E;
  --yanlis:#D4706E;
  --yanlis-zemin:rgba(212,112,110,.16);
  --golge:0 1px 0 rgba(255,255,255,.03);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --metin:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-mod="gunduz"]{
  --zemin:#EBEFF3;
  --yuzey:#FFFFFF;
  --yuzey2:#F4F7F9;
  --cizgi:#D3DCE4;
  --yazi:#16212C;
  --sonuk:#566674;
  --vurgu:#965C14;
  --vurgu-zemin:rgba(150,92,20,.10);
  --dogru:#2F7F68;
  --dogru-zemin:rgba(47,127,104,.12);
  --boya:#C0322E;
  --yanlis:#B24A47;
  --yanlis-zemin:rgba(178,74,71,.12);
  --golge:0 1px 2px rgba(22,33,44,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--zemin);color:var(--yazi);
  font-family:var(--metin);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
code,kbd,pre{font-family:var(--mono)}

/* ---- Üst çubuk ---- */
.ust{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
  background:var(--zemin);border-bottom:1px solid var(--cizgi);
}
.ust h1{
  margin:0;font-size:15px;font-weight:600;letter-spacing:.01em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ust .kok{font-family:var(--mono);color:var(--vurgu);font-weight:400}
.mod-dugme{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--cizgi);
  display:grid;place-items:center;background:var(--yuzey);flex:none;
}
.mod-dugme svg{width:18px;height:18px;stroke:var(--yazi);fill:none;stroke-width:1.7;stroke-linecap:round}

/* ---- Sayfa gövdesi ---- */
main{max-width:720px;margin:0 auto;padding:16px max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left))}
.sayfa{display:none}
.sayfa.acik{display:block}

/* ---- lsblk ağacı: bölüm listesi ---- */
.agac{font-family:var(--mono);font-size:14px;line-height:1.9;margin:4px 0 0}
.agac-baslik{color:var(--sonuk);font-size:12.5px;margin-bottom:6px;letter-spacing:.02em}
.dal{
  display:flex;align-items:baseline;gap:0;width:100%;text-align:left;
  padding:1px 4px;border-radius:6px;
}
.dal:hover,.dal:focus-visible{background:var(--yuzey)}
.dal .cizim{color:var(--sonuk);white-space:pre;flex:none}
.dal .ad{color:var(--yazi);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dal .rozet{color:var(--sonuk);font-size:12px;flex:none;padding-left:8px}
.dal.okundu .ad{color:var(--sonuk)}
.dal.okundu .rozet{color:var(--dogru)}

/* ---- Okuma alanı ---- */
.okuma{font-size:var(--okuma-boyut,16.5px);line-height:1.72;letter-spacing:.002em}
.okuma mark{background:var(--vurgu-zemin);color:var(--vurgu);padding:0 2px;border-radius:3px}
/* Boyanan metnin kendisi kırmızı olur, arka planı değişmez */
.okuma .boyali{color:var(--boya)}
.okuma pre .boyali,.okuma code .boyali{color:var(--boya)}
.secim-cubugu .boya-dugmesi{color:var(--boya);border-color:var(--boya)}
.secim-cubugu .boya-dugmesi:hover{color:var(--boya);border-color:var(--boya)}
.okuma h2{
  font-size:19px;line-height:1.35;margin:0 0 4px;font-weight:650;
  padding-bottom:10px;border-bottom:2px solid var(--vurgu);
}
.okuma h3{
  font-size:15.5px;font-weight:650;margin:30px 0 8px;line-height:1.4;
  color:var(--yazi);
}
.okuma h3:first-of-type{margin-top:22px}
.okuma p{margin:0 0 14px;max-width:66ch}
.okuma p strong{font-weight:650}
.okuma code{
  font-size:.88em;background:var(--vurgu-zemin);color:var(--vurgu);
  padding:1px 5px;border-radius:4px;word-break:break-word;
}
.okuma pre{
  margin:0 0 16px;padding:12px 14px;overflow-x:auto;
  background:var(--yuzey);border:1px solid var(--cizgi);border-left:3px solid var(--vurgu);
  border-radius:8px;font-size:13.5px;line-height:1.65;
}
.okuma pre code{background:none;color:var(--yazi);padding:0;font-size:inherit}

/* Okuma başlığı ve gezinme */
.okuma-ust{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.okuma-ust .bosluk{flex:1}
.boyut-dugme{
  width:36px;height:34px;border-radius:8px;border:1px solid var(--cizgi);
  background:var(--yuzey);color:var(--yazi);font-family:var(--mono);font-size:13px;flex:none;
}
.boyut-dugme:disabled{opacity:.35}
.devam{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 14px;border-radius:10px;border:1px solid var(--vurgu);
  background:var(--vurgu-zemin);margin-bottom:14px;
}
.devam .ok{color:var(--vurgu);font-family:var(--mono);flex:none}
.devam .yazi{flex:1;min-width:0}
.devam .ust-satir{display:block;font-size:12px;color:var(--sonuk)}
.devam .ad{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fihrist-giris{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:12px 14px;border-radius:10px;border:1px solid var(--cizgi);
  background:var(--yuzey);margin-bottom:10px;font-size:14.5px;
}
.fihrist-giris .ok{color:var(--vurgu);font-family:var(--mono)}
.fihrist-satir{
  display:block;width:100%;text-align:left;font-family:var(--mono);font-size:13.5px;
  padding:10px 12px;border-radius:8px;border:1px solid var(--cizgi);
  background:var(--yuzey);margin-bottom:7px;overflow-wrap:anywhere;line-height:1.45;
}
.fihrist-satir:hover{border-color:var(--vurgu)}
.icindekiler{
  display:grid;gap:2px;margin:0 0 20px;padding:12px 14px;
  border-radius:10px;background:var(--yuzey);border:1px solid var(--cizgi);
}
.icindekiler button{
  text-align:left;font-size:13.5px;line-height:1.45;padding:5px 0;color:var(--sonuk);
}
.icindekiler button:hover{color:var(--vurgu)}

/* ---- Mühim yerler ---- */
/* Kitap ayracı biçimli küçük işaret: listelerde ve içindekilerde */
.muhim-imi{
  display:inline-block;width:8px;height:11px;flex:none;background:var(--vurgu);
  -webkit-clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);
}
/* Başlıktaki düğme: metnin akışını bozmasın diye sağa yaslanır; içinde yazı
   yoktur (boyaların konumu metin karakterleriyle sayılır) */
.muhim-dugme{
  float:right;width:38px;height:38px;margin:-8px -10px -6px 6px;padding:0;
  display:grid;place-items:center;border-radius:8px;color:var(--sonuk);opacity:.6;
}
.muhim-dugme svg{width:15px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.muhim-dugme[aria-pressed="true"]{color:var(--vurgu);opacity:1}
.muhim-dugme[aria-pressed="true"] svg{fill:currentColor}
.muhim-dugme:focus-visible{outline:2px solid var(--vurgu)}
.okuma h2.muhim::before{
  content:"";display:inline-block;width:10px;height:14px;margin-right:9px;vertical-align:-1px;background:var(--vurgu);
  -webkit-clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);
}
.okuma h3.muhim,.okuma h4.muhim{
  background:var(--vurgu-zemin);border-left:3px solid var(--vurgu);
  padding:4px 8px 4px 10px;border-radius:0 8px 8px 0;
}
.icindekiler button.muhim{color:var(--yazi);font-weight:600}
.icindekiler button.muhim .muhim-imi{margin-right:8px;vertical-align:-1px}
.dal .rozet .muhim-imi{margin-right:6px;vertical-align:-1px}
.dal.dal-alt .ad{color:var(--sonuk);font-size:13px;font-family:var(--metin)}
.dal.dal-alt .muhim-imi{margin-right:7px;vertical-align:-1px}
.hususi-etiket{
  margin-left:10px;padding:2px 8px;border-radius:999px;vertical-align:3px;
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.03em;
  color:var(--vurgu);border:1px solid var(--vurgu);
}
.muhimler-giris .sayi{margin-left:auto;margin-right:10px;font-family:var(--mono);font-size:12.5px;color:var(--sonuk)}
.muhimler-giris .muhim-imi{margin-right:10px}
.muhim-konu{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:11px 12px;border-radius:10px;border:1px solid var(--cizgi);background:var(--yuzey);
  margin:6px 0 2px;font-size:14.5px;font-weight:600;line-height:1.4;
}
.muhim-konu:hover{border-color:var(--vurgu)}
.muhim-konu .bos-imi{width:8px;flex:none}
.muhim-baslik{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 12px 7px 26px;font-size:14px;line-height:1.45;color:var(--yazi);border-radius:8px;
}
.muhim-baslik:hover{background:var(--yuzey)}
.muhim-baslik.alt{padding-left:44px;color:var(--sonuk)}
.kontrol-oge.sirada{border-color:var(--vurgu);background:var(--vurgu-zemin)}
.metin-basligi{
  font-family:var(--mono);font-size:12.5px;color:var(--sonuk);
  margin:20px 0 8px;padding-top:14px;border-top:1px solid var(--cizgi);
}
.kesit{
  font-size:13.5px;line-height:1.55;color:var(--sonuk);margin:0;
  font-family:var(--mono);overflow-wrap:anywhere;
}
.kesit b{color:var(--vurgu);font-weight:600}
.sonuc-kart .adet{font-size:12px;color:var(--sonuk);font-family:var(--mono)}
.geri{
  display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--sonuk);
  padding:6px 10px;border-radius:8px;border:1px solid var(--cizgi);background:var(--yuzey);
}
.okuma-alt{
  display:flex;gap:10px;margin:28px 0 8px;padding-top:18px;border-top:1px solid var(--cizgi);
}
.okuma-alt button{
  flex:1;padding:12px;border-radius:10px;border:1px solid var(--cizgi);
  background:var(--yuzey);font-size:14px;color:var(--yazi);
}
.okuma-alt button:disabled{opacity:.35}
.okundu-dugme{
  width:100%;margin-top:12px;padding:12px;border-radius:10px;font-size:14px;
  border:1px solid var(--cizgi);background:var(--yuzey);color:var(--yazi);
}
.okundu-dugme.isaretli{background:var(--dogru-zemin);border-color:var(--dogru);color:var(--dogru)}

/* ---- Arama ---- */
.arama-kutu{position:relative;margin-bottom:8px}
.arama-kutu input{
  width:100%;padding:13px 40px 13px 14px;border-radius:10px;
  border:1px solid var(--cizgi);background:var(--yuzey);font-size:16px;
}
.arama-kutu input:focus{outline:2px solid var(--vurgu);outline-offset:-1px}
.arama-sil{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:8px;color:var(--sonuk);font-size:18px;
}
.oneri{
  list-style:none;margin:0;padding:0;border:1px solid var(--cizgi);border-radius:10px;
  background:var(--yuzey);overflow:hidden;
}
.oneri:empty{display:none}
.oneri li button{
  display:block;width:100%;text-align:left;padding:11px 14px;
  border-bottom:1px solid var(--cizgi);font-size:14.5px;
}
.oneri li:last-child button{border-bottom:0}
.oneri li button:hover,.oneri li button:focus-visible{background:var(--yuzey2)}
.oneri .terim{font-family:var(--mono);color:var(--vurgu);font-size:13.5px}
.oneri .kisa{display:block;color:var(--sonuk);font-size:13px;margin-top:2px;line-height:1.45}

.arama-satir{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.arama-satir .arama-kutu{flex:1;margin-bottom:0}
.yildiz-dugme{
  flex:none;width:46px;height:46px;border-radius:10px;
  border:1px solid var(--cizgi);background:var(--yuzey);
  color:var(--sonuk);font-size:19px;line-height:1;
}
.yildiz-dugme.dolu{color:var(--vurgu);border-color:var(--vurgu);background:var(--vurgu-zemin)}
.yildiz-dugme:disabled{opacity:.4}
.yildiz-dugme.dar{flex:0 0 44px;width:44px;height:auto;padding:10px 0;font-size:17px}
.yildiz-satiri{
  display:flex;align-items:center;gap:8px;margin-bottom:7px;
  border:1px solid var(--cizgi);border-radius:9px;background:var(--yuzey);
}
.yildiz-satiri .ad{
  flex:1;text-align:left;padding:12px 4px 12px 13px;font-size:14.5px;color:var(--yazi);
  overflow-wrap:anywhere;
}
.yildiz-satiri .kaldir{padding:12px 14px;font-size:17px;color:var(--sonuk)}
.yildiz-satiri .kaldir:hover{color:var(--yanlis)}
.kademe-satiri{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.kademe{
  flex:1 1 auto;min-width:64px;padding:9px 8px;border-radius:8px;
  border:1px solid var(--cizgi);background:var(--yuzey);
  font-size:12.5px;color:var(--sonuk);
}
.kademe.secili{border-color:var(--vurgu);background:var(--vurgu-zemin);color:var(--vurgu)}
.dene-dugme{
  width:100%;margin-top:14px;padding:12px;border-radius:10px;
  border:1px solid var(--cizgi);background:var(--yuzey);color:var(--yazi);font-size:14px;
}
.dene-dugme:hover{border-color:var(--vurgu);color:var(--vurgu)}
.fihrist-satir.secili{border-color:var(--vurgu);color:var(--vurgu);background:var(--vurgu-zemin)}
.panel-ust .yildiz-dugme{width:34px;height:34px;font-size:16px}

.sonuc{margin-top:14px}
.sonuc-kart{
  border:1px solid var(--cizgi);border-radius:10px;background:var(--yuzey);
  padding:14px;margin-bottom:10px;box-shadow:var(--golge);
}
.sonuc-kart h4{margin:0 0 6px;font-size:14.5px;font-family:var(--mono);color:var(--vurgu);font-weight:500}
.sonuc-kart p{margin:0;font-size:14.5px;line-height:1.6}
.sonuc-kart .nereden{
  display:inline-block;margin-top:10px;font-size:12.5px;color:var(--sonuk);
  border-bottom:1px solid var(--cizgi);
}
.bos{color:var(--sonuk);font-size:14.5px;padding:24px 4px;text-align:center;line-height:1.6}

/* ---- Çalışma ---- */
.mod-liste{display:grid;gap:10px}
.mod-kart{
  display:block;width:100%;text-align:left;padding:14px;border-radius:12px;
  border:1px solid var(--cizgi);background:var(--yuzey);box-shadow:var(--golge);
}
.mod-kart .ad{font-size:15px;font-weight:600;display:block;margin-bottom:3px}
.mod-kart .izah{font-size:13.5px;color:var(--sonuk);line-height:1.5;display:block}
.mod-kart .sayi{font-family:var(--mono);font-size:12.5px;color:var(--vurgu);margin-top:8px;display:block}

.suzgec-dugme{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:12px 14px;border-radius:10px;border:1px solid var(--cizgi);
  background:var(--yuzey);margin-bottom:12px;font-size:14.5px;
}
.suzgec-dugme .deger{
  font-family:var(--mono);font-size:13px;color:var(--sonuk);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;
}
.suzgec-dugme.etkin{border-color:var(--vurgu)}
.suzgec-dugme.etkin .deger{color:var(--vurgu)}
.bolum-rozetleri{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 7px}
.bolum-rozet{
  font-family:var(--mono);font-size:11px;line-height:1;padding:3px 5px;
  border-radius:4px;background:var(--vurgu-zemin);color:var(--vurgu);
}
.ilerleme{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;
  font-family:var(--mono);font-size:12.5px;color:var(--sonuk);
}
.ilerleme .cubuk{flex:1;height:4px;border-radius:2px;background:var(--cizgi);overflow:hidden}
.ilerleme .dolu{height:100%;background:var(--vurgu);transition:width .25s ease}

.soru{
  border:1px solid var(--cizgi);border-radius:12px;background:var(--yuzey);
  padding:16px;margin-bottom:14px;box-shadow:var(--golge);
}
.soru .etiket{
  font-family:var(--mono);font-size:12px;color:var(--vurgu);
  display:block;margin-bottom:8px;
}
.soru .metin{font-size:16px;line-height:1.55;margin:0 0 4px}
.soru pre{
  margin:12px 0 0;padding:11px 12px;background:var(--yuzey2);border:1px solid var(--cizgi);
  border-radius:8px;font-size:13.5px;overflow-x:auto;
}
.secenekler{display:grid;gap:9px;margin-top:14px}
.secenek{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:12px 13px;border-radius:10px;border:1px solid var(--cizgi);
  background:var(--yuzey);font-size:14.5px;line-height:1.5;
}
.secenek .harf{
  font-family:var(--mono);font-size:12.5px;color:var(--sonuk);flex:none;
  width:20px;height:20px;border-radius:5px;border:1px solid var(--cizgi);
  display:grid;place-items:center;margin-top:1px;
}
.secenek:hover:not(:disabled){border-color:var(--vurgu)}
.secenek.dogru{background:var(--dogru-zemin);border-color:var(--dogru)}
.secenek.dogru .harf{border-color:var(--dogru);color:var(--dogru)}
.secenek.yanlis{background:var(--yanlis-zemin);border-color:var(--yanlis)}
.secenek.yanlis .harf{border-color:var(--yanlis);color:var(--yanlis)}
.secenek:disabled{cursor:default;opacity:1}

/* Komut dizme */
.dizi-alan{
  min-height:52px;margin-top:14px;padding:10px;border-radius:10px;
  border:1px dashed var(--cizgi);background:var(--yuzey2);
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
}
.dizi-alan.bos-alan::before{
  content:attr(data-ipucu);color:var(--sonuk);font-size:13px;font-family:var(--metin);
}
.havuz{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.parca{
  font-family:var(--mono);font-size:13.5px;padding:8px 11px;border-radius:8px;
  border:1px solid var(--cizgi);background:var(--yuzey);line-height:1.3;
  overflow-wrap:anywhere;max-width:100%;text-align:left;
}
.parca:hover{border-color:var(--vurgu)}
.dizi-alan .parca{background:var(--vurgu-zemin);border-color:var(--vurgu);color:var(--yazi)}
.dizi-alan.dogru-alan{border-style:solid;border-color:var(--dogru);background:var(--dogru-zemin)}
.dizi-alan.yanlis-alan{border-style:solid;border-color:var(--yanlis);background:var(--yanlis-zemin)}

/* Eşleştirme */
.esles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.esles-sutun{display:grid;gap:8px;align-content:start}
.esles-oge{
  padding:11px 10px;border-radius:9px;border:1px solid var(--cizgi);background:var(--yuzey);
  font-size:13px;line-height:1.4;text-align:left;min-height:44px;
  overflow-wrap:anywhere;min-width:0;
}
.esles-oge.sag{font-family:var(--mono);font-size:12.5px}
.esles-oge.secili{border-color:var(--vurgu);background:var(--vurgu-zemin)}
.esles-oge.tamam{border-color:var(--dogru);background:var(--dogru-zemin);color:var(--dogru);cursor:default}
.esles-oge.hata{border-color:var(--yanlis);background:var(--yanlis-zemin)}

/* Kart: 42 Tarzı destesi aşağıda, ayrı bölümde */

/* İzah kutusu */
.izah{
  margin-top:14px;padding:12px 13px;border-radius:9px;
  background:var(--yuzey2);border-left:3px solid var(--vurgu);
  font-size:14px;line-height:1.6;
}
.izah .nereden{display:block;margin-top:7px;font-size:12.5px;color:var(--sonuk)}

/* Kontrol listesi */
.kontrol{display:grid;gap:9px}
.kontrol-oge{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:13px;border-radius:10px;border:1px solid var(--cizgi);background:var(--yuzey);
  font-size:14.5px;line-height:1.5;
}
.kutucuk{
  flex:none;width:21px;height:21px;border-radius:6px;border:1.5px solid var(--cizgi);
  display:grid;place-items:center;margin-top:1px;font-size:13px;color:transparent;
}
.kontrol-oge.tikli .kutucuk{background:var(--dogru);border-color:var(--dogru);color:var(--zemin)}
.kontrol-oge.tikli{color:var(--sonuk)}

/* Alt eylem düğmeleri */
.eylem{display:flex;gap:10px;margin-top:16px}
.eylem button{
  flex:1;padding:13px;border-radius:10px;font-size:14.5px;font-weight:550;
  border:1px solid var(--cizgi);background:var(--yuzey);color:var(--yazi);
}
.eylem button.ana{background:var(--vurgu);border-color:var(--vurgu);color:#12181F}
html[data-mod="gunduz"] .eylem button.ana{color:#FFF}
html[data-mod="gunduz"] .okuma mark{background:rgba(150,92,20,.16)}
.eylem button:disabled{opacity:.4}

/* Sonuç ekranı */
.bitis{text-align:center;padding:30px 10px}
.bitis .puan{font-family:var(--mono);font-size:40px;color:var(--vurgu);line-height:1.1}
.bitis .alt{color:var(--sonuk);font-size:14.5px;margin-top:8px}
.bitis .yanlislar{margin-top:24px;text-align:left}
.bitis .yanlislar h4{margin:0 0 10px;font-size:14px;color:var(--sonuk);font-weight:600}

/* ---- Alt gezinme ---- */
.alt-cubuk{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--yuzey);border-top:1px solid var(--cizgi);
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.alt-cubuk button{
  padding:9px 4px 10px;display:grid;justify-items:center;gap:3px;
  font-size:11px;color:var(--sonuk);
}
.alt-cubuk button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.alt-cubuk button.etkin{color:var(--vurgu)}

/* ---- Güncelleme notu ---- */
.not-perde{
  position:fixed;inset:0;z-index:75;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);padding:16px;
}
.not-kutu{
  width:100%;max-width:520px;max-height:84vh;display:flex;flex-direction:column;
  background:var(--zemin);border:1px solid var(--vurgu);border-radius:16px;
  padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.45);
}
.not-ust{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.not-ust h3{margin:0;flex:1;font-size:17px;font-weight:650}
.not-surum{font-family:var(--mono);font-size:12px;color:var(--vurgu)}
.not-govde{overflow-y:auto;-webkit-overflow-scrolling:touch}
.not-madde{padding:10px 0;border-bottom:1px solid var(--cizgi)}
.not-madde:last-child{border-bottom:0}
.not-madde strong{display:block;font-size:14.5px;margin-bottom:3px}
.not-madde p{margin:0;font-size:13.5px;line-height:1.55;color:var(--sonuk)}
.not-kutu .eylem{margin-top:14px}

/* ---- Sesli okuma ---- */
.dinle-dugme{width:auto;padding:0 12px;font-size:12px}
.okuma .okunuyor{
  background:var(--vurgu-zemin);border-radius:6px;
  box-shadow:0 0 0 6px var(--vurgu-zemin);
}
.oynatma{
  position:fixed;left:10px;right:10px;z-index:55;
  bottom:calc(72px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;
  padding:10px 12px;border-radius:12px;
  background:var(--yuzey);border:1px solid var(--vurgu);
  box-shadow:0 6px 22px rgba(0,0,0,.3);
}
.oynatma .oynatma-ust{display:flex;align-items:center;gap:10px}
.oynatma .dugmeler{display:flex;align-items:center;gap:8px}
.oynatma .dugmeler .yazili{flex:1}
.ses-dugme{
  flex:none;max-width:52%;padding:6px 10px;border-radius:8px;
  border:1px solid var(--cizgi);background:var(--yuzey2);
  font-size:12.5px;color:var(--sonuk);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ses-dugme:hover{border-color:var(--vurgu);color:var(--vurgu)}
.oynatma .bilgi{
  flex:1;min-width:0;font-size:13px;color:var(--sonuk);font-family:var(--mono);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.oynatma .yuvarlak{
  width:38px;height:38px;border-radius:50%;flex:none;
  background:var(--vurgu);color:#12181F;font-size:13px;
}
html[data-mod="gunduz"] .oynatma .yuvarlak{color:#FFF}
.oynatma .yazili{
  padding:9px 12px;border-radius:9px;border:1px solid var(--cizgi);
  background:var(--yuzey2);font-size:13.5px;color:var(--yazi);flex:none;
}
.oynatma .yazili:disabled{opacity:.4}

/* ---- Cep kilidi ---- */
.kilit-perde{
  position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  background:var(--zemin);touch-action:none;
}
.kilit-kutu{text-align:center;padding:24px;max-width:320px}
.kilit-baslik{font-size:19px;font-weight:600;margin-bottom:6px}
.kilit-alt{font-size:14px;color:var(--sonuk);line-height:1.5}
.kilit-ipucu{font-size:13px;color:var(--sonuk);margin:22px 0 10px}
.kilit-dugme{
  display:grid;gap:12px;width:100%;padding:16px;border-radius:12px;
  font-size:15px;border:1px solid var(--vurgu);background:var(--vurgu-zemin);color:var(--vurgu);
}
.kilit-dugme .etiket{display:block}
.kilit-dugme .serit{
  display:block;height:5px;border-radius:3px;overflow:hidden;
  background:var(--cizgi);
}
.kilit-dugme .dolgu{
  display:block;height:100%;width:0;background:var(--vurgu);
  transition:width .18s linear;
}
.kilit-dugme.basiliyor .dolgu{width:100%;transition:width 1.5s linear}

/* ---- Kelimeye basılı tutma menüsü ---- */
.okuma{-webkit-user-select:text;user-select:text}
.secim-cubugu{
  position:fixed;left:10px;right:10px;z-index:60;
  bottom:calc(72px + env(safe-area-inset-bottom));
  background:var(--yuzey);border:1px solid var(--vurgu);border-radius:12px;
  padding:10px 12px;box-shadow:0 6px 22px rgba(0,0,0,.3);
}
.secim-cubugu .kelime{
  display:block;font-family:var(--mono);font-size:12.5px;color:var(--sonuk);
  margin-bottom:8px;max-height:2.8em;overflow:hidden;line-height:1.4;
}
.secim-cubugu .dugmeler{display:flex;gap:8px}
.secim-cubugu .dugmeler button{
  flex:1;padding:10px 6px;border-radius:9px;border:1px solid var(--cizgi);
  background:var(--yuzey2);font-size:13.5px;color:var(--yazi);
}
.secim-cubugu .dugmeler button:hover{border-color:var(--vurgu);color:var(--vurgu)}

/* ---- Öne çıkan arama paneli ---- */
.panel-perde{
  position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.55);padding:0;
}
.panel{
  width:100%;max-width:640px;max-height:82vh;display:flex;flex-direction:column;
  background:var(--zemin);border:1px solid var(--cizgi);
  border-radius:16px 16px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.4);
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));
}
.panel-ust{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.panel-ust h3{
  margin:0;flex:1;font-family:var(--mono);font-size:16px;color:var(--vurgu);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.panel-kapat{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--cizgi);
  background:var(--yuzey);font-size:19px;color:var(--sonuk);flex:none;
}
.panel-govde{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.panel .eylem{margin-top:12px}

/* ---- Kısa bildirim ---- */
.kisa-bildirim{
  position:fixed;left:50%;transform:translateX(-50%);z-index:80;
  bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--yuzey);border:1px solid var(--vurgu);color:var(--yazi);
  padding:10px 14px;border-radius:10px;font-size:13.5px;
  box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:80%;text-align:center;
}

/* ---- Kurulum şeridi ---- */
.kurulum{
  position:fixed;left:10px;right:10px;z-index:50;
  bottom:calc(72px + env(safe-area-inset-bottom));
  background:var(--yuzey);border:1px solid var(--vurgu);border-radius:14px;
  padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);
}
.kurulum .baslik{font-size:14.5px;font-weight:600;margin:0 0 4px}
.kurulum .metin{font-size:13.5px;color:var(--sonuk);margin:0;line-height:1.5}
.kurulum .adimlar{margin:10px 0 0;padding-left:18px;font-size:13.5px;line-height:1.65;color:var(--yazi)}
.kurulum .adimlar li{margin-bottom:3px}
.kurulum .eylem{margin-top:12px}
.kurulum .eylem button{padding:11px;font-size:14px}

:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:640px){
  body{font-size:17px}
}

/* ==========================================================================
   Programcılık — yeni öğeler
   ========================================================================== */

/* ---- Üst çubuk: hesap düğmesi ---- */
.hesap-dugme{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--cizgi);
  display:grid;place-items:center;background:var(--yuzey);flex:none;position:relative;
}
.hesap-dugme svg{width:18px;height:18px;stroke:var(--yazi);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hesap-dugme .nokta{
  position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;
  background:var(--vurgu);display:none;
}
.hesap-dugme.bekliyor .nokta{display:block}
.hesap-dugme.cevrimdisi .nokta{display:block;background:var(--sonuk)}

/* ---- Giriş ekranı ---- */
.giris-perde{
  position:fixed;inset:0;z-index:95;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--zemin);
  padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
}
.giris-kutu{max-width:400px;margin:0 auto}
.giris-baslik{font-size:26px;font-weight:650;line-height:1.25;margin:28px 0 6px}
.giris-baslik .kok{font-family:var(--mono);color:var(--vurgu);font-weight:400}
.giris-alt{font-size:14.5px;color:var(--sonuk);line-height:1.55;margin:0 0 26px}
.giris-etiket{display:block;font-size:13px;color:var(--sonuk);margin:0 0 6px}
.giris-girdi{
  width:100%;padding:14px;border-radius:10px;border:1px solid var(--cizgi);
  background:var(--yuzey);font-size:16px;margin-bottom:12px;
}
.giris-girdi:focus{outline:2px solid var(--vurgu);outline-offset:-1px}
.giris-girdi.kod{font-family:var(--mono);font-size:24px;letter-spacing:.35em;text-align:center}
.giris-hata{
  font-size:14px;line-height:1.5;color:var(--yanlis);background:var(--yanlis-zemin);
  border-radius:9px;padding:10px 12px;margin:0 0 12px;
}
.giris-bilgi{
  font-size:14px;line-height:1.5;color:var(--yazi);background:var(--vurgu-zemin);
  border-radius:9px;padding:10px 12px;margin:0 0 12px;
}
.giris-kutu .eylem{margin-top:4px}
.giris-bag{
  display:block;margin:14px auto 0;font-size:13.5px;color:var(--sonuk);
  text-decoration:underline;text-underline-offset:3px;
}
.giris-bag:disabled{opacity:.5;text-decoration:none}
.giris-not{font-size:12.5px;color:var(--sonuk);line-height:1.55;margin-top:30px;padding-top:14px;border-top:1px solid var(--cizgi)}

/* ---- Yükleniyor ---- */
.yukleniyor{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:60px 10px;color:var(--sonuk);font-size:14.5px;text-align:center;
}
.yukleniyor .halka{
  width:28px;height:28px;border-radius:50%;border:3px solid var(--cizgi);border-top-color:var(--vurgu);
  animation:don .9s linear infinite;
}
@keyframes don{to{transform:rotate(360deg)}}

/* ---- Sınıf > Dönem > Ders listesi ---- */
.grup{margin:0 0 22px}
.grup-baslik{font-size:17px;font-weight:650;margin:0 0 10px}
.donem-baslik{font-size:13px;color:var(--sonuk);margin:14px 0 7px}
.donem-baslik:first-of-type{margin-top:0}
.ders-satiri{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;border-radius:10px;border:1px solid var(--cizgi);
  background:var(--yuzey);margin-bottom:7px;
}
.ders-satiri:hover{border-color:var(--vurgu)}
.ders-satiri .ad{flex:1;min-width:0;font-size:15px;line-height:1.4}
.ders-satiri .durum{flex:none;font-family:var(--mono);font-size:12px;color:var(--sonuk)}
.ders-satiri .durum.tamam{color:var(--dogru)}
.ders-satiri.bos .ad{color:var(--sonuk)}
.ders-satiri .ok{color:var(--vurgu);font-family:var(--mono);flex:none}
.ders-basligi{font-size:19px;font-weight:650;line-height:1.35;margin:14px 0 4px}
.ders-yolu{font-size:13px;color:var(--sonuk);margin:0 0 14px}

/* ---- Okuma alanı: yeni markdown öğeleri ---- */
.okuma h4{font-size:14.5px;font-weight:650;margin:22px 0 6px;color:var(--yazi)}
.okuma ul,.okuma ol{margin:0 0 14px;padding-left:22px;max-width:66ch}
.okuma li{margin:0 0 5px}
.okuma blockquote{
  margin:0 0 16px;padding:10px 13px;border-radius:8px;
  background:var(--vurgu-zemin);border-left:3px solid var(--vurgu);
}
.okuma blockquote p{margin:0 0 6px}
.okuma blockquote p:last-child{margin:0}
.tablo-sarmal{overflow-x:auto;margin:0 0 16px;-webkit-overflow-scrolling:touch}
.okuma table{border-collapse:collapse;font-size:14px;line-height:1.5;min-width:100%}
.okuma th,.okuma td{border:1px solid var(--cizgi);padding:7px 10px;text-align:left;vertical-align:top}
.okuma th{background:var(--yuzey);font-weight:650}
.okuma figure{margin:0 0 18px;text-align:center}
.okuma figure img{
  max-width:100%;height:auto;border-radius:8px;border:1px solid var(--cizgi);
  background:#FFF;min-height:40px;
}
.okuma figcaption{font-size:13px;color:var(--sonuk);margin-top:6px}
.okuma .baslik-hedef{animation:parla 1.6s ease-out}
@keyframes parla{from{background:var(--vurgu-zemin)}to{background:transparent}}

/* ---- Soru ekleri ---- */
.soru .metin code,.secenek code,.izah code,.kart-yuz code,.esles-oge code{
  font-family:var(--mono);font-size:.9em;background:var(--vurgu-zemin);color:var(--vurgu);
  padding:1px 4px;border-radius:4px;word-break:break-word;
}
.soru-kod{
  margin:12px 0 0;padding:11px 12px;background:var(--yuzey2);border:1px solid var(--cizgi);
  border-left:3px solid var(--vurgu);border-radius:8px;font-size:13.5px;line-height:1.6;overflow-x:auto;
}
.soru-kod code{font-family:var(--mono);color:var(--yazi);white-space:pre}
.dy-dugmeler{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.dy-dugmeler .secenek{justify-content:center;font-weight:600;padding:15px 10px}
.bosluk-metin{font-size:16px;line-height:2.1;margin:6px 0 0}
.bosluk-girdi{
  display:inline-block;width:8.5em;max-width:100%;padding:3px 8px;margin:0 2px;
  border:0;border-bottom:2px solid var(--vurgu);border-radius:5px 5px 0 0;
  background:var(--vurgu-zemin);font-size:16px;line-height:1.5;
}
.bosluk-girdi:focus{outline:2px solid var(--vurgu);outline-offset:1px}
.bosluk-girdi.dogru{border-color:var(--dogru);background:var(--dogru-zemin)}
.bosluk-girdi.yanlis{border-color:var(--yanlis);background:var(--yanlis-zemin)}
.hesap-satir{display:flex;gap:8px;align-items:center;margin-top:14px}
.hesap-satir input{
  flex:1;min-width:0;padding:13px;border-radius:10px;border:1px solid var(--cizgi);
  background:var(--yuzey2);font-family:var(--mono);font-size:17px;
}
.hesap-satir input:focus{outline:2px solid var(--vurgu);outline-offset:-1px}
.hesap-satir input.dogru{border-color:var(--dogru);background:var(--dogru-zemin)}
.hesap-satir input.yanlis{border-color:var(--yanlis);background:var(--yanlis-zemin)}
.hesap-satir .birim{font-family:var(--mono);color:var(--sonuk);font-size:15px;flex:none}
.klasik-girdi{
  width:100%;min-height:110px;margin-top:14px;padding:12px;border-radius:10px;
  border:1px solid var(--cizgi);background:var(--yuzey2);font:inherit;font-size:16px;line-height:1.55;
  resize:vertical;color:var(--yazi);
}
.klasik-girdi:focus{outline:2px solid var(--vurgu);outline-offset:-1px}
.ornek-cevap{
  margin-top:14px;padding:12px 13px;border-radius:9px;background:var(--dogru-zemin);
  border-left:3px solid var(--dogru);font-size:14.5px;line-height:1.6;
}
.ornek-cevap p{margin:0 0 8px}
.ornek-cevap p:last-child{margin:0}
.anahtarlar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.anahtar{
  font-size:12.5px;padding:4px 8px;border-radius:6px;border:1px solid var(--cizgi);color:var(--sonuk);
}
.anahtar.var{border-color:var(--dogru);color:var(--dogru);background:var(--dogru-zemin)}
.oz-puan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.oz-puan button{
  padding:12px 6px;border-radius:10px;border:1px solid var(--cizgi);background:var(--yuzey);
  font-size:14px;color:var(--yazi);
}
.oz-puan button.bildim{border-color:var(--dogru);color:var(--dogru)}
.oz-puan button.bilemedim{border-color:var(--yanlis);color:var(--yanlis)}

/* ---- Kapsam (ders ve konu seçimi) ---- */
.kontrol-oge.kismi .kutucuk{background:var(--vurgu-zemin);border-color:var(--vurgu);color:var(--vurgu)}
.kontrol-oge .ileri{margin-left:auto;color:var(--vurgu);font-family:var(--mono);flex:none;padding-left:8px}
.kontrol-oge .alt-yazi{display:block;color:var(--sonuk);font-size:12.5px;margin-top:3px}

/* ---------- Cihaza özel küçük ayarlar: localStorage yoksa hafızaya düşer ---------- */
const depo = (() => {

      catch (e) { yedek[anahtar] = d; }

    sil(anahtar) {

})();

/* ---------- Gece / gündüz modu ---------- */
const AY_IKON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>';
const GUNES_IKON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>';
