/* ---------- Görseller: cihazda yoksa hesaptan indirilir ---------- */
const gorselAdresleri = new Map();
async function gorselleriYukle(kok) {
  const resimler = Array.from(kok.querySelectorAll("img[data-yol]"));
  for (const img of resimler) {
    const yol = img.dataset.yol;
    try {
      let adres = gorselAdresleri.get(yol);
      if (!adres) {
        let kayitli = await vt.oku("gorsel", yol);
        if (!kayitli && istemci && navigator.onLine) {
          const r = await istemci.storage.from("gorseller").download(yol);
          if (r.error) throw r.error;
          kayitli = { yol, blob: r.data };
          await vt.yaz("gorsel", kayitli);
        }
        if (!kayitli) { img.alt = img.alt + " (görsel bağlantı gelince yüklenecek)"; continue; }
        adres = URL.createObjectURL(kayitli.blob);
        gorselAdresleri.set(yol, adres);
      }
      img.src = adres;
    } catch (e) {
      console.warn("görsel yüklenemedi", yol, e);
    }
  }
}

/* ---------- Konu: okuma ekranı ---------- */
/* Okuma gövdesi: boyaların konumu bu gövdenin metnine göre sayılır; mühim
   hesabı da aynı gövdeyi (görünmeden) kurar. İkisi ayrışmasın diye tek yer. */
function konuGovdesi(konu) {
  const govde = olustur("article", "okuma");
  govde.innerHTML = "<h2>" + kacir(konuEtiketi(konu)) + "</h2>" + markdownCiz(konu.metin, konu.ders);
  return govde;
}

function konuAc(konuId, geriIslev, vurguSorgusu, kaydirmaYeri, hedefBaslik) {
  const konu = KONULAR.get(konuId);
  if (!konu) return;
  if (sesDurumu && sesDurumu.konu !== konuId) sesDurdur();
  if (geriIslev) derinlesGit(geriIslev);
  if (!(kayit("yer", "son") || {}).konu || kayit("yer", "son").konu !== konuId) kayitYaz("yer", "son", { konu: konuId });
  okuAcik = { tur: "konu", konu: konuId };
  const kardesler = DERS_KONULARI.get(konu.ders) || [];
  const sira = kardesler.indexOf(konu);
  const sayfa = $("#sayfaOku");
  sayfa.innerHTML = "";

  const ust = olustur("div", "okuma-ust");
  const geri = olustur("button", "geri");
  geri.textContent = "‹ Geri";
  geri.addEventListener("click", () => {
    /* Geçmişte adım yoksa (ör. sekme yeniden çizildi) derse dönülür */
    if (geriYigini.length && geriYigini[geriYigini.length - 1].sekme === "oku") geriDon();
    else dersCiz(konu.ders, null);
  });
  const bosluk = olustur("span", "bosluk");
  const kucult_ = olustur("button", "boyut-dugme");
  kucult_.textContent = "A−";
  kucult_.setAttribute("aria-label", "Yazıyı küçült");
  kucult_.disabled = yaziKademesi === 0;
  kucult_.addEventListener("click", () => { boyutDegistir(-1); konuAc(konuId, null, vurguSorgusu, window.scrollY || 0); });
  const buyut = olustur("button", "boyut-dugme");
  buyut.textContent = "A+";
  buyut.setAttribute("aria-label", "Yazıyı büyült");
  buyut.disabled = yaziKademesi === BOYUTLAR.length - 1;
  buyut.addEventListener("click", () => { boyutDegistir(1); konuAc(konuId, null, vurguSorgusu, window.scrollY || 0); });
  ust.append(geri, bosluk, kucult_, buyut);
  if (sesDestegiVar()) {
    const dinle = olustur("button", "boyut-dugme dinle-dugme");
    dinle.textContent = "▶";
    dinle.setAttribute("aria-label", "Konuyu sesli oku");
    dinle.addEventListener("click", () => sesBaslat(konuId));
    ust.appendChild(dinle);
  }
  sayfa.appendChild(ust);

  const govde = konuGovdesi(konu);
  sayfa.appendChild(govde);
  menuyuKapat();
  boyalariUygula(govde, konuBoyalari(konuId));
  muhimIsaretleriniKur(govde, konu);
  gorselleriYukle(govde);
  /* Aynı konu yeniden çizildiyse (yazı boyutu, boya, "Okudum") sesli okuma
     eski, sayfadan kalkmış öğeleri gösteriyordur; parçalar yeniden kurulur. */
  if (sesDurumu && sesDurumu.konu === konuId) {
    sesDurumu.parcalar = okumaParcalari(govde);
    if (sesDurumu.i >= sesDurumu.parcalar.length) sesDurumu.i = Math.max(0, sesDurumu.parcalar.length - 1);
    const p = sesDurumu.parcalar[sesDurumu.i];
    if (p) p.el.classList.add("okunuyor");
  }

  /* Uzun konularda baştan bir yol haritası: alt başlıklara atlama */
  const altBasliklar = Array.from(govde.querySelectorAll("h3"));
  const muhimDurum = konuMuhimDurumu(konu);
  const icindeMuhim = h3 => h3.classList.contains("muhim") ||
    Array.from(muhimDurum.basliklar.values()).some(b => b.ust === h3.dataset.baslik);
  if (altBasliklar.length >= 5) {
    const icindekiler = olustur("nav", "icindekiler");
    altBasliklar.forEach(h3 => {
      const d = olustur("button", icindeMuhim(h3) ? "muhim" : "");
      if (icindeMuhim(h3)) d.appendChild(olustur("span", "muhim-imi"));
      d.appendChild(document.createTextNode(h3.textContent));
      d.addEventListener("click", () => {
        if (typeof h3.scrollIntoView === "function") {
          try { h3.scrollIntoView({ block: "start" }); } catch (e) {}
        }
      });
      icindekiler.appendChild(d);
    });
    govde.insertBefore(icindekiler, govde.querySelector("h2").nextSibling);
  }

  let kaydirilacak = null;
  if (hedefBaslik) {
    kaydirilacak = Array.from(govde.querySelectorAll("[data-baslik]")).find(h => h.dataset.baslik === hedefBaslik) || null;
    if (kaydirilacak) kaydirilacak.classList.add("baslik-hedef");
  }
  if (vurguSorgusu) {
    const ilk = vurgula(govde, vurguSorgusu);
    if (ilk && !kaydirilacak) kaydirilacak = ilk;
  }

  const isaretli = okundu(konuId);
  const isaret = olustur("button", "okundu-dugme" + (isaretli ? " isaretli" : ""));
  isaret.textContent = isaretli ? "✓ Okundu olarak işaretli" : "Okudum olarak işaretle";
  isaret.addEventListener("click", () => {
    if (okundu(konuId)) kayitSil("okundu", konuId); else kayitYaz("okundu", konuId, true);
    konuAc(konuId, null, null, window.scrollY || 0);
  });
  sayfa.appendChild(isaret);

  /* Tashih: konuyu ve dersini hazır yazan bir e-posta açılır */
  const bildir = olustur("a", "hata-bildir");
  bildir.textContent = "Bu konuda hata mı var? Bildir";
  bildir.href = "mailto:" + AYAR.TASHIH_EPOSTA +
    "?subject=" + encodeURIComponent("Tashih: " + dersAdi(konu.ders) + " › " + konuEtiketi(konu)) +
    "&body=" + encodeURIComponent("Konu: " + konu.id + "\n\nHatalı kısım:\n\nDoğrusu:\n");
  sayfa.appendChild(bildir);

  const alt = olustur("div", "okuma-alt");
  const onceki = olustur("button");
  onceki.textContent = "‹ Önceki";
  onceki.disabled = sira <= 0;
  onceki.addEventListener("click", () => { konuAc(kardesler[sira - 1].id); });
  const sonraki = olustur("button");
  sonraki.textContent = "Sonraki ›";
  sonraki.disabled = sira === -1 || sira >= kardesler.length - 1;
  sonraki.addEventListener("click", () => { konuAc(kardesler[sira + 1].id); });
  alt.append(onceki, sonraki);
  sayfa.appendChild(alt);

  okuKaydirma = kaydirmaYeri || 0;
  if (kaydirilacak && typeof kaydirilacak.scrollIntoView === "function") {
    try { kaydirilacak.scrollIntoView({ block: kaydirilacak.tagName === "MARK" ? "center" : "start" }); } catch (e) {}
  } else window.scrollTo(0, okuKaydirma);
}

/* ==========================================================================
   Sesli okuma — ekran açıkken çalışır (tarayıcılar arka planda konuşmayı keser)
   ========================================================================== */
let sesDurumu = null;      /* {parcalar, i, duraklatildi, konu} */
/* Her iptalde artar: iptal edilen sözün geç gelen onend/onerror'u sırayı
   ilerletmesin (konuşma oturumu yerine tek ve hep artan sayaç) */
let sesNesli = 0;
let uyanikKilit = null;
let kilitEkrani = null;

function sesDestegiVar() {
  return typeof window !== "undefined" && !!window.speechSynthesis &&
         typeof window.SpeechSynthesisUtterance === "function";
}

/* Kod blokları ve tablolar atlanır: sesli okumak faydadan çok gürültü. */
function okumaParcalari(govde) {
  const parcalar = [];
  const ogeler = [];
  Array.from(govde.children).forEach(el => {
    if (["H2", "H3", "H4", "P"].includes(el.tagName)) ogeler.push(el);
    else if (el.tagName === "UL" || el.tagName === "OL") Array.from(el.children).forEach(li => ogeler.push(li));
    else if (el.tagName === "BLOCKQUOTE") Array.from(el.children).forEach(p => ogeler.push(p));
  });
  ogeler.forEach(el => {
    const metin = (el.textContent || "").replace(/\s+/g, " ").trim();
    if (!metin) return;
    /* Uzun paragrafları cümlelere böl: bazı tarayıcılar uzun sözü yarıda keser */
    const cumleler = metin.split(/(?<=[.!?:])\s+/);
    let tampon = "";
    cumleler.forEach(c => {
      if ((tampon + " " + c).trim().length > 180 && tampon) { parcalar.push({ el, metin: tampon.trim() }); tampon = c; }
      else tampon = (tampon + " " + c).trim();
    });
    if (tampon) parcalar.push({ el, metin: tampon });
  });
  return parcalar;
}

function tumSesler() {
  try { return window.speechSynthesis.getVoices() || []; } catch (e) { return []; }
}

/* Türkçe metni yabancı bir sesle okutmanın anlamı yok: liste Türkçeyle sınırlı.
   Cihazda hiç Türkçe ses yoksa hepsi gösterilir. */
function turkceSesler() {
  const hepsi = tumSesler();
  const turkler = hepsi.filter(s => s.lang && s.lang.toLowerCase().indexOf("tr") === 0);
  return turkler.length ? turkler : hepsi;
}

/* Ses tonu (kalın ↔ ince) ve okuma hızı */
const TON_KADEMELERI = [
  { deger: 0.7, ad: "çok kalın" }, { deger: 0.85, ad: "kalın" },
  { deger: 1, ad: "normal" }, { deger: 1.2, ad: "ince" }, { deger: 1.4, ad: "çok ince" }
];
const HIZ_KADEMELERI = [
  { deger: 0.7, ad: "çok yavaş" }, { deger: 0.85, ad: "yavaş" },
  { deger: 1, ad: "normal" }, { deger: 1.2, ad: "hızlı" }, { deger: 1.5, ad: "çok hızlı" }
];

function tonKademesi() {
  const k = depo.oku("pg.ton", 2);
  return typeof k === "number" && k >= 0 && k < TON_KADEMELERI.length ? k : 2;
}
function hizKademesi() {
  const k = depo.oku("pg.hiz", 2);
  return typeof k === "number" && k >= 0 && k < HIZ_KADEMELERI.length ? k : 2;
}

/* Kullanıcı bir ses seçtiyse o, yoksa ilk Türkçe ses, o da yoksa varsayılan */
function secilenSes() {
  const sesler = turkceSesler();
  const kayitli = depo.oku("pg.ses", null);
  if (kayitli) {
    const bulunan = sesler.find(s => s.name === kayitli);
    if (bulunan) return bulunan;
  }
  return sesler[0] || null;
}

/* Ayar değişince okuma sürüyorsa bulunduğu parça yeni ayarla baştan söylenir */
function sesAyariDegisti() {
  if (sesDurumu && !sesDurumu.duraklatildi) {
    sesNesli++;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    sesSonrakiParca();
  }
  oynatmaCubuguTazele();
}

function sesiDegistir(ad) {
  depo.yaz("pg.ses", ad);
  sesAyariDegisti();
}

/* Ses listesi bazı tarayıcılarda gecikmeli gelir */
function sesAyarlariAc() {
  const perde = olustur("div", "panel-perde");
  perde.addEventListener("click", olay => { if (olay.target === perde) geriDon(); });
  const panel = olustur("div", "panel");
  const ust = olustur("div", "panel-ust");
  const baslik = olustur("h3");
  baslik.textContent = "Ses ayarları";
  const kapat = olustur("button", "panel-kapat");
  kapat.textContent = "×";
  kapat.setAttribute("aria-label", "Kapat");
  kapat.addEventListener("click", () => geriDon());
  ust.append(baslik, kapat);
  panel.appendChild(ust);

  const govde = olustur("div", "panel-govde");
  panel.appendChild(govde);

  /* Kademe seçici: ton ve hız için ortak */
  function kademeCiz(baslik, kademeler, simdiki, secildi) {
    const b = olustur("div", "metin-basligi");
    b.textContent = baslik;
    govde.appendChild(b);
    const satir = olustur("div", "kademe-satiri");
    kademeler.forEach((k, i) => {
      const d = olustur("button", "kademe" + (i === simdiki ? " secili" : ""));
      d.textContent = k.ad;
      d.addEventListener("click", () => secildi(i));
      satir.appendChild(d);
    });
    govde.appendChild(satir);
  }

  function listeyiCiz() {
    govde.innerHTML = "";
    const sesler = turkceSesler();
    if (!sesler.length) {
      const bos = olustur("p", "bos");
      bos.textContent = "Cihazınızda kayıtlı konuşma sesi bulunamadı. Telefon ayarlarından bir Türkçe ses indirirseniz burada görünür; ton ve hız yine de çalışır.";
      govde.appendChild(bos);
    } else {
      const secili = secilenSes();
      const b = olustur("div", "metin-basligi");
      b.textContent = sesler.length > 1 ? "ses" : "ses (cihazınızda tek seçenek var)";
      govde.appendChild(b);
      sesler.forEach(s => {
        const d = olustur("button", "fihrist-satir" + (secili && s.name === secili.name ? " secili" : ""));
        d.textContent = s.name;
        d.addEventListener("click", () => { sesiDegistir(s.name); listeyiCiz(); });
        govde.appendChild(d);
      });
    }

    kademeCiz("ses tonu", TON_KADEMELERI, tonKademesi(), i => {
      depo.yaz("pg.ton", i); sesAyariDegisti(); listeyiCiz();
    });
    kademeCiz("okuma hızı", HIZ_KADEMELERI, hizKademesi(), i => {
      depo.yaz("pg.hiz", i); sesAyariDegisti(); listeyiCiz();
    });

    /* Okuma sürerken ayar zaten anında duyuluyor; duruyorsa örnek çalınır */
    if (!sesDurumu) {
      const dene = olustur("button", "dene-dugme");
      dene.textContent = "Dene";
      dene.addEventListener("click", () => {
        try {
          window.speechSynthesis.cancel();
          const soz = new window.SpeechSynthesisUtterance("Programcılık ders notları. Ses bu tonda ve bu hızda okunacak.");
          sesAyarlariniUygula(soz);
          window.speechSynthesis.speak(soz);
        } catch (e) {}
      });
      govde.appendChild(dene);
    }
  }
  listeyiCiz();
  try { window.speechSynthesis.onvoiceschanged = listeyiCiz; } catch (e) {}

  perde.appendChild(panel);
  document.body.appendChild(perde);
  derinlesGit(() => {
    perde.remove();
    /* Liste kapandıktan sonra dinleyici boşa çalışmasın */
    try { window.speechSynthesis.onvoiceschanged = null; } catch (e) {}
  });
}

async function ekranUyanikTut() {
  try {
    if (navigator.wakeLock && !uyanikKilit) {
      const kilit = await navigator.wakeLock.request("screen");
      /* İstek sürerken okuma durdurulduysa kilit tutulmaz */
      if (!sesDurumu || sesDurumu.duraklatildi || uyanikKilit) { kilit.release(); return; }
      uyanikKilit = kilit;
    }
  } catch (e) { /* desteklenmiyorsa sessizce geç */ }
}
function ekranUyanikBirak() {
  try { if (uyanikKilit) { uyanikKilit.release(); uyanikKilit = null; } } catch (e) { uyanikKilit = null; }
}
/* Ekran kapanıp açılırsa kilidi yeniden al */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && sesDurumu && !sesDurumu.duraklatildi) ekranUyanikTut();
});

function okunanIsareti(el) {
  const eski = document.querySelector(".okuma .okunuyor");
  if (eski) eski.classList.remove("okunuyor");
  if (!el) return;
  el.classList.add("okunuyor");
  if (!kilitEkrani && typeof el.scrollIntoView === "function") {
    try { el.scrollIntoView({ block: "center" }); } catch (e) {}
  }
}

/* Dil, ses, ton ve hızı tek yerden uygular */
function sesAyarlariniUygula(soz) {
  soz.lang = "tr-TR";
  const ses = secilenSes();
  if (ses) soz.voice = ses;
  soz.pitch = TON_KADEMELERI[tonKademesi()].deger;
  soz.rate = HIZ_KADEMELERI[hizKademesi()].deger;
}

function sesDurdur() {
  sesNesli++;
  /* resume: Chrome'da duraklatılmış konuşma iptal edilince sonraki speak()
     sessiz kalabiliyor */
  try { if (sesDestegiVar()) { window.speechSynthesis.cancel(); window.speechSynthesis.resume(); } } catch (e) {}
  sesDurumu = null;
  okunanIsareti(null);
  ekranUyanikBirak();
  kilitEkraniniKapat();
  const cubuk = document.querySelector(".oynatma");
  if (cubuk) cubuk.remove();
}

function sesSonrakiParca() {
  if (!sesDurumu) return;
  if (sesDurumu.i >= sesDurumu.parcalar.length) { sesDurdur(); return; }
  const parca = sesDurumu.parcalar[sesDurumu.i];
  okunanIsareti(parca.el);
  const soz = new window.SpeechSynthesisUtterance(parca.metin);
  sesAyarlariniUygula(soz);
  /* Ses değiştirilirse eski söz iptal edilir; onun onend'i sırayı ilerletmesin */
  const nesil = sesNesli;
  const gecerliMi = () => sesDurumu && !sesDurumu.duraklatildi && nesil === sesNesli;
  soz.onend = () => { if (gecerliMi()) { sesDurumu.i++; sesSonrakiParca(); } };
  soz.onerror = () => { if (gecerliMi()) { sesDurumu.i++; sesSonrakiParca(); } };
  try { window.speechSynthesis.speak(soz); } catch (e) { sesDurdur(); }
  oynatmaCubuguTazele();
}

function sesBaslat(konuId, baslangicEl) {
  const govde = document.querySelector("#sayfaOku .okuma");
  if (!govde || !sesDestegiVar()) return;
  sesDurdur();
  const parcalar = okumaParcalari(govde);
  if (!parcalar.length) return;
  /* Bir paragraf verildiyse okuma oradan başlar */
  let baslangic = 0;
  if (baslangicEl) {
    const yer = parcalar.findIndex(p => p.el === baslangicEl);
    if (yer !== -1) baslangic = yer;
  }
  sesDurumu = { parcalar, i: baslangic, duraklatildi: false, konu: konuId };
  ekranUyanikTut();
  oynatmaCubuguCiz();
  sesSonrakiParca();
}

function sesDuraklat() {
  if (!sesDurumu) return;
  sesDurumu.duraklatildi = true;
  try { window.speechSynthesis.pause(); } catch (e) {}
  ekranUyanikBirak();
  oynatmaCubuguTazele();
}
function sesDevam() {
  if (!sesDurumu) return;
  sesDurumu.duraklatildi = false;
  ekranUyanikTut();
  try {
    window.speechSynthesis.resume();
    /* Bazı tarayıcılarda resume çalışmaz; kaldığı parçadan yeniden söyletiriz */
    if (!window.speechSynthesis.speaking) { sesNesli++; window.speechSynthesis.cancel(); sesSonrakiParca(); }
  } catch (e) { sesNesli++; sesSonrakiParca(); }
  oynatmaCubuguTazele();
}

/* ---- Oynatma çubuğu ---- */
function oynatmaCubuguCiz() {
  const eski = document.querySelector(".oynatma");
  if (eski) eski.remove();
  menuyuKapat();          /* seçim çubuğu okuma çubuğunun altında kalmasın */
  const cubuk = olustur("div", "oynatma");

  const ustSatir = olustur("div", "oynatma-ust");
  const bilgi = olustur("div", "bilgi");
  const sesDugmesi = olustur("button", "ses-dugme");
  sesDugmesi.addEventListener("click", sesAyarlariAc);
  ustSatir.append(bilgi, sesDugmesi);

  const altSatir = olustur("div", "dugmeler");
  const durak = olustur("button", "yuvarlak");
  durak.addEventListener("click", () => (sesDurumu && sesDurumu.duraklatildi ? sesDevam() : sesDuraklat()));
  const kilit = olustur("button", "yazili");
  kilit.textContent = "Kilitle";
  kilit.addEventListener("click", kilitEkraniniAc);
  const kapat = olustur("button", "yazili");
  kapat.textContent = "Bitir";
  kapat.addEventListener("click", sesDurdur);
  altSatir.append(durak, kilit, kapat);

  cubuk.append(ustSatir, altSatir);
  document.body.appendChild(cubuk);
  oynatmaCubuguTazele();
}

function oynatmaCubuguTazele() {
  const cubuk = document.querySelector(".oynatma");
  if (!cubuk || !sesDurumu) return;
  cubuk.querySelector(".bilgi").textContent =
    (sesDurumu.duraklatildi ? "Duraklatıldı" : "Okunuyor") +
    " · " + (sesDurumu.i + 1) + "/" + sesDurumu.parcalar.length;
  cubuk.querySelector(".yuvarlak").textContent = sesDurumu.duraklatildi ? "▶" : "❚❚";
  cubuk.querySelector(".yuvarlak").setAttribute("aria-label", sesDurumu.duraklatildi ? "Devam et" : "Duraklat");
  const kilitDugmesi = cubuk.querySelector("button.yazili");
  if (kilitDugmesi) kilitDugmesi.disabled = !!sesDurumu.duraklatildi;
  const sesDugmesi = cubuk.querySelector(".ses-dugme");
  if (sesDugmesi) {
    const ses = secilenSes();
    sesDugmesi.textContent = (ses ? ses.name : "Ses") +
      " · " + TON_KADEMELERI[tonKademesi()].ad + " · " + HIZ_KADEMELERI[hizKademesi()].ad;
  }
}

/* ---- Cep kilidi: dokunuşlar geçmesin ---- */
function kilitEkraniniKapat() {
  if (kilitEkrani) { kilitEkrani.remove(); kilitEkrani = null; }
}

function kilitEkraniniAc() {
  if (kilitEkrani || !sesDurumu) return;
  const perde = olustur("div", "kilit-perde");
  const kutu = olustur("div", "kilit-kutu");
  const baslik = olustur("div", "kilit-baslik");
  baslik.textContent = "Ekran kilitli";
  const alt = olustur("div", "kilit-alt");
  const k = KONULAR.get(sesDurumu.konu);
  alt.textContent = k ? konuEtiketi(k) + " okunuyor" : "Okunuyor";
  const ipucu = olustur("div", "kilit-ipucu");
  ipucu.textContent = "Açmak için düğmeyi basılı tutun";

  const ac = olustur("button", "kilit-dugme");
  const etiket = olustur("span", "etiket");
  etiket.textContent = "Basılı tutun";
  const serit = olustur("span", "serit");
  const dolgu = olustur("span", "dolgu");
  serit.appendChild(dolgu);
  ac.append(etiket, serit);
  let sayac = null;
  const basla = () => {
    /* İkinci parmak ilk sayacı kaybettirmesin: kalan tek sayaç da birak'ta durur */
    if (sayac) clearTimeout(sayac);
    ac.classList.add("basiliyor");          /* dolgu 1,5 saniyede dolar */
    etiket.textContent = "Bırakma…";
    sayac = setTimeout(() => {
      ac.classList.remove("basiliyor");
      etiket.textContent = "Açılıyor";
      kilitEkraniniKapat();
    }, 1500);
  };
  const birak = () => {
    ac.classList.remove("basiliyor");
    etiket.textContent = "Basılı tutun";
    if (sayac) { clearTimeout(sayac); sayac = null; }
  };
  ac.addEventListener("touchstart", basla, { passive: true });
  ac.addEventListener("touchend", birak);
  ac.addEventListener("touchcancel", birak);
  ac.addEventListener("mousedown", basla);
  ac.addEventListener("mouseup", birak);
  ac.addEventListener("mouseleave", birak);

  kutu.append(baslik, alt, ipucu, ac);
  perde.appendChild(kutu);
  /* Kilitliyken perdenin altına hiçbir dokunuş geçmez */
  ["click", "touchstart", "touchend", "touchmove"].forEach(tur =>
    perde.addEventListener(tur, olay => { if (olay.target === perde || olay.target === kutu) olay.preventDefault(); }));
  document.body.appendChild(perde);
  kilitEkrani = perde;
}

/* ==========================================================================
   Boyama — seçilen metni kırmızıya boyar, hesapta saklanır.
   Konum karakter sayısıyla değil, boyanan metin ve iki yanındaki birkaç
   karakterle tutulur: hoca notu düzeltse de boya doğru yeri bulur.
   ========================================================================== */
const BOYA_BAGLAM = 32;

function konuBoyalari(konuId) {
  const d = kayit("boya", konuId);
  return Array.isArray(d) ? d.filter(a => a && typeof a.alinti === "string" && a.alinti.length) : [];
}

/* Sayım yapılan metin düğümleri: içindekiler listesi sayıma girmez */
function govdeMetinDugumleri(govde) {
  const liste = [];
  const yurutec = document.createTreeWalker(govde, NodeFilter.SHOW_TEXT, {
    acceptNode(dugum) {
      let el = dugum.parentElement;
      while (el && el !== govde) {
        if (el.classList && (el.classList.contains("icindekiler") || el.classList.contains("muhim-dugme"))) return NodeFilter.FILTER_REJECT;
        el = el.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  while (yurutec.nextNode()) liste.push(yurutec.currentNode);
  return liste;
}

/* Bir çapayı (alıntı + bağlam) tam metinde konuma çevirir.
   Alıntı birden çok yerde geçiyorsa bağlamı en çok tutan seçilir. */
function capayiBul(tamMetin, capa) {
  let en = null, enPuan = -1, yer = tamMetin.indexOf(capa.alinti);
  while (yer !== -1) {
    const once = tamMetin.slice(Math.max(0, yer - BOYA_BAGLAM), yer);
    const sonra = tamMetin.slice(yer + capa.alinti.length, yer + capa.alinti.length + BOYA_BAGLAM);
    let puan = 0;
    const o = capa.once || "", s = capa.sonra || "";
    for (let i = 1; i <= Math.min(o.length, once.length) && o[o.length - i] === once[once.length - i]; i++) puan++;
    for (let i = 0; i < Math.min(s.length, sonra.length) && s[i] === sonra[i]; i++) puan++;
    if (puan > enPuan) { enPuan = puan; en = yer; }
    yer = tamMetin.indexOf(capa.alinti, yer + 1);
  }
  return en === null ? null : { bas: en, son: en + capa.alinti.length };
}

function araliktanCapa(tamMetin, a) {
  return {
    alinti: tamMetin.slice(a.bas, a.son),
    once: tamMetin.slice(Math.max(0, a.bas - BOYA_BAGLAM), a.bas),
    sonra: tamMetin.slice(a.son, a.son + BOYA_BAGLAM)
  };
}

/* Üst üste binen ya da uç uca gelen aralıkları tek parçaya indirir */
function araliklariBirlestir(liste) {
  const sirali = liste.slice().sort((a, b) => a.bas - b.bas);
  const sonuc = [];
  sirali.forEach(a => {
    const onceki = sonuc[sonuc.length - 1];
    if (onceki && a.bas <= onceki.son) onceki.son = Math.max(onceki.son, a.son);
    else sonuc.push({ bas: a.bas, son: a.son });
  });
  return sonuc;
}
/* Bir aralığı listeden çıkarır (boyayı silmek için) */
function aralikCikar(liste, kes) {
  const sonuc = [];
  liste.forEach(a => {
    if (kes.son <= a.bas || kes.bas >= a.son) { sonuc.push(a); return; }
    if (kes.bas > a.bas) sonuc.push({ bas: a.bas, son: kes.bas });
    if (kes.son < a.son) sonuc.push({ bas: kes.son, son: a.son });
  });
  return sonuc;
}

/* Seçimin konu metnindeki karakter aralığı */
function secimAraligi(govde) {
  const secim = window.getSelection && window.getSelection();
  if (!secim || secim.rangeCount === 0 || secim.isCollapsed) return null;
  const aralik = secim.getRangeAt(0);
  const dugumler = govdeMetinDugumleri(govde);
  let sayac = 0, bas = null, son = null;
  for (const dugum of dugumler) {
    const uzunluk = dugum.nodeValue.length;
    let kesisiyor = false;
    try { kesisiyor = aralik.intersectsNode(dugum); }
    catch (e) { kesisiyor = dugum === aralik.startContainer || dugum === aralik.endContainer; }
    if (kesisiyor) {
      let yerelBas = 0, yerelSon = uzunluk;
      if (dugum === aralik.startContainer) yerelBas = aralik.startOffset;
      if (dugum === aralik.endContainer) yerelSon = aralik.endOffset;
      if (yerelSon > yerelBas) {
        if (bas === null) bas = sayac + yerelBas;
        son = sayac + yerelSon;
      }
    }
    sayac += uzunluk;
  }
  if (bas === null || son === null || son <= bas) return null;
  return { bas, son };
}

/* Kayıtlı çapaları bu metindeki aralıklara çevirir; bulunamayanlar atlanır */
function boyaAraliklari(tamMetin, capalar) {
  return araliklariBirlestir(capalar.map(c => capayiBul(tamMetin, c)).filter(Boolean));
}

/* Kayıtlı boyaları sayfaya işler */
function boyalariUygula(govde, capalar) {
  if (!capalar.length) return;
  const dugumler = govdeMetinDugumleri(govde);
  const tamMetin = dugumler.map(d => d.nodeValue).join("");
  const gecerli = boyaAraliklari(tamMetin, capalar);
  if (!gecerli.length) return;
  let sayac = 0;
  dugumler.forEach(dugum => {
    const metin = dugum.nodeValue;
    const bas = sayac, son = sayac + metin.length;
    sayac = son;
    const kesisen = gecerli.filter(a => a.bas < son && a.son > bas);
    if (!kesisen.length) return;
    const parca = document.createDocumentFragment();
    let yer = 0;
    kesisen.forEach(a => {
      const b1 = Math.max(0, a.bas - bas), s1 = Math.min(metin.length, a.son - bas);
      if (s1 <= yer) return;
      if (b1 > yer) parca.appendChild(document.createTextNode(metin.slice(yer, b1)));
      const boya = document.createElement("span");
      boya.className = "boyali";
      boya.textContent = metin.slice(Math.max(b1, yer), s1);
      parca.appendChild(boya);
      yer = s1;
    });
    if (yer < metin.length) parca.appendChild(document.createTextNode(metin.slice(yer)));
    dugum.parentNode.replaceChild(parca, dugum);
  });
}

/* Bir aralığın tamamı boyalı mı? Kısmen boyalıysa üzerine boyamaya devam edilir. */
function tamamenBoyaliMi(aralik, govde, konuId) {
  const tamMetin = govdeMetinDugumleri(govde).map(d => d.nodeValue).join("");
  return boyaAraliklari(tamMetin, konuBoyalari(konuId)).some(a => a.bas <= aralik.bas && a.son >= aralik.son);
}

/* Seçimi boyar ya da boyayı siler, sonra konuyu yerinde yeniden çizer */
function boyaDegistir(aralik, sil) {
  if (!okuAcik || okuAcik.tur !== "konu" || !aralik) return;
  const konuId = okuAcik.konu;
  const govde = document.querySelector("#sayfaOku .okuma");
  if (!govde) return;
  const tamMetin = govdeMetinDugumleri(govde).map(d => d.nodeValue).join("");
  const mevcut = boyaAraliklari(tamMetin, konuBoyalari(konuId));
  const yeni = sil ? aralikCikar(mevcut, aralik) : araliklariBirlestir(mevcut.concat([aralik]));
  /* Metin değiştiği için şu an bulunamayan boyalar atılmaz: aynen saklanır
     (not ileride eski hâline dönebilir; kullanıcının emeği sessizce silinmesin) */
  const bulunamayan = konuBoyalari(konuId).filter(c => !capayiBul(tamMetin, c)).slice(-50);
  const saklanacak = yeni.map(a => araliktanCapa(tamMetin, a)).concat(bulunamayan);
  if (saklanacak.length) kayitYaz("boya", konuId, saklanacak);
  else kayitSil("boya", konuId);
  const nerede = window.scrollY || window.pageYOffset || 0;
  secimiTemizle();
  konuAc(konuId, null, null, nerede);
  kisaBildirim(sil ? "Boya silindi" : "Boyandı");
}

/* ==========================================================================
   Mühim yerler — konunun tamamı ya da bir alt başlık mühim olur.
   İki kaynak var:
     - elle: başlığın yanındaki işarete dokunulur; hesapta "muhim" kaydı
       anahtar "<konuId>" (konunun tamamı) ya da "<konuId>#<başlık metni>"
     - boya: boyalı yer hangi başlığın altındaysa o başlık mühim görünür;
       konuda herhangi bir boya varsa konu da mühim görünür
   Boyadan gelen işaret elle kaldırılamaz; boya silinince kendiliğinden gider.
   Başlık metni notta değişirse ona konan işaret görünmez olur ama silinmez
   (başlık eski hâline dönerse geri gelir).
   ========================================================================== */
const MUHIM_AYRAC = "#";
/* Listelerde başlığın görünen hâli: ** ve ` işaretleri atılır (anahtar ham metindir) */
function baslikYazisi(metin) { return String(metin).replace(/\*\*/g, "").replace(/`/g, ""); }
function muhimAnahtari(konuId, baslik) { return baslik ? konuId + MUHIM_AYRAC + baslik : konuId; }
function elleMuhimMi(konuId, baslik) { return kayit("muhim", muhimAnahtari(konuId, baslik)) !== undefined; }

/* Boyalı yerler hangi bölümde: { giris, basliklar: Set<başlık metni> }.
   giris: ilk başlıktan önceki kısım (konu adı dahil). Sonuç, boya kaydı ve
   konu değişmedikçe yeniden hesaplanmaz. */
const boyaBolumuOnbellegi = new Map();   /* konuId → { kayitNesnesi, konu, sonuc } */
function boyaliBolumler(konu) {
  const r = KAYITLAR.get("boya|" + konu.id);
  const bos = { giris: false, basliklar: new Set() };
  if (!r || r.silindi) return bos;
  const eski = boyaBolumuOnbellegi.get(konu.id);
  if (eski && eski.kayitNesnesi === r && eski.konu === konu) return eski.sonuc;
  const sonuc = boyaBolumleriniBul(konuGovdesi(konu), konuBoyalari(konu.id));
  boyaBolumuOnbellegi.set(konu.id, { kayitNesnesi: r, konu, sonuc });
  return sonuc;
}

function boyaBolumleriniBul(govde, capalar) {
  const sonuc = { giris: false, basliklar: new Set() };
  if (!capalar.length) return sonuc;
  const dugumler = govdeMetinDugumleri(govde);
  const tamMetin = dugumler.map(d => d.nodeValue).join("");
  const araliklar = boyaAraliklari(tamMetin, capalar);
  if (!araliklar.length) return sonuc;
  /* Gövdenin doğrudan çocukları sırayla gezilir: her öğe, kendinden önceki
     son başlığın bölümündedir (başlığın kendisi de kendi bölümündedir) */
  const bolumu = new Map();
  let simdiki = null;
  Array.from(govde.children).forEach(c => {
    if ((c.tagName === "H3" || c.tagName === "H4") && c.dataset.baslik) simdiki = c.dataset.baslik;
    bolumu.set(c, c.tagName === "H2" ? null : simdiki);
  });
  let ofset = 0;
  dugumler.forEach(d => {
    const bas = ofset, son = ofset + d.nodeValue.length;
    ofset = son;
    if (!araliklar.some(a => a.bas < son && a.son > bas)) return;
    let el = d.parentNode;
    while (el && el.parentNode !== govde) el = el.parentNode;
    const b = el ? bolumu.get(el) : null;
    if (b) sonuc.basliklar.add(b); else sonuc.giris = true;
  });
  return sonuc;
}

/* Bir konunun mühim durumu. Yalnızca notta hâlâ bulunan başlıklar sayılır.
   { elle, boyali, mi, basliklar: Map<metin, { elle, boyali, seviye, ust }> } */
const muhimDurumOnbellegi = new Map();   /* konuId → { surum, konu, sonuc } */
function konuMuhimDurumu(konu) {
  const eski = muhimDurumOnbellegi.get(konu.id);
  if (eski && eski.surum === kayitSurumu && eski.konu === konu) return eski.sonuc;
  const sonuc = konuMuhimDurumuHesapla(konu);
  muhimDurumOnbellegi.set(konu.id, { surum: kayitSurumu, konu, sonuc });
  return sonuc;
}
function konuMuhimDurumuHesapla(konu) {
  const boya = boyaliBolumler(konu);
  const basliklar = new Map();
  (konu.basliklar || []).forEach(b => {
    const elle = elleMuhimMi(konu.id, b.metin);
    const boyali = boya.basliklar.has(b.metin);
    if (elle || boyali) basliklar.set(b.metin, { elle, boyali, seviye: b.seviye, ust: b.ust });
  });
  const elle = elleMuhimMi(konu.id, null);
  const boyali = boya.giris || boya.basliklar.size > 0;
  return { elle, boyali, mi: elle || boyali || basliklar.size > 0, basliklar };
}

/* Temrin ve kart süzgeci: soru (kart, kavram) mühim yerden mi?
   - konu elle mühimse bütün soruları
   - sorunun yeri (başlığı) varsa: o başlık, onun üst ### başlığı ya da altındaki
     bir #### başlığı mühimse
   - yeri yoksa (konunun geneli): konu herhangi bir yoldan mühimse */
function muhimYerdenMi(konu, yer) {
  const d = konuMuhimDurumu(konu);
  if (d.elle) return true;
  if (!d.mi) return false;
  const b = yer ? (konu.basliklar || []).find(x => x.metin === yer) : null;
  if (!b) return true;
  if (d.basliklar.has(b.metin)) return true;
  if (b.ust && d.basliklar.has(b.ust)) return true;
  return b.seviye === 3 && Array.from(d.basliklar.values()).some(x => x.ust === b.metin);
}

function muhimDegistir(konu, baslik) {
  const anahtar = muhimAnahtari(konu.id, baslik);
  if (!kayitSigarMi(anahtar, true)) { kisaBildirim("Bu başlık işaretlenemiyor (çok uzun)"); return; }
  const d = konuMuhimDurumu(konu);
  if (!baslik) {
    /* Konu adı: "konunun tamamı" işaretidir; boya olsa da konup kaldırılabilir */
    if (elleMuhimMi(konu.id, null)) {
      kayitSil("muhim", anahtar);
      kisaBildirim(d.boyali ? "Konunun tamamındaki işaret kaldırıldı; boyalı yerlerin başlıkları mühim kalır" : "Konunun tamamındaki işaret kaldırıldı");
    } else {
      kayitYaz("muhim", anahtar, true);
      kisaBildirim("Konunun tamamı mühim işaretlendi");
    }
  } else {
    const boyali = !!(d.basliklar.get(baslik) || {}).boyali;
    if (elleMuhimMi(konu.id, baslik)) {
      kayitSil("muhim", anahtar);
      kisaBildirim(boyali ? "İşaret kaldırıldı; boyalı yer olduğu için mühim görünmeye devam ediyor" : "Mühim işareti kaldırıldı");
    } else if (boyali) {
      kisaBildirim("Bu başlıkta boyalı yer var; kaldırmak için boyayı silin");
      return;
    } else {
      kayitYaz("muhim", anahtar, true);
      kisaBildirim("Mühim olarak işaretlendi");
    }
  }
  konuAc(konu.id, null, null, window.scrollY || window.pageYOffset || 0);
  /* Sayfa yeniden çizildi: klavye odağı aynı düğmeye döner */
  const govde = document.querySelector("#sayfaOku .okuma");
  const hedef = govde && (baslik
    ? Array.from(govde.querySelectorAll("[data-baslik]")).find(h => h.dataset.baslik === baslik)
    : govde.querySelector("h2"));
  const dugme = hedef && hedef.querySelector(".muhim-dugme");
  if (dugme) { try { dugme.focus({ preventScroll: true }); } catch (e) {} }
}

const AYRAC_IKONU = '<svg viewBox="0 0 16 18" aria-hidden="true"><path d="M3 1.5h10v15l-5-3.6-5 3.6z"/></svg>';

/* Konu başlığına ve her alt başlığa mühim düğmesi; mühim olanlara şerit */
function muhimIsaretleriniKur(govde, konu) {
  const d = konuMuhimDurumu(konu);
  const dugme = (hedef, baslik, acik) => {
    const b = olustur("button", "muhim-dugme");
    b.type = "button";
    b.innerHTML = AYRAC_IKONU;
    b.setAttribute("aria-pressed", acik ? "true" : "false");
    /* Düğme başlığın içinde: ekran okuyucu başlığı okurken kısa bir ek duyulsun */
    b.setAttribute("aria-label", baslik ? "Mühim" : "Konunun tamamı mühim");
    b.addEventListener("mousedown", olay => olay.preventDefault());
    b.addEventListener("click", olay => { olay.stopPropagation(); muhimDegistir(konu, baslik); });
    hedef.insertBefore(b, hedef.firstChild);
  };
  /* Konu adındaki düğme "konunun tamamı" içindir ve yalnızca elle konunca
     dolar. Konu herhangi bir yoldan mühimse (boya ya da mühim başlık) konu
     adının başında ayraç görünür (.muhim; CSS ile, metne karakter eklemez). */
  const h2 = govde.querySelector("h2");
  if (h2) { dugme(h2, null, d.elle); h2.classList.toggle("muhim", d.mi); }
  govde.querySelectorAll("h3[data-baslik],h4[data-baslik]").forEach(h => {
    const acik = d.basliklar.has(h.dataset.baslik);
    h.classList.toggle("muhim", acik);
    dugme(h, h.dataset.baslik, acik);
  });
}

/* ==========================================================================
   Seçim çubuğu ve öne çıkan arama paneli
   ========================================================================== */
let secimMenusu = null;
let aramaPaneli = null;

/* Okuma alanındaki seçimi okur: metni ve içinde bulunduğu paragrafı verir.
   Seçimi tarayıcıya bırakıyoruz ki tutamaklarla genişletip daraltabilesin. */
function secimBilgisi() {
  const govde = document.querySelector("#sayfaOku .okuma");
  if (!govde || !window.getSelection) return null;
  const secim = window.getSelection();
  if (!secim || secim.isCollapsed || secim.rangeCount === 0) return null;
  const metin = (secim.toString() || "").replace(/\s+/g, " ").trim();
  if (metin.length < 2) return null;
  const dugum = secim.anchorNode;
  if (!dugum || !govde.contains(dugum)) return null;
  let el = dugum.nodeType === 3 ? dugum.parentElement : dugum;
  /* Sesli okumanın başlayabileceği en yakın öğe (paragraf, başlık, madde) */
  while (el && el !== govde && !["P", "H2", "H3", "H4", "LI"].includes(el.tagName)) el = el.parentElement;
  return { metin, el: el && el !== govde ? el : null, aralik: secimAraligi(govde), govde };
}

function menuyuKapat() {
  if (secimMenusu) { secimMenusu.remove(); secimMenusu = null; }
}

function kisaBildirim(yazi) {
  const eski = document.querySelector(".kisa-bildirim");
  if (eski) eski.remove();
  const b = olustur("div", "kisa-bildirim");
  b.setAttribute("role", "status");
  b.textContent = yazi;
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 1800);
}

/* Seçim yapıldığında alttan çıkan işlem çubuğu.
   Seçimin üstüne değil aşağıya konuluyor ki tutamakları kapatmasın. */
function secimCubuguGoster(bilgi) {
  const varOlan = document.querySelector(".secim-cubugu");
  if (varOlan) varOlan.remove();
  const cubuk = olustur("div", "secim-cubugu");

  const yazi = olustur("span", "kelime");
  yazi.textContent = bilgi.metin;
  cubuk.appendChild(yazi);

  const dugmeler = olustur("div", "dugmeler");
  const ekle = (etiket, is, sinif) => {
    const d = olustur("button", sinif || "");
    d.textContent = etiket;
    d.addEventListener("mousedown", olay => olay.preventDefault());   /* seçim kaybolmasın */
    d.addEventListener("click", is);
    dugmeler.appendChild(d);
    return d;
  };
  ekle("Ara", () => { secimiTemizle(); aramaPaneliAc(bilgi.metin); });
  if (sesDestegiVar() && bilgi.el && okuAcik && okuAcik.tur === "konu") {
    const konuId = okuAcik.konu;
    ekle("Buradan oku", () => {
      const el = bilgi.el;
      secimiTemizle();
      sesBaslat(konuId, el);
    });
  }
  /* Boyama: seçim zaten boyalıysa düğme silmeye döner */
  if (bilgi.aralik && okuAcik && okuAcik.tur === "konu") {
    const boyali = tamamenBoyaliMi(bilgi.aralik, bilgi.govde, okuAcik.konu);
    const d = ekle(boyali ? "Boyayı sil" : "Boya", () => {
      boyaDegistir(bilgi.aralik, boyali);
    });
    d.classList.add("boya-dugmesi");
  }
  /* Yıldız kelime/kısa ifade içindir; koca bir paragrafı yıldızlamak işe yaramaz */
  if (bilgi.metin.length <= 40) dugmeler.appendChild(yildizDugmesi(bilgi.metin, "dar"));
  cubuk.appendChild(dugmeler);
  document.body.appendChild(cubuk);
  /* Okuma çubuğu açıksa onun üstüne yerleş, üst üste binmesinler */
  const oynatma = document.querySelector(".oynatma");
  if (oynatma) {
    const yukseklik = 72 + (oynatma.offsetHeight || 96) + 8;
    cubuk.style.bottom = "calc(" + yukseklik + "px + env(safe-area-inset-bottom))";
  }
  secimMenusu = cubuk;
}

function secimiTemizle() {
  try { if (window.getSelection) window.getSelection().removeAllRanges(); } catch (e) {}
  menuyuKapat();
}

/* Seçim değiştikçe çubuğu tazele.
   DİKKAT: seçim kalkınca çubuk KAPATILMAZ. Dokunmatikte çubuğun düğmesine
   basmak önce seçimi düşürüyor; hemen kapatsaydık dokunuş boşa giderdi.
   Kapatmayı aşağıdaki dışarı-dokunma dinleyicisi üstleniyor. */
let secimZamanlayici = null;
function secimiIzle() {
  if (secimZamanlayici) clearTimeout(secimZamanlayici);
  secimZamanlayici = setTimeout(() => {
    secimZamanlayici = null;
    if (aktifSekme !== "oku" || kilitEkrani || !uygulamaAcik) return menuyuKapat();
    const bilgi = secimBilgisi();
    if (bilgi) secimCubuguGoster(bilgi);
  }, 180);
}
document.addEventListener("selectionchange", secimiIzle);

/* Panelden bir yere gidilecekse önce geçmiş geri sarılır, iş ondan SONRA
   çalışır; aksi hâlde history.back() ile yeni gezinme yarışır. */
let panelSonrasi = null;

function paneliKapat() {
  if (aramaPaneli) { aramaPaneli.remove(); aramaPaneli = null; }
  const is = panelSonrasi;
  panelSonrasi = null;
  if (is) is();
}

function aramaPaneliAc(kelime) {
  paneliKapat();
  const perde = olustur("div", "panel-perde");
  perde.addEventListener("click", olay => { if (olay.target === perde) geriDon(); });

  const panel = olustur("div", "panel");
  const ust = olustur("div", "panel-ust");
  const baslik = olustur("h3");
  baslik.textContent = kelime;
  const kapat = olustur("button", "panel-kapat");
  kapat.textContent = "×";
  kapat.setAttribute("aria-label", "Paneli kapat");
  kapat.addEventListener("click", () => geriDon());
  ust.append(baslik, yildizDugmesi(kelime), kapat);
  panel.appendChild(ust);

  const govde = olustur("div", "panel-govde");
  const kavramlar = kavramAra(kelime);
  const metinde = metindeAra(kelime);

  if (!kavramlar.length && !metinde.length) {
    const bos = olustur("p", "bos");
    bos.textContent = "“" + kelime + "” ne kavram listesinde ne de notlarda geçiyor.";
    govde.appendChild(bos);
  }

  kavramlar.slice(0, 6).forEach(k => {
    const kart = olustur("div", "sonuc-kart");
    const h = olustur("h4");
    h.textContent = k.terim;
    kart.appendChild(h);
    if (k.izah) { const p = olustur("p"); p.innerHTML = satiriCiz(k.izah); kart.appendChild(p); }
    const git = olustur("button", "nereden");
    git.textContent = konuYeri(k.konu) + " ›";
    git.addEventListener("click", () => {
      panelSonrasi = () => { sekmeAc("oku", false); konuAc(k.konu.id, () => dersCiz(k.konu.ders, null), k.terim, 0, k.yer); };
      geriDon();
    });
    kart.appendChild(git);
    govde.appendChild(kart);
  });

  if (metinde.length) {
    const ara = olustur("div", "metin-basligi");
    ara.textContent = "notlarda geçtiği yerler (" + metinde.length + " konu)";
    govde.appendChild(ara);
    metinde.slice(0, 3).forEach(m => {
      const kart = olustur("div", "sonuc-kart");
      const h = olustur("h4");
      h.textContent = konuYeri(m.konu);
      const kesit = olustur("p", "kesit");
      const kalin = olustur("b");
      kalin.textContent = m.eslesen;
      kesit.append(document.createTextNode(m.once), kalin, document.createTextNode(m.sonra));
      kart.append(h, kesit);
      govde.appendChild(kart);
    });
  }
  panel.appendChild(govde);

  const eylem = olustur("div", "eylem");
  const sekmede = olustur("button", "ana");
  sekmede.textContent = "Ara sekmesinde aç";
  sekmede.addEventListener("click", () => {
    panelSonrasi = () => { sekmeAc("ara"); aramaSayfasiCiz(kelime); };
    geriDon();
  });
  eylem.appendChild(sekmede);
  panel.appendChild(eylem);

  perde.appendChild(panel);
  document.body.appendChild(perde);
  aramaPaneli = perde;
  derinlesGit(paneliKapat);   /* geri tuşu paneli kapatsın */
}

/* Çubuğun dışına dokunulduğunda, seçim de kalkmışsa çubuk kapanır */
function disariDokunuldu(olay) {
  if (!secimMenusu || (olay.target && secimMenusu.contains(olay.target))) return;
  setTimeout(() => {
    if (!secimMenusu) return;
    if (!secimBilgisi()) menuyuKapat();
  }, 250);
}
document.addEventListener("click", disariDokunuldu, true);
document.addEventListener("touchend", disariDokunuldu, true);

/* ==========================================================================
   2) ARA
   ========================================================================== */
function aramaSayfasiCiz(baslangic) {
  const sayfa = $("#sayfaAra");
  sayfa.innerHTML = "";

  const satir = olustur("div", "arama-satir");
  const kutu = olustur("div", "arama-kutu");
  const girdi = olustur("input");
  girdi.type = "search";
  girdi.placeholder = "Kavram ya da ifade ara";
  girdi.setAttribute("aria-label", "Kavram ara");
  girdi.autocomplete = "off";
  const sil = olustur("button", "arama-sil");
  sil.textContent = "×";
  sil.setAttribute("aria-label", "Aramayı temizle");
  kutu.append(girdi, sil);
  satir.appendChild(kutu);
  sayfa.appendChild(satir);

  /* Yıldızlananlar tek bir girişte toplanır, panelde açılır */
  const yildizGiris = olustur("button", "fihrist-giris");
  yildizGiris.innerHTML = '<span>Yıldızlılar</span><span class="ok"></span>';
  yildizGiris.querySelector(".ok").textContent = "★ " + yildizlar().length + "  ›";
  yildizGiris.addEventListener("click", () => yildizPaneliAc());
  sayfa.appendChild(yildizGiris);

  /* Aranan kelimeyi yıldızlamak için kutunun yanındaki düğme */
  const yildiz = olustur("button", "yildiz-dugme kutu-yani");
  const yildizTazele = () => {
    const q = (girdi.value || "").trim();
    yildiz.disabled = q.length < 2 || q.length > YILDIZ_AZAMI;
    const acik = !yildiz.disabled && yildizliMi(q);
    yildiz.textContent = acik ? "★" : "☆";
    yildiz.classList.toggle("dolu", acik);
  };
  yildiz.addEventListener("click", () => {
    const q = (girdi.value || "").trim();
    if (q.length < 2 || q.length > YILDIZ_AZAMI) return;
    const eklendi = yildizDegistir(q);
    kisaBildirim(eklendi ? "“" + q + "” yıldızlandı" : "Yıldız kaldırıldı");
    aramaSayfasiCiz(q);
  });
  satir.appendChild(yildiz);

  const oneri = olustur("ul", "oneri");
  sayfa.appendChild(oneri);
  const sonuc = olustur("div", "sonuc");
  sayfa.appendChild(sonuc);

  if (!KONULAR.size) {
    const bos = olustur("p", "bos");
    bos.textContent = "Henüz not yok. Notlar indirilince burada aranabilir.";
    sonuc.appendChild(bos);
  }

  const araDon = () => { const q = girdi.value; return () => { sekmeAc("ara", false); aramaSayfasiCiz(q); }; };

  function onerileriCiz(q) {
    oneri.innerHTML = "";
    if (!q) return;
    const kucuk = kucult(q);
    const gorulen = new Set();
    const bulunan = ARAMA_INDEKSI
      .filter(k => kucult(k.terim).indexOf(kucuk) !== -1)
      .sort((a, b) => {
        const ab = kucult(a.terim).indexOf(kucuk) === 0 ? 0 : 1;
        const bb = kucult(b.terim).indexOf(kucuk) === 0 ? 0 : 1;
        if (ab !== bb) return ab - bb;
        return a.terim.length - b.terim.length;
      })
      .filter(k => { const a = kucult(k.terim) + "|" + k.konu.id; if (gorulen.has(a)) return false; gorulen.add(a); return true; })
      .slice(0, 8);
    bulunan.forEach(k => {
      const li = olustur("li");
      const d = olustur("button");
      d.innerHTML = '<span class="terim">' + kacir(k.terim) + "</span>" +
        '<span class="kisa">' + kacir(k.izah ? k.izah.replace(/[`*]/g, "") : konuYeri(k.konu)) + "</span>";
      d.addEventListener("click", () => {
        if (k.tur === "baslik") {
          sekmeAc("oku", false);
          konuAc(k.konu.id, araDon(), null, 0, k.yer);
          return;
        }
        girdi.value = k.terim;
        araSorgusu = k.terim;
        yildizTazele();
        oneri.innerHTML = "";
        sonuclariCiz(k.terim);
      });
      li.appendChild(d);
      oneri.appendChild(li);
    });
  }

  function sonuclariCiz(q) {
    sonuc.innerHTML = "";
    const kucuk = kucult(q.trim());
    if (!kucuk) return;
    const bulunan = kavramAra(q);
    if (!bulunan.length && !metindeAra(q).length) {
      const bos = olustur("p", "bos");
      bos.textContent = "“" + q + "” ne kavram listesinde ne de notlarda geçiyor. Terimin bir kısmını yazmayı deneyin.";
      sonuc.appendChild(bos);
      return;
    }
    bulunan.slice(0, 20).forEach(k => {
      const kart = olustur("div", "sonuc-kart");
      const h = olustur("h4");
      h.textContent = k.terim;
      kart.appendChild(h);
      if (k.izah) { const p = olustur("p"); p.innerHTML = satiriCiz(k.izah); kart.appendChild(p); }
      const git = olustur("button", "nereden");
      git.textContent = konuYeri(k.konu) + " ›";
      git.addEventListener("click", () => {
        const geri = araDon();
        sekmeAc("oku", false);
        konuAc(k.konu.id, geri, k.terim, 0, k.yer);
      });
      kart.appendChild(git);
      sonuc.appendChild(kart);
    });
    metinSonuclariniCiz(q);
  }

  /* Kavram listesinde karşılığı olmayan ifadeler için notların kendisinde arama */
  function metinSonuclariniCiz(sorgu) {
    const bulunan = metindeAra(sorgu);
    if (!bulunan.length) return;
    const baslik = olustur("div", "metin-basligi");
    baslik.textContent = "notlarda geçtiği yerler (" + bulunan.length + " konu)";
    sonuc.appendChild(baslik);
    bulunan.slice(0, 8).forEach(k => {
      const kart = olustur("div", "sonuc-kart");
      const h = olustur("h4");
      h.textContent = konuYeri(k.konu);
      const adet = olustur("span", "adet");
      adet.textContent = k.adet + " kez";
      const kesit = olustur("p", "kesit");
      const kalin = olustur("b");
      kalin.textContent = k.eslesen;
      kesit.append(document.createTextNode(k.once), kalin, document.createTextNode(k.sonra));
      const git = olustur("button", "nereden");
      git.textContent = "bu konuda oku ›";
      git.addEventListener("click", () => {
        const geri = araDon(), q2 = girdi.value;
        sekmeAc("oku", false);
        konuAc(k.konu.id, geri, q2);
      });
      kart.append(h, adet, kesit, git);
      sonuc.appendChild(kart);
    });
  }

  girdi.addEventListener("input", () => {
    araSorgusu = girdi.value;
    yildizTazele();
    onerileriCiz(girdi.value.trim());
    sonuclariCiz(girdi.value);
  });
  girdi.addEventListener("keydown", e => {
    if (e.key === "Enter") { oneri.innerHTML = ""; sonuclariCiz(girdi.value); girdi.blur(); }
  });
  sil.addEventListener("click", () => {
    girdi.value = ""; araSorgusu = ""; araKaydirma = 0;
    oneri.innerHTML = ""; sonuc.innerHTML = ""; yildizTazele(); girdi.focus();
  });

  if (baslangic) { girdi.value = baslangic; araSorgusu = baslangic; sonuclariCiz(baslangic); }
  yildizTazele();
}

/* ==========================================================================
   3) TEMRİN
   Önce kapsam seçilir (ders ve konular), sonra temrin yolu.
   Kapsam cihazda tutulur: { dersId: "tumu" | [konuId, ...] }
   "tumu" seçilen derse sonradan eklenen konular da kendiliğinden girer.
   ========================================================================== */
function kapsam() {
  const k = depo.oku("pg.kapsam", {});
  return k && typeof k === "object" && !Array.isArray(k) ? k : {};
}
function kapsamYaz(k) { depo.yaz("pg.kapsam", k); }

function dersKapsami(dersId) {
  const k = kapsam()[dersId];
  const konular = DERS_KONULARI.get(dersId) || [];
  if (k === "tumu") return konular.map(x => x.id);
  if (Array.isArray(k)) return k.filter(id => konular.some(x => x.id === id));
  return [];
}
function seciliKonular() {
  const liste = [];
  DERS_KONULARI.forEach((_, dersId) => dersKapsami(dersId).forEach(id => liste.push(id)));
  return new Set(liste);
}
/* "Yalnızca mühim yerler" anahtarı: kapsamın üstüne ikinci bir süzgeç.
   Cihazda tutulur (kapsam gibi). Ayrıntı: muhimYerdenMi. */
function muhimSuzgeci() { return depo.oku("pg.muhimSuzgec", false) === true; }
function muhimSuzgecindenGecer(konu, yer) { return !muhimSuzgeci() || muhimYerdenMi(konu, yer); }

function kapsamdakiSorular() {
  const secili = seciliKonular();
  return TUM_SORULAR.filter(s => secili.has(s.konu.id) && muhimSuzgecindenGecer(s.konu, s.yer));
}
function kapsamOzeti() {
  const parcalar = [];
  DERS_KONULARI.forEach((konular, dersId) => {
    const n = dersKapsami(dersId).length;
    if (!n) return;
    parcalar.push(dersAdi(dersId, true) + (n === konular.length ? "" : " (" + n + "/" + konular.length + ")"));
  });
  return parcalar;
}

/* ---------- Yanlış defteri: hesapta tutulur ---------- */
function yanlisSorular() {
  return kayitlarTuru("yanlis").map(r => SORU_HARITASI.get(r.anahtar)).filter(Boolean);
}

/* Bir sorunun sonucunu tek yerden işler: aynı soru iki kez puanlanmaz. */
function sonucIsle(soru, dogruMu) {
  if (oturum.cevaplanan.indexOf(oturum.i) !== -1) return;
  oturum.cevaplanan.push(oturum.i);
  if (dogruMu) { oturum.dogru++; kayitSil("yanlis", soru.id); }
  else { oturum.yanlislar.push(soru); kayitYaz("yanlis", soru.id, true); }
}

const TUR_ADLARI = {
  secme: "Çoktan seçmeli", dy: "Doğru mu, yanlış mı", bosluk: "Boşluk doldurma", dizme: "Sıralama",

  { tur: "yanlis",  ad: "Yanlış yaptıklarınız", izah: "Takıldığınız sorular burada birikir; doğru cevaplayınca listeden düşer." },
  { tur: "prova",   ad: "Sınav provası",      izah: "Seçtiğiniz konulardan her türden karışık 20 soru; sınavdaki gibi ne geleceği belli değil." },

  { tur: "dy",      ad: "Doğru mu, yanlış mı", izah: "Bir ifade gelir; doğru mu yanlış mı, hızlıca karar verin." },
  { tur: "bosluk",  ad: "Boşluk doldurma",    izah: "Cümledeki eksik terimi kendiniz yazın." },
  { tur: "dizme",   ad: "Sıralama",           izah: "Adımları, kod satırlarını ya da komut parçalarını doğru sıraya dizin." },

  { tur: "izleme",  ad: "İzleme",             izah: "Verilen kodun ya da akışın çıktısını bulun; sınavların klasik sorusu." },
  { tur: "hesap",   ad: "Hesaplama",          izah: "Sonucu sayı olarak yazın: alt ağ, Ohm kanunu, sayı sistemleri gibi." },
  { tur: "klasik",  ad: "Klasik",             izah: "Açık uçlu soru: cevabınızı yazın, örnek cevapla karşılaştırıp kendinizi puanlayın." },
  { tur: "kavram",  ad: "Kavram kartları",    izah: "Seçtiğiniz konuların kavramlarını kart çevirerek tekrar edin." }
];

function modSorulari(tur) {
  const havuz = kapsamdakiSorular();
  if (TUR_ADLARI[tur]) return havuz.filter(s => s.tip === tur);
  return [];
}
function kapsamdakiKavramKartlari() {
  const secili = seciliKonular();
  const kartlar = [];
  secili.forEach(id => {
    const konu = KONULAR.get(id);
    if (konu) konu.kavramlar.forEach(k => { if (muhimSuzgecindenGecer(konu, k.yer)) kartlar.push({ on: k.terim, arka: k.izah, konu }); });
  });
  return kartlar;
}

/* ---------- Temrin kökü ---------- */
function calisMenusuCiz() {
  const sayfa = $("#sayfaCalis");

    const bos = olustur("p", "bos");
    bos.textContent = AGAC ? "Henüz not yok; notlar eklendikçe temrinler de burada açılacak." : "Notlar indirilince temrinler burada açılacak.";

  }

  const ozet = kapsamOzeti();

  const etiket = olustur("span");

  const deger = olustur("span", "deger");
  deger.textContent = ozet.length ? ozet.join(", ") : "Seçilmedi";

  kapsamDugme.addEventListener("click", () => { derinlesGit(calisMenusuCiz); kapsamCiz(); });

  if (!ozet.length) {
    const bos = olustur("p", "bos");
    bos.textContent = "Önce hangi derslerin hangi konularından çalışacağınızı seçin; temrinler yalnızca o konulardan gelir.";
    sayfa.appendChild(bos);
    const eylem = olustur("div", "eylem");
    const sec = olustur("button", "ana");
    sec.textContent = "Ders ve konu seç";
    sec.addEventListener("click", () => { derinlesGit(calisMenusuCiz); kapsamCiz(); });
    eylem.appendChild(sec);
    sayfa.appendChild(eylem);
    return;
  }

  const suzgecSatiri = olustur("div", "anahtarli-satir");
  const suzgecYazi = olustur("span");
  suzgecYazi.textContent = "Yalnızca mühim yerler";
  const suzgec = olustur("button", "anahtar-dugme");
  suzgec.setAttribute("role", "switch");
  suzgec.setAttribute("aria-checked", muhimSuzgeci() ? "true" : "false");
  suzgec.setAttribute("aria-label", "Yalnızca mühim yerlerden soru gelsin");
  suzgec.addEventListener("click", () => { depo.yaz("pg.muhimSuzgec", !muhimSuzgeci()); calisMenusuCiz(); });
  suzgecSatiri.append(suzgecYazi, suzgec);
  sayfa.appendChild(suzgecSatiri);
  if (muhimSuzgeci()) {
    const izah = olustur("p", "kart-ipucu");
    izah.style.textAlign = "left";
    izah.style.margin = "-4px 0 10px";
    izah.textContent = "Elle işaretlediğiniz ya da boyadığınız başlıklardan gelir. Konunun tamamını işaretlediyseniz o konunun bütün soruları; " +
      "belli bir başlığa bağlı olmayan sorular konu mühimse gelir.";
    sayfa.appendChild(izah);
  }

  const kapsamSorulari = kapsamdakiSorular();
  const liste = olustur("div", "mod-liste");
  let doluMod = 0;
  MODLAR.forEach(m => {
    let sayi = 0, birim = " soru";
    if (m.tur === "yanlis") { const s = seciliKonular(); sayi = yanlisSorular().filter(x => s.has(x.konu.id) && muhimSuzgecindenGecer(x.konu, x.yer)).length; }
    else if (m.tur === "prova") sayi = Math.min(20, kapsamSorulari.length);
    else if (m.tur === "konu") { sayi = new Set(kapsamSorulari.map(s => s.konu.id)).size; birim = " konu"; }
    else if (m.tur === "kavram") { sayi = kapsamdakiKavramKartlari().length; birim = " kart"; }
    else sayi = modSorulari(m.tur).length;
    if (!sayi && m.tur !== "yanlis") return;   /* yanlış defteri boşken de görünür */
    if (sayi && m.tur !== "yanlis") doluMod++;
    const d = olustur("button", "mod-kart");
    d.innerHTML = '<span class="ad">' + kacir(m.ad) + '</span><span class="izah">' + kacir(m.izah) +
      '</span><span class="sayi">' + sayi + birim + "</span>";
    d.addEventListener("click", () => {
      derinlesGit(calisMenusuCiz);
      if (m.tur === "yanlis") yanlisEkraniCiz();
      else if (m.tur === "prova") oturumBaslat(karistir(kapsamSorulari).slice(0, 20), m.ad);
      else if (m.tur === "konu") konuSecimiCiz();
      else if (m.tur === "kavram") kartOturumu(kapsamdakiKavramKartlari(), "Kavram kartları", $("#sayfaCalis"), { tur: "kavram" });
      else oturumBaslat(karistir(modSorulari(m.tur)), m.ad);
    });

    const bos = olustur("p", "bos");
    bos.textContent = "Seçtiğiniz konuların mühim yerlerinden soru yok. Okurken başlıkların yanındaki ayraç işaretine dokunun ya da önemli yerleri boyayın; " +
      "ya da yukarıdaki anahtarı kapatın.";
    sayfa.appendChild(bos);
  }
  sayfa.appendChild(liste);
}

/* ---------- Kapsam: Sınıf > Dönem > Ders ---------- */
function kapsamCiz() {
  const sayfa = $("#sayfaCalis");
  sayfa.innerHTML = "";
  const geri = olustur("button", "geri");
  geri.textContent = "‹ Temrin yolları";
  geri.addEventListener("click", geriDon);
  sayfa.appendChild(geri);

  const bilgi = olustur("div", "agac-baslik");
  bilgi.style.margin = "14px 0 10px";
  bilgi.textContent = "Kutuya dokunmak dersin tamamını seçer; konuları tek tek seçmek için satıra dokunun.";
  sayfa.appendChild(bilgi);

  AGAC.gruplar.forEach(g => {
    const grup = olustur("section", "grup");
    const b = olustur("h2", "grup-baslik");
    b.textContent = g.ad;
    if (g.hususi) b.appendChild(hususiEtiketi());
    grup.appendChild(b);
    const dersler = liste => (liste || []).forEach(d => {
      const konular = DERS_KONULARI.get(d.id) || [];
      if (!konular.length) return;
      const n = dersKapsami(d.id).length;
      const satir = olustur("div", "kontrol-oge" + (n === konular.length ? " tikli" : n ? " kismi" : ""));
      satir.style.marginBottom = "8px";
      const kutucuk = olustur("button", "kutucuk");
      kutucuk.textContent = n === konular.length ? "✓" : n ? "–" : "";
      kutucuk.setAttribute("aria-label", d.ad + (n === konular.length ? " seçimini kaldır" : " dersinin tamamını seç"));
      kutucuk.addEventListener("click", () => {
        const k = kapsam();
        if (n === konular.length) delete k[d.id]; else k[d.id] = "tumu";
        kapsamYaz(k);
        kapsamCiz();
      });
      const yazi = olustur("button");
      yazi.style.cssText = "flex:1;text-align:left;display:flex;align-items:center;min-width:0";
      const ad = olustur("span");
      ad.style.flex = "1";
      ad.textContent = d.ad;
      const alt = olustur("span", "alt-yazi");
      alt.textContent = n + "/" + konular.length + " konu seçili";
      ad.appendChild(alt);
      const ileri = olustur("span", "ileri");
      ileri.textContent = "›";
      yazi.append(ad, ileri);
      yazi.addEventListener("click", () => { derinlesGit(kapsamCiz); dersKapsamiCiz(d.id); });
      satir.append(kutucuk, yazi);
      grup.appendChild(satir);
    });
    if (Array.isArray(g.donemler)) {
      g.donemler.forEach(dn => {
        if (!(dn.dersler || []).some(d => (DERS_KONULARI.get(d.id) || []).length)) return;
        const db = olustur("div", "donem-baslik");
        db.textContent = dn.ad;
        grup.appendChild(db);
        dersler(dn.dersler);
      });
    } else dersler(g.dersler);
    if (grup.children.length > 1) sayfa.appendChild(grup);
  });

  const eylem = olustur("div", "eylem");
  const tamam = olustur("button", "ana");
  tamam.textContent = "Tamam";
  tamam.addEventListener("click", geriDon);
  const temizle = olustur("button");
  temizle.textContent = "Seçimi temizle";
  temizle.addEventListener("click", () => { kapsamYaz({}); kapsamCiz(); });
  eylem.append(tamam, temizle);
  sayfa.appendChild(eylem);
}

/* ---------- Kapsam: bir dersin konuları ---------- */
function dersKapsamiCiz(dersId) {
  const sayfa = $("#sayfaCalis");
  sayfa.innerHTML = "";
  const geri = olustur("button", "geri");
  geri.textContent = "‹ Dersler";
  geri.addEventListener("click", geriDon);
  sayfa.appendChild(geri);

  const konular = DERS_KONULARI.get(dersId) || [];
  const secili = dersKapsami(dersId);
  const tumu = kapsam()[dersId] === "tumu";

  const baslik = olustur("h2", "ders-basligi");
  baslik.textContent = dersAdi(dersId);
  sayfa.appendChild(baslik);

  const liste = olustur("div", "kontrol");
  liste.style.marginTop = "12px";
  const hepsi = olustur("button", "kontrol-oge" + (tumu ? " tikli" : ""));
  hepsi.innerHTML = '<span class="kutucuk">✓</span><span>Tümü<span class="alt-yazi">Sonradan eklenecek konular da dahil</span></span>';
  hepsi.addEventListener("click", () => {
    const k = kapsam();
    if (tumu) delete k[dersId]; else k[dersId] = "tumu";
    kapsamYaz(k);
    dersKapsamiCiz(dersId);
  });
  liste.appendChild(hepsi);

  konular.forEach(konu => {
    const isaretli = secili.indexOf(konu.id) !== -1;
    const d = olustur("button", "kontrol-oge" + (isaretli ? " tikli" : ""));
    const kutucuk = olustur("span", "kutucuk");
    kutucuk.textContent = "✓";
    const yazi = olustur("span");
    yazi.textContent = konuEtiketi(konu);
    const alt = olustur("span", "alt-yazi");
    alt.textContent = konu.sorular.length + " soru · " + konu.kavramlar.length + " kavram";
    yazi.appendChild(alt);
    d.append(kutucuk, yazi);
    d.addEventListener("click", () => {
      const k = kapsam();
      const simdiki = dersKapsami(dersId);
      const yeri = simdiki.indexOf(konu.id);
      if (yeri === -1) simdiki.push(konu.id); else simdiki.splice(yeri, 1);
      if (simdiki.length === konular.length) k[dersId] = "tumu";
      else if (simdiki.length) k[dersId] = simdiki;
      else delete k[dersId];
      kapsamYaz(k);
      dersKapsamiCiz(dersId);
    });
    liste.appendChild(d);
  });
  sayfa.appendChild(liste);
}

    if (!window.confirm("Seçtiğiniz konulardaki yanlışlar defterden silinsin mi?")) return;
