/* ---------- Küçük yardımcılar ---------- */
const $ = (s, k) => (k || document).querySelector(s);
const olustur = (etiket, sinif) => { const e = document.createElement(etiket); if (sinif) e.className = sinif; return e; };

function karistir(dizi) {
  const d = dizi.slice();
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}

function kacir(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* Karşılaştırma için küçültme: I, İ, ı ve i aynı sayılır. Türkçe kuralla
   "I" → "ı" yapılsaydı "PID" ile "pid" ya da "UEFI" ile "uefi" eşleşmezdi;
   notlarda İngilizce kısaltma çok. Harf sayısı değişmez (vurgulama buna
   güvenir): "İ".toLowerCase() iki harf verdiği için önce değiştirilir. */
function kucult(s) {
  return String(s).replace(/[Iİı]/g, "i").toLowerCase();
}

/* Cevap karşılaştırma: büyük/küçük harf, fazla boşluk ve sondaki noktalama önemsiz */
function cevapNormal(s) {
  return kucult(String(s)).replace(/\s+/g, " ").trim().replace(/[.,;:!?]+$/, "").trim();
}

/* Sunucu zamanı mikrosaniyeli gelebilir; her tarayıcı aynı okusun diye kırpılır */
function zamanMs(s) {
  if (!s) return 0;
  const n = Date.parse(String(s).replace(/(\.\d{3})\d+/, "$1"));
  return isNaN(n) ? 0 : n;
}

/* Animasyonu bekler; hareket azaltılmışsa beklemez */
const hareketAz = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function bekle(ms) {
  return new Promise(coz => setTimeout(coz, hareketAz() ? 0 : ms));
}

/* ==========================================================================
   Markdown çizici — biçim tarifi icerik/BICIM.md'de
   ========================================================================== */
const SATIR_GORSELI = /^!\[([^\]]*)\]\(gorseller\/([a-z0-9-]+\.(?:svg|png|jpe?g|webp))\)\s*$/;

/* Satır içi: `kod`, **kalın**, görsel. Kod içindekiler olduğu gibi gösterilir. */
/* Kod parçaları önce yer tutucuyla ayrılır, kalın ve görsel kuralı sonra
   uygulanır; böylece "**`sudo`** komutu" gibi kalın içindeki kod da çizilir.
   Yer tutucu Unicode'un özel kullanım alanındadır, notta geçmez. */
function satiriCiz(s, dersId) {
  const kodlar = [];
  const ara = String(s).replace(/`([^`]+)`/g, (_, k) => { kodlar.push(k); return "" + (kodlar.length - 1) + ""; });
  return kacir(ara)
    .replace(/!\[([^\]]*)\]\(gorseller\/([a-z0-9-]+\.(?:svg|png|jpe?g|webp))\)/g, (_, alt, ad) =>
      '<img class="satir-gorsel" alt="' + alt + '" data-yol="' + kacir((dersId || "") + "/" + ad) + '">')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(\d+)/g, (_, n) => "<code>" + kacir(kodlar[Number(n)]) + "</code>");
}

function markdownCiz(metin, dersId) {
  const satirlar = String(metin).split("\n");
  let html = "", i = 0;
  const topla = kosul => { const t = []; while (i < satirlar.length && kosul(satirlar[i])) { t.push(satirlar[i]); i++; } return t; };
  while (i < satirlar.length) {
    const satir = satirlar[i];
    if (/^```/.test(satir)) {
      i++;
      const kod = topla(s => !/^```/.test(s));
      i++;   /* kapanış çiti */
      html += "<pre><code>" + kacir(kod.join("\n")) + "</code></pre>";
      continue;
    }
    if (satir.startsWith("#### ") || satir.startsWith("### ")) {
      const dort = satir.startsWith("#### ");
      const metin_ = satir.slice(dort ? 5 : 4).trim();
      html += (dort ? "<h4" : "<h3") + ' data-baslik="' + kacir(metin_) + '">' + satiriCiz(metin_, dersId) + (dort ? "</h4>" : "</h3>");
      i++; continue;
    }
    if (/^\|.*\|\s*$/.test(satir)) {
      const tablo = topla(s => /^\|.*\|\s*$/.test(s));
      const hucreler = s => s.trim().slice(1, -1).split("|").map(h => h.trim());
      html += '<div class="tablo-sarmal"><table><thead><tr>' +
        hucreler(tablo[0]).map(h => "<th>" + satiriCiz(h, dersId) + "</th>").join("") + "</tr></thead><tbody>" +
        tablo.slice(2).map(s => "<tr>" + hucreler(s).map(h => "<td>" + satiriCiz(h, dersId) + "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>";
      continue;
    }
    if (/^- /.test(satir)) {
      html += "<ul>" + topla(s => /^- /.test(s)).map(s => "<li>" + satiriCiz(s.slice(2), dersId) + "</li>").join("") + "</ul>";
      continue;
    }
    if (/^\d+\. /.test(satir)) {
      const ogeler = topla(s => /^\d+\. /.test(s));
      const bas = parseInt(ogeler[0], 10);
      html += "<ol" + (bas !== 1 ? ' start="' + bas + '"' : "") + ">" +
        ogeler.map(s => "<li>" + satiriCiz(s.replace(/^\d+\. /, ""), dersId) + "</li>").join("") + "</ol>";
      continue;
    }
    if (/^>/.test(satir)) {
      html += "<blockquote>" + topla(s => /^>/.test(s)).map(s => s.replace(/^> ?/, "")).filter(s => s.trim())
        .map(s => "<p>" + satiriCiz(s, dersId) + "</p>").join("") + "</blockquote>";
      continue;
    }
    if (satir.trim() === "") { i++; continue; }
    const g = satir.match(SATIR_GORSELI);
    if (g) {
      html += '<figure><img alt="' + kacir(g[1]) + '" data-yol="' + kacir((dersId || "") + "/" + g[2]) + '">' +
        (g[1].trim() ? "<figcaption>" + kacir(g[1]) + "</figcaption>" : "") + "</figure>";
      i++; continue;
    }
    html += "<p>" + satiriCiz(satir, dersId) + "</p>";
    i++;
  }
  return html;
}

/* Arama ve sesli okuma için işaretsiz düz metin */
function duzMetin(md) {
  return String(md).split("\n")
    .filter(s => !/^```/.test(s) && !/^\|\s*:?-{3}/.test(s))
    .map(s => s.replace(/^#{3,4} /, "").replace(/^> ?/, "").replace(/^- /, "").replace(/^\d+\. /, "")
      .replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/\*\*/g, "").replace(/`/g, "").replace(/\|/g, " "))
    .join("\n");
}

/* ==========================================================================
   Yerel veritabanı (IndexedDB) — açılmazsa hafızada çalışır
   ========================================================================== */
const vt = (() => {
  const ANAHTAR = { icerik: "anahtar", kayit: "k", gorsel: "yol", durum: "ad" };
  const bellek = { icerik: new Map(), kayit: new Map(), gorsel: new Map(), durum: new Map() };
  let db = null;
  let kalici = false;   /* IndexedDB bir kez açıldıysa hafızaya düşülmez, yeniden açılır */

  const istekSoz = r => new Promise((coz, red) => { r.onsuccess = () => coz(r.result); r.onerror = () => red(r.error); });
  const bitisSoz = t => new Promise((coz, red) => {
    t.oncomplete = () => coz();
    t.onerror = () => red(t.error);
    t.onabort = () => red(t.error || new Error("işlem iptal edildi"));
  });

  function ac() {
    return new Promise(coz => {
      let istek;
      try { istek = window.indexedDB && indexedDB.open("programcilik", 1); } catch (e) { istek = null; }
      if (!istek) { coz(false); return; }
      istek.onupgradeneeded = () => {
        const d = istek.result;
        Object.keys(ANAHTAR).forEach(ad => { if (!d.objectStoreNames.contains(ad)) d.createObjectStore(ad, { keyPath: ANAHTAR[ad] }); });
      };
      istek.onsuccess = () => {
        const acilan = istek.result;
        db = acilan;
        kalici = true;
        acilan.onversionchange = () => { try { acilan.close(); } catch (e) {} if (db === acilan) db = null; };
        /* iOS arka plandaki uygulamanın bağlantısını kapatabilir */
        acilan.onclose = () => { if (db === acilan) db = null; };
        coz(true);
      };
      istek.onerror = () => coz(false);
      istek.onblocked = () => coz(false);
    });
  }

  /* Bağlantı kapanmışsa işlem başlatılamaz (InvalidStateError): bir kez
     yeniden açıp dener. İşlem nesnesi await'ten önce, aynı adımda kurulur. */
  async function islem(kur) {
    if (!db && kalici) await ac();
    if (!db) return kur(null);
    try { return await kur(db); }
    catch (e) {
      if (!e || e.name !== "InvalidStateError") throw e;
      db = null;
      await ac();
      return kur(db);
    }
  }

  return {
    ac,
    oku(depoAdi, anahtar) {
      return islem(d => d ? istekSoz(d.transaction(depoAdi).objectStore(depoAdi).get(anahtar))
                         : bellek[depoAdi].get(anahtar));
    },
    hepsi(depoAdi) {
      return islem(d => d ? istekSoz(d.transaction(depoAdi).objectStore(depoAdi).getAll())
                         : Array.from(bellek[depoAdi].values()));
    },
    /* Yazılacaklar ve silinecekler tek işlemde: ya hepsi olur ya hiçbiri */
    coklu(depoAdi, yazilacaklar, silinecekler) {
      return islem(d => {
        if (!d) {
          (silinecekler || []).forEach(a => bellek[depoAdi].delete(a));
          (yazilacaklar || []).forEach(x => bellek[depoAdi].set(x[ANAHTAR[depoAdi]], x));
          return;
        }
        const t = d.transaction(depoAdi, "readwrite");
        const ds = t.objectStore(depoAdi);
        (silinecekler || []).forEach(a => ds.delete(a));
        (yazilacaklar || []).forEach(x => ds.put(x));
        return bitisSoz(t);
      });
    },
    yaz(depoAdi, deger) { return this.coklu(depoAdi, [deger], []); },
    temizle() {
      Object.keys(bellek).forEach(ad => bellek[ad].clear());
      return islem(d => {
        if (!d) return;
        const t = d.transaction(Object.keys(ANAHTAR), "readwrite");
        Object.keys(ANAHTAR).forEach(ad => t.objectStore(ad).clear());
        return bitisSoz(t);
      });
    }
  };
})();

/* ==========================================================================
   İçerik modeli — ağaç ve konular yerel kayıttan kurulur
   ========================================================================== */
let AGAC = null;                    /* { gruplar: [...] } */
let AGAC_OZET = null;
const KONU_SATIRLARI = new Map();   /* id → sunucudan gelen satır */
const DERSLER = new Map();          /* id → { id, ad, kisa, grup, donem } */
const KONULAR = new Map();          /* id → konu (ders ve düz metin eklenmiş) */
const DERS_KONULARI = new Map();    /* ders id → [konu] (sıralı) */
let TUM_SORULAR = [];               /* her soru: { ...soru, konu } */
let TUM_KARTLAR = [];               /* her kart: { ...kart, konu } */
let ARAMA_INDEKSI = [];             /* { terim, izah, konu, tur } */
const SORU_HARITASI = new Map();

function dersAdi(dersId, kisa) {
  const d = DERSLER.get(dersId);
  return d ? (kisa && d.kisa ? d.kisa : d.ad) : "";
}
function konuEtiketi(konu) {
  return (konu.sira ? konu.sira + ". " : "") + konu.baslik;
}

function veriKur() {
  DERSLER.clear(); KONULAR.clear(); DERS_KONULARI.clear(); SORU_HARITASI.clear();
  TUM_SORULAR = []; TUM_KARTLAR = []; ARAMA_INDEKSI = [];
  if (!AGAC || !Array.isArray(AGAC.gruplar)) return;
  AGAC.gruplar.forEach(g => {
    const grup = { id: g.id, ad: g.ad };
    const ekle = (liste, donem) => (liste || []).forEach(d => {
      DERSLER.set(d.id, { id: d.id, ad: d.ad, kisa: d.kisa || null, grup, donem });
      DERS_KONULARI.set(d.id, []);
    });
    if (Array.isArray(g.donemler)) g.donemler.forEach(dn => ekle(dn.dersler, { id: dn.id, ad: dn.ad }));
    else ekle(g.dersler, null);
  });
  Array.from(KONU_SATIRLARI.values()).filter(s => DERSLER.has(s.ders)).forEach(s => {
    const konu = {
      id: s.id, ders: s.ders, sira: s.sira, baslik: s.baslik, metin: s.metin,
      kavramlar: Array.isArray(s.kavramlar) ? s.kavramlar : [],
      sorular: Array.isArray(s.sorular) ? s.sorular : [],
      kartlar: Array.isArray(s.kartlar) ? s.kartlar : []
    };
    konu.duz = duzMetin(konu.metin);
    konu.basliklar = konuBasliklari(konu.metin);
    KONULAR.set(konu.id, konu);
    DERS_KONULARI.get(konu.ders).push(konu);
  });
  DERS_KONULARI.forEach(liste => liste.sort((a, b) => a.sira - b.sira));
  /* Ders sırası ağaçtaki sıra olsun */
  Array.from(DERSLER.keys()).forEach(dersId => {
    DERS_KONULARI.get(dersId).forEach(konu => {
      konu.sorular.forEach(s => { const x = Object.assign({}, s, { konu }); TUM_SORULAR.push(x); SORU_HARITASI.set(s.id, x); });
      konu.kartlar.forEach(k => TUM_KARTLAR.push(Object.assign({}, k, { konu })));
      konu.kavramlar.forEach(k => ARAMA_INDEKSI.push({ terim: k.terim, izah: k.izah, konu, yer: k.yer || null, tur: "kavram" }));
      ARAMA_INDEKSI.push({ terim: konu.baslik, izah: "", konu, yer: null, tur: "baslik" });
      konu.basliklar.forEach(b => ARAMA_INDEKSI.push({ terim: b.metin, izah: "", konu, yer: b.metin, tur: "baslik" }));
    });
  });
}

/* Konunun ### ve #### başlıkları, sırasıyla. Kod bloğundaki "###" başlık
   sayılmaz (çizici de öyle yapar). ust: #### başlığının bağlı olduğu ###.
   Metin, çizicinin data-baslik değeriyle birebir aynıdır. */
function konuBasliklari(metin) {
  const liste = [];
  let kodda = false, ust = null;
  String(metin).split("\n").forEach(satir => {
    if (/^```/.test(satir)) { kodda = !kodda; return; }
    if (kodda) return;
    const dort = satir.startsWith("#### ");
    if (!dort && !satir.startsWith("### ")) return;
    const m = satir.slice(dort ? 5 : 4).trim();
    if (!m) return;
    if (dort) liste.push({ metin: m, seviye: 4, ust });
    else { ust = m; liste.push({ metin: m, seviye: 3, ust: null }); }
  });
  return liste;
}

async function yerelIcerigiYukle() {
  const satirlar = await vt.hepsi("icerik");
  KONU_SATIRLARI.clear();
  AGAC = null; AGAC_OZET = null;
  satirlar.forEach(s => {
    if (s.anahtar === "agac") { AGAC = s.veri; AGAC_OZET = s.ozet; }
    else if (s.anahtar.startsWith("konu:")) KONU_SATIRLARI.set(s.id, s);
  });
  veriKur();
}

/* ==========================================================================
   Kullanıcı kayıtları — okundu, boya, yıldız, yanlış, kart, yer
   Her yazım önce cihaza, sonra (bağlantı varsa) hesaba gider.
   ========================================================================== */
/* "tur|anahtar" → { k, tur, anahtar, deger, silindi, guncellendi, gonderildi }
   Her ekleme, değiştirme ve silmede kayitSurumu artar: kayıtlardan türeyen
   hesaplar (mühim durumu) bununla önbelleklenir. */
let kayitSurumu = 0;
const KAYITLAR = new (class extends Map {
  set(k, v) { kayitSurumu++; return super.set(k, v); }
  delete(k) { kayitSurumu++; return super.delete(k); }
  clear() { kayitSurumu++; return super.clear(); }
})();

function kayit(tur, anahtar) {
  const r = KAYITLAR.get(tur + "|" + anahtar);
  return r && !r.silindi ? r.deger : undefined;
}
function kayitlarTuru(tur) {
  const liste = [];
  KAYITLAR.forEach(r => { if (r.tur === tur && !r.silindi) liste.push(r); });
  return liste;
}
/* Yeni yazımın zamanı: cihaz saati, ama kaydın bilinen son hâlinden hep
   sonra. Saati geri kalmış bir cihaz, öbür cihazdan gelmiş bir değeri
   değiştirdiğinde yazımı sunucuda "eski" sayılıp kaybolmasın. */
function yeniZaman(eski) {
  const onceki = eski ? zamanMs(eski.guncellendi) : 0;
  return new Date(Math.max(Date.now(), onceki + 1)).toISOString();
}
/* Hesaptaki sınırlar: anahtar en çok 300 harf, değer en çok 64 KB.
   Aşan kayıt hiç gönderilemez ve arkasındakileri bekletirdi. */
function kayitSigarMi(anahtar, deger) {
  if (typeof anahtar !== "string" || !anahtar.length || anahtar.length > 300) return false;
  try { return deger === undefined || JSON.stringify(deger).length <= 60000; } catch (e) { return false; }
}
function kayitYaz(tur, anahtar, deger) {
  if (!kayitSigarMi(anahtar, deger)) { console.warn("kayıt sınırı aştı, yazılmadı", tur, anahtar); return; }
  const r = { k: tur + "|" + anahtar, tur, anahtar, deger, silindi: false, guncellendi: yeniZaman(KAYITLAR.get(tur + "|" + anahtar)), gonderildi: false };
  KAYITLAR.set(r.k, r);
  vt.yaz("kayit", r).catch(e => console.warn("kayıt cihaza yazılamadı", e));
  gondermeyiZamanla();
}
function kayitSil(tur, anahtar) {
  const eski = KAYITLAR.get(tur + "|" + anahtar);
  if (!eski || eski.silindi) return;
  const r = { k: eski.k, tur, anahtar, deger: null, silindi: true, guncellendi: yeniZaman(eski), gonderildi: false };
  KAYITLAR.set(r.k, r);
  vt.yaz("kayit", r).catch(e => console.warn("kayıt cihaza yazılamadı", e));
  gondermeyiZamanla();
}
async function yerelKayitlariYukle() {
  KAYITLAR.clear();
  (await vt.hepsi("kayit")).forEach(r => KAYITLAR.set(r.k, r));
}
function gonderilmemisSayisi() {
  let n = 0;
  KAYITLAR.forEach(r => { if (!r.gonderildi) n++; });
  return n;
}

/* ==========================================================================
   Supabase: oturum ve eşitleme
   ========================================================================== */
const ayarTamam = !!(AYAR.SUPABASE_URL && AYAR.ANAHTAR && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(AYAR.TASHIH_EPOSTA) &&
  window.supabase && window.supabase.createClient);
/* Her isteğe zaman sınırı: zayıf bağlantıda asılı kalan tek bir istek
   eşitlemeyi sayfa yenilenene kadar kilitlemesin. */
const ISTEK_SURESI = 25000;
/* Süre, cevabın gövdesi de inene kadar işler: fetch() başlıklar gelince
   biter, gövde yarıda takılırsa süre dolmuş olmazdı. Gövde burada okunup
   yeni bir cevap olarak verilir. */
async function zamanliFetch(adres, secenek) {
  const denetci = new AbortController();
  const ust = secenek && secenek.signal;
  if (ust) {
    if (ust.aborted) denetci.abort();
    else ust.addEventListener("abort", () => denetci.abort(), { once: true });
  }
  const sayac = setTimeout(() => denetci.abort(), ISTEK_SURESI);
  try {
    const c = await fetch(adres, Object.assign({}, secenek, { signal: denetci.signal }));
    const yontem = String((secenek && secenek.method) || "GET").toUpperCase();
    const govdesiz = yontem === "HEAD" || [101, 204, 205, 304].indexOf(c.status) !== -1;
    const govde = govdesiz ? null : await c.arrayBuffer();
    return new Response(govde, { status: c.status, statusText: c.statusText, headers: c.headers });
  } finally {
    clearTimeout(sayac);
  }
}

const istemci = ayarTamam ? window.supabase.createClient(AYAR.SUPABASE_URL, AYAR.ANAHTAR, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "pg-oturum" },
  global: { fetch: zamanliFetch }
}) : null;

let KULLANICI = null;          /* { id, eposta } — cihazda bilinen hesap */
/* Çıkışta artar. Eşitleme her beklemeden sonra buna bakar: çıkış sırasında
   yolda kalmış bir cevap, silinmiş cihaza eski hesabın verisini geri
   yazmasın (ve aynı cihazda sonra giren hesaba geçmesin). */
let oturumNesli = 0;
function nesilDenetle(nesil) {
  if (nesil !== oturumNesli) { const e = new Error("Eşitleme çıkış nedeniyle bırakıldı"); e.iptal = true; throw e; }
}
let sonEsitleme = null;        /* başarılı son eşitlemenin zamanı */
let esitlemeHatasi = null;
let erisimYok = false;
let bilerekCikiliyor = false;

function okulAdresiMi(adres) {
  const a = kucult(String(adres || "").trim());
  const parca = a.split("@");
  return parca.length === 2 && parca[0].length > 0 && !/\s/.test(a) && parca[1] === AYAR.OKUL_ALANI;
}

/* Hesap düğmesindeki nokta: bekleyen değişiklik ya da bağlantısızlık */
function hesapIsaretiniTazele() {
  const d = document.getElementById("hesapDugme");
  if (!d) return;
  const cevrimdisi = !navigator.onLine || !!esitlemeHatasi;
  d.classList.toggle("cevrimdisi", cevrimdisi);
  d.classList.toggle("bekliyor", !cevrimdisi && gonderilmemisSayisi() > 0);
}

/* ---------- İçerik: yalnızca değişen konular indirilir ---------- */
async function icerikEsitle(nesil) {
  /* Ağaç satırları: 1 herkesin gördüğü gruplar, 2 hususi gruplar (yalnızca
     hususi yetkisi olan hesaba gelir; sunucu kuralı süzer). Birleştirilir. */
  const a = await istemci.from("agac").select("id,veri,ozet").order("id", { ascending: true });
  if (a.error) throw a.error;
  nesilDenetle(nesil);
  /* Ağaç gelmiyorsa ya henüz içerik yok ya da hesap okul üyesi sayılmıyor.
     Her iki durumda da cihazdaki notlar silinmez. */
  if (!a.data || !a.data.length) { erisimYok = true; return false; }
  erisimYok = false;
  const agacVerisi = { gruplar: [] };
  a.data.forEach(r => { if (r.veri && Array.isArray(r.veri.gruplar)) r.veri.gruplar.forEach(g => agacVerisi.gruplar.push(g)); });
  const agacOzeti = a.data.map(r => r.id + ":" + r.ozet).join("|");
  /* Sunucu tek seferde en çok 1000 satır verir; liste sayfa sayfa alınır.
     Eksik liste, cihazdaki konuları "silinmiş" sanıp sildirirdi. */
  const uzak = new Map();
  for (let bas = 0; ; bas += 1000) {
    const l = await istemci.from("konular").select("id,ozet").order("id", { ascending: true }).range(bas, bas + 999);
    if (l.error) throw l.error;
    l.data.forEach(r => uzak.set(r.id, r.ozet));
    if (l.data.length < 1000) break;
  }
  nesilDenetle(nesil);
  const gerekli = [];
  uzak.forEach((oz, id) => { const y = KONU_SATIRLARI.get(id); if (!y || y.ozet !== oz) gerekli.push(id); });
  const silinen = Array.from(KONU_SATIRLARI.keys()).filter(id => !uzak.has(id));
  const agacDegisti = AGAC_OZET !== agacOzeti;
  /* Görsel budaması: ağaç değişince ya da konu silinince; ayrıca her açılışta
     bir kez (önceki budama yarıda kaldıysa telafi edilsin) */
  const budanacak = agacDegisti || silinen.length > 0 || !gorselBudandi;
  if (!gerekli.length && !silinen.length && !agacDegisti) {
    if (budanacak) { gorselBudandi = true; gorselleriBuda(nesil); }
    return false;
  }
  const gelen = [];
  for (let i = 0; i < gerekli.length; i += 25) {
    const r = await istemci.from("konular")
      .select("id,ders,sira,baslik,metin,kavramlar,sorular,kartlar,ozet")
      .in("id", gerekli.slice(i, i + 25));
    if (r.error) throw r.error;
    nesilDenetle(nesil);
    gelen.push(...r.data);
  }
  const yazilacak = [{ anahtar: "agac", veri: agacVerisi, ozet: agacOzeti }]
    .concat(gelen.map(k => Object.assign({ anahtar: "konu:" + k.id }, k)));
  nesilDenetle(nesil);
  await vt.coklu("icerik", yazilacak, silinen.map(id => "konu:" + id));
  nesilDenetle(nesil);
  AGAC = agacVerisi; AGAC_OZET = agacOzeti;
  silinen.forEach(id => KONU_SATIRLARI.delete(id));
  gelen.forEach(k => KONU_SATIRLARI.set(k.id, Object.assign({ anahtar: "konu:" + k.id }, k)));
  veriKur();
  gorselBudandi = true;
  gorselleriBuda(nesil);
  return true;
}
let gorselBudandi = false;

/* Hiçbir konunun artık kullanmadığı önbellek görselleri silinir: ağaçtan
   kalkan dersinkiler (ör. hususi yetkisi geri alınınca) ve düzeltilip yeni
   adla gelen görselin eski kopyası. Hata eşitlemeyi durdurmaz. */
async function gorselleriBuda(nesil) {
  try {
    const kayitli = await vt.hepsi("gorsel");
    if (nesil !== oturumNesli) return;
    const kullanilan = new Set();
    KONULAR.forEach(k => {
      for (const m of String(k.metin).matchAll(/!\[[^\]]*\]\(gorseller\/([^)\s]+)\)/g)) kullanilan.add(k.ders + "/" + m[1]);
    });
    const silinecek = kayitli.map(g => g.yol).filter(yol => !kullanilan.has(yol));
    if (!silinecek.length) return;
    await vt.coklu("gorsel", [], silinecek);
    silinecek.forEach(yol => {
      const adres = gorselAdresleri.get(yol);
      if (adres) { try { URL.revokeObjectURL(adres); } catch (e) {} gorselAdresleri.delete(yol); }
    });
  } catch (e) { console.warn("görsel önbelleği budanamadı", e); }
}

/* ---------- Kayıtlar: gönder ----------
   Sunucu her satırın zamanını kendi saatine göre düzeltebilir (ileri saat)
   ya da daha yeni bir yazım varken satırı hiç almayabilir. Gönderilen
   satırların sunucudaki hâli geri istenir ve cihaz ona uyar; böylece
   cihazların saati farklı olsa da hepsi aynı sonuca varır. */
const KAYIT_SUTUNLARI = "tur,anahtar,deger,silindi,guncellendi";

/* Satırın kendisinden kaynaklanan (yeniden denemekle düzelmeyecek) hata */
function kayitVerisiHatasiMi(e) {
  return !!e && ["23514", "22001", "22P02", "23502", "54000"].indexOf(String(e.code || "")) !== -1;
}

async function kayitParcasiGonder(parca) {
  const satirlar = parca.map(r => ({
    kullanici: KULLANICI.id, tur: r.tur, anahtar: r.anahtar,
    deger: r.deger === undefined ? null : r.deger, silindi: !!r.silindi, guncellendi: r.guncellendi
  }));
  const c = await istemci.from("kayitlar").upsert(satirlar, { onConflict: "kullanici,tur,anahtar" }).select(KAYIT_SUTUNLARI);
  if (c.error) throw c.error;
  return c.data || [];
}

async function kayitGonder(nesil) {
  const bekleyen = [];
  KAYITLAR.forEach(r => { if (!r.gonderildi) bekleyen.push(r); });
  for (let i = 0; i < bekleyen.length; i += 200) {
    nesilDenetle(nesil);
    const parca = bekleyen.slice(i, i + 200);
    let donen, reddedilen = [], bekleyecek = [];
    try {
      donen = await kayitParcasiGonder(parca);
    } catch (e) {
      if (!kayitVerisiHatasiMi(e)) throw e;
      /* Bir satır sunucunun sınırına takıldı: satırlar tek tek gönderilir,
         sorunlu olan cihazda kalır ama öbürlerini bekletmez. */
      donen = [];
      for (const r of parca) {
        try { donen.push(...await kayitParcasiGonder([r])); }
        catch (e2) {
          if (!kayitVerisiHatasiMi(e2)) throw e2;
          /* Sunucu bu kayıt türünü henüz tanımıyor (şema güncellenmemiş):
             kayıt cihazda bekler, şema güncellenince gönderilir */
          if (/kayitlar_tur_check/.test(String(e2.message || ""))) { bekleyecek.push(r); console.warn("kayıt türü sunucuda tanımlı değil", r.k); }
          else { console.warn("kayıt hesaba kabul edilmedi", r.k, e2); reddedilen.push(r); }
        }
        nesilDenetle(nesil);
      }
    }
    nesilDenetle(nesil);
    const sunucuda = new Map(donen.map(u => [u.tur + "|" + u.anahtar, u]));
    const isaretle = [], yeniden = [];
    parca.forEach(r => {
      /* Gönderim sürerken kayıt yeniden değiştiyse o yeni hâl bekler */
      if (KAYITLAR.get(r.k) !== r || r.gonderildi || bekleyecek.indexOf(r) !== -1) return;
      const u = sunucuda.get(r.k);
      if (u) { r.guncellendi = u.guncellendi; r.gonderildi = true; isaretle.push(r); }
      else if (reddedilen.indexOf(r) !== -1) { r.gonderildi = true; isaretle.push(r); }
      else yeniden.push(r);   /* sunucuda daha yeni bir yazım var */
    });
    if (isaretle.length) await vt.coklu("kayit", isaretle, []);
    if (yeniden.length) await sunucudakiniAl(yeniden, nesil);
  }
}

/* Sunucunun kabul etmediği (çünkü daha yenisini bildiği) kayıtların
   sunucudaki hâli alınır ve cihazdakinin yerine konur. */
async function sunucudakiniAl(liste, nesil) {
  const turler = new Map();
  liste.forEach(r => { if (!turler.has(r.tur)) turler.set(r.tur, []); turler.get(r.tur).push(r); });
  const yazilacak = [];
  /* Anahtarlar serbest metin olabilir (yıldız); "in (...)" süzgecinde tırnak ve
     ters bölü kaçırılmadığı için kayıtlar tek tek istenir. Bu yol nadir çalışır. */
  for (const [tur, kayitlar] of turler) {
    for (const tek of kayitlar) {
      const dilim = [tek];
      const c = await istemci.from("kayitlar").select(KAYIT_SUTUNLARI).eq("tur", tur).eq("anahtar", tek.anahtar);
      if (c.error) throw c.error;
      nesilDenetle(nesil);
      const gelen = new Map(c.data.map(u => [u.anahtar, u]));
      dilim.forEach(r => {
        if (KAYITLAR.get(r.k) !== r) return;
        const u = gelen.get(r.anahtar);
        const yeni = u
          ? { k: r.k, tur, anahtar: r.anahtar, deger: u.deger, silindi: u.silindi, guncellendi: u.guncellendi, gonderildi: true }
          : Object.assign({}, r, { gonderildi: true });
        KAYITLAR.set(r.k, yeni);
        yazilacak.push(yeni);
      });
    }
  }
  if (yazilacak.length) await vt.coklu("kayit", yazilacak, []);
}

/* ---------- Kayıtlar: çek ---------- */
async function kayitCek(nesil) {
  const durum = await vt.oku("durum", "sonCekme");
  const onceki = durum ? zamanMs(durum.deger) : 0;
  /* İki dakikalık örtüşme: aynı anda kaydedilen satırlar kaçmasın */
  let esik = new Date(Math.max(0, onceki - 120000)).toISOString();
  let enSon = durum ? durum.deger : null;
  let degisti = false;
  for (;;) {
    const r = await istemci.from("kayitlar")
      .select("tur,anahtar,deger,silindi,guncellendi,sunucuda")
      .gt("sunucuda", esik).order("sunucuda", { ascending: true }).limit(1000);
    if (r.error) throw r.error;
    nesilDenetle(nesil);
    const yazilacak = [];
    r.data.forEach(u => {
      const k = u.tur + "|" + u.anahtar;
      const y = KAYITLAR.get(k);
      if (!y || zamanMs(u.guncellendi) > zamanMs(y.guncellendi)) {
        const yeni = { k, tur: u.tur, anahtar: u.anahtar, deger: u.deger, silindi: u.silindi, guncellendi: u.guncellendi, gonderildi: true };
        KAYITLAR.set(k, yeni);
        yazilacak.push(yeni);
      }
    });
    if (yazilacak.length) { await vt.coklu("kayit", yazilacak, []); degisti = true; }
    if (r.data.length) { enSon = r.data[r.data.length - 1].sunucuda; esik = enSon; }
    if (r.data.length < 1000) break;
  }
  nesilDenetle(nesil);
  if (enSon) await vt.yaz("durum", { ad: "sonCekme", deger: enSon });
  return degisti;
}

/* ---------- Tek seferde tek eşitleme ----------
   Eşitleme sürerken yeni bir istek gelirse aynı söz döner ve iş bitince bir
   tur daha atılır; böylece hiçbir değişiklik arada kalmaz.
   DİKKAT: "sürüyor" işareti, söz oluşturulduktan SONRA ve yalnızca o söz
   bittiğinde temizlenir. Bağlantı yokken tur hiç beklemeden biter; temizlik
   tur içinde yapılsaydı atamadan önce çalışır, bitmiş söz sonsuza dek
   "sürüyor" sayılır ve hiçbir değişiklik bir daha gönderilmezdi. */
let esitlemeSuren = null;
let esitlemeTekrar = false;
let cikisBekliyor = false;     /* kullanıcı çıkış yapıyor: eşitleme başlamaz */
let cihazDevredildi = false;   /* false | "baska" | "yetkisiz" */

async function esitlemeTuru(nesil) {
  let degisti = false;
  try {
    do {
      esitlemeTekrar = false;
      if (!navigator.onLine) { esitlemeHatasi = "Bağlantı yok"; break; }
      /* Bu cihazın yeri başka bir cihaza geçtiyse bu cihaz kapanır; boş yer
         varsa (ör. öbür cihaz çıkış yaptı) bu cihaz sessizce yer alır. */
      const cihaz = await cihazYokla();
      nesilDenetle(nesil);
      if (cihaz.durum === "baska" || cihaz.durum === "yetkisiz") { cihazDevredildi = cihaz.durum; break; }
      if (cihaz.durum === "bos") { await cihaziSahiplen(); nesilDenetle(nesil); }
      const icerik = await icerikEsitle(nesil);
      /* Gönderim takılsa da öbür cihazlardan gelenler alınsın */
      let gonderimHatasi = null;
      try { await kayitGonder(nesil); } catch (e) { if (e && e.iptal) throw e; gonderimHatasi = e; }
      const kayitlar = await kayitCek(nesil);
      if (gonderimHatasi) throw gonderimHatasi;
      degisti = degisti || icerik || kayitlar;
      sonEsitleme = new Date();
      esitlemeHatasi = null;
    } while (esitlemeTekrar);
  } catch (e) {
    if (e && e.iptal) return false;
    esitlemeHatasi = (e && e.message) || "Bilinmeyen hata";
    console.warn("eşitleme durdu", e);
  }
  return degisti;
}

function esitle() {
  if (!istemci || !KULLANICI || cikisBekliyor) return Promise.resolve(false);
  if (esitlemeSuren) { esitlemeTekrar = true; return esitlemeSuren; }
  const nesil = oturumNesli;
  const bu = esitlemeTuru(nesil);
  esitlemeSuren = bu;
  bu.then(degisti => {
    if (esitlemeSuren === bu) esitlemeSuren = null;
    if (nesil !== oturumNesli) return;   /* bu arada çıkış yapıldı */
    if (cihazDevredildi) {
      const neden = cihazDevredildi;
      cihazDevredildi = false;
      cikisYap(neden === "baska"
        ? "Hesabınız başka bir cihazda açıldı; bu cihazdan çıkış yapıldı ve cihazdaki notlar silindi. Burada kullanmak için yeniden giriş yapın."
        : "Bu cihazdaki oturumunuz kapanmış; cihazdaki notlar silindi. Okul adresinizle yeniden giriş yapın.");
      return;
    }
    hesapIsaretiniTazele();
    if (degisti) esitlemeSonrasiTazele();
    /* Tur biterken gelen istek kaçmasın */
    if (esitlemeTekrar) { esitlemeTekrar = false; esitle(); }
  }).catch(e => console.warn("eşitleme sonrası ekran tazelenemedi", e));
  return bu;
}

let gondermeZamanlayici = null;
function gondermeyiZamanla() {
  hesapIsaretiniTazele();
  if (gondermeZamanlayici) clearTimeout(gondermeZamanlayici);
  gondermeZamanlayici = setTimeout(() => { gondermeZamanlayici = null; esitle(); }, 2000);
}

/* Etkin sekme kendi kök ekranında mı? Üstte açık bir panel ya da not kutusu
   olması önemli değil; onların altındaki sayfa güvenle yeniden çizilir. */
function kokteMi() {
  if (aktifSekme === "oku") return okuAcik === null;
  const sayfa = document.getElementById(SEKMELER.find(s => s.ad === aktifSekme).sayfa);
  if (aktifSekme === "calis") return !sayfa.querySelector(".geri, .ilerleme, .bitis");
  if (aktifSekme === "kart") return !sayfa.querySelector(".deste, .bitis");
  return false;
}

/* Yeni veri geldiğinde: kök ekrandaysak yeniden çiz, okurken ya da soru
   çözerken ekranı bozmadan yalnızca haber ver */
function esitlemeSonrasiTazele() {
  if (!uygulamaAcik) return;
  if (aktifSekme === "oku" && okuAcik && okuAcik.tur === "muhim") { muhimlerCiz(null); return; }
  if (kokteMi()) sekmeyiTazele();
  else kisaBildirim("Notlar ve ilerlemeniz güncellendi");
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && uygulamaAcik) esitle();
});
window.addEventListener("online", () => { if (uygulamaAcik) esitle(); hesapIsaretiniTazele(); });
window.addEventListener("offline", hesapIsaretiniTazele);
setInterval(() => { if (uygulamaAcik && document.visibilityState === "visible") esitle(); }, 5 * 60 * 1000);

/* ---------- Çıkış: cihazdaki her şey silinir ---------- */
async function yerelVeriyiSil() {
  /* Yoldaki eşitleme bırakılır; sonucu artık hiçbir yere yazılmaz */
  oturumNesli++;
  esitlemeSuren = null; esitlemeTekrar = false; cihazDevredildi = false;
  if (gondermeZamanlayici) { clearTimeout(gondermeZamanlayici); gondermeZamanlayici = null; }
  KAYITLAR.clear(); KONU_SATIRLARI.clear(); AGAC = null; AGAC_OZET = null; veriKur();
  boyaBolumuOnbellegi.clear(); muhimDurumOnbellegi.clear();
  KULLANICI = null; sonEsitleme = null; esitlemeHatasi = null; erisimYok = false; cihazSiniri = 1;
  ["pg.kapsam", "pg.kartDers", "pg.kartKonular", "pg.kartBilemedik", "pg.muhimSuzgec", "pg.kartMuhim",
   "pg.sonEposta", "pg.bekleyenKod", "pg.devralma"].forEach(a => depo.sil(a));
  try { await vt.temizle(); } catch (e) { console.warn("yerel veri silinemedi", e); }
}

let cikisSuruyor = false;
async function cikisYap(mesaj) {
  /* Aynı anda iki yerden (ör. oturum düştü + cihaz devredildi) çağrılırsa bir kez çalışır */
  if (cikisSuruyor) return;
  cikisSuruyor = true;
  try { await cikisIsi(mesaj); } finally { cikisSuruyor = false; }
}
async function cikisIsi(mesaj) {
  oturumNesli++;
  bilerekCikiliyor = true;
  try { if (istemci) await istemci.auth.signOut({ scope: "local" }); } catch (e) {}
  bilerekCikiliyor = false;
  sesDurdur();
  await yerelVeriyiSil();
  uygulamayiKapat();
  cikisBekliyor = false;
  girisEkraniAc(mesaj);
}

/* Kullanıcının kendi isteğiyle çıkışta önce bu cihazın yeri hesapta
   boşaltılır. Bağlantı yoksa oturum yalnızca cihazdan silinir ve yer
   sunucuda dolu kalırdı: yeni cihazda gereksiz devralma kodu istenir ve
   cihaz değişim kaydına haksız bir "devralma" düşerdi. Önce sorulur.
   true: çıkışa devam. */
async function yeriBirakVeyaSor() {
  /* Yer bırakıldıktan sonra arka plandaki bir eşitleme onu yeniden almasın */
  cikisBekliyor = true;
  oturumNesli++;
  esitlemeSuren = null; esitlemeTekrar = false;
  if (istemci && navigator.onLine) {
    try {
      const r = await istemci.rpc("cihazi_birak");
      if (!r.error) return true;
    } catch (e) {}
  }
  const devam = window.confirm("Sunucuya ulaşılamadı. Yine de çıkarsanız bu cihaz hesabınızda yer tutmaya devam eder; " +
    "başka bir cihazdan girerken e-postanıza devralma kodu gönderilir. Çıkılsın mı?");
  if (!devam) cikisBekliyor = false;
  return devam;
}

if (istemci) {
  istemci.auth.onAuthStateChange(olay => {
    /* Oturum sunucu tarafından sonlandırıldıysa (ör. hesap silindi) yerelde de kapanır */
    if (olay === "SIGNED_OUT" && !bilerekCikiliyor && KULLANICI) {
      setTimeout(() => cikisYap("Oturumunuz kapandı; hesabınız başka bir cihazda açılmış olabilir. Okul adresinizle yeniden giriş yapın."), 0);
    }
  });
}

/* ==========================================================================
   Giriş ekranı: okul adresine gelen kodla
   ========================================================================== */
let girisPerdesi = null;
/* Supabase aynı adrese en çok dakikada bir e-posta gönderir; cihaz devralma
   kodu da bu sınıra takılmasın diye son gönderim anı tutulur. */
let sonKodGonderimi = 0;
const KOD_ARALIGI = 60;

function iosMu() {
  const ua = navigator.userAgent || "";
  return /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function hataMesaji(e) {
  const m = String((e && e.message) || "");
  const durum = e && e.status;
  if (!navigator.onLine || /fetch|network|Failed to/i.test(m)) return "İnternet bağlantısı yok. Bağlanınca yeniden deneyin.";
  if (/kocaelisaglik/i.test(m)) return m;
  if (durum === 429 || /rate limit|security purposes|only request this after/i.test(m)) {
    const sn = /after (\d+) seconds?/i.exec(m);
    return sn ? "Aynı adrese kısa sürede ikinci kod gönderilemiyor. " + sn[1] + " saniye sonra yeniden deneyin."
      : "Çok sık kod istendi. Bir dakika bekleyip yeniden deneyin.";
  }
  if (/expired|invalid|otp/i.test(m)) return "Kod hatalı ya da süresi dolmuş. Son gelen kodu yazın ya da yeni kod isteyin.";
  if (/signups not allowed/i.test(m)) return "Bu adresle hesap açılamıyor. Okul adresinizi doğru yazdığınızdan emin olun.";
  return "Giriş tamamlanamadı: " + m;
}

function girisEkraniAc(ustMesaj) {
  if (girisPerdesi) girisPerdesi.remove();
  const perde = olustur("div", "giris-perde");
  const kutu = olustur("div", "giris-kutu");
  perde.appendChild(kutu);
  document.body.appendChild(perde);
  girisPerdesi = perde;

  let eposta = depo.oku("pg.sonEposta", "");
  let kodBekleniyor = false;
  let geriSayim = 0, sayac = null;
  /* Kod beklenirken uygulama yeniden yüklenirse (iPhone'da kodu okumak için
     Mail'e geçince sık olur) kod ekranına dönülür; kod 15 dakika geçerli. */
  const bekleyen = depo.oku("pg.bekleyenKod", null);
  if (bekleyen && bekleyen.eposta && Date.now() - bekleyen.zaman < 15 * 60 * 1000) {
    eposta = bekleyen.eposta;
    kodBekleniyor = true;
    sonKodGonderimi = Math.max(sonKodGonderimi, bekleyen.zaman);
  }
  const kodGonderildi = () => {
    sonKodGonderimi = Date.now();
    depo.yaz("pg.bekleyenKod", { eposta, zaman: sonKodGonderimi });
  };
  let dogrulaniyor = false;

  function ciz(hata, bilgi) {
    kutu.innerHTML = "";
    const baslik = olustur("h2", "giris-baslik");
    baslik.innerHTML = '<span class="kok">~/</span>Programcılık';
    const alt = olustur("p", "giris-alt");
    alt.textContent = "Bilgisayar Programcılığı ders notları ve temrinleri. Yalnızca okulun öğrencileri ve hocaları içindir; girmek için okul e-posta adresinize gelen kodu kullanırsınız.";
    kutu.append(baslik, alt);
    if (!ayarTamam) {
      const h = olustur("p", "giris-hata");
      h.textContent = "Uygulama henüz yapılandırılmadı: index.html içindeki AYAR bölümüne Supabase adresi, yayımlanabilir anahtar ve tashih e-posta adresi yazılmalı.";
      kutu.appendChild(h);
      return;
    }
    if (ustMesaj) { const b = olustur("p", "giris-bilgi"); b.textContent = ustMesaj; kutu.appendChild(b); ustMesaj = null; }
    if (bilgi) { const b = olustur("p", "giris-bilgi"); b.textContent = bilgi; kutu.appendChild(b); }
    if (hata) { const h = olustur("p", "giris-hata"); h.setAttribute("role", "alert"); h.textContent = hata; kutu.appendChild(h); }

    if (!kodBekleniyor) {
      const etiket = olustur("label", "giris-etiket");
      etiket.textContent = "Okul e-posta adresiniz";
      etiket.htmlFor = "girisEposta";
      const girdi = olustur("input", "giris-girdi");
      girdi.id = "girisEposta";
      girdi.type = "email";
      girdi.autocomplete = "email";
      girdi.inputMode = "email";
      girdi.autocapitalize = "off";
      girdi.spellcheck = false;
      girdi.placeholder = "ad.soyad@" + AYAR.OKUL_ALANI;
      girdi.value = eposta;
      const eylem = olustur("div", "eylem");
      const gonder = olustur("button", "ana");
      gonder.textContent = "Kod gönder";
      eylem.appendChild(gonder);
      kutu.append(etiket, girdi, eylem);
      const gonderIsi = async () => {
        if (gonder.disabled) return;   /* Enter ile ikinci kez gönderilmesin */
        /* toLowerCase "İ"yi iki harfe çevirir; kucult tek harf "i" yapar */
        eposta = kucult(girdi.value.trim());
        if (!okulAdresiMi(eposta)) { ciz("Yalnızca @" + AYAR.OKUL_ALANI + " ile biten okul adresiyle giriş yapılabilir."); return; }
        gonder.disabled = true; gonder.textContent = "Gönderiliyor…";
        try {
          const c = await istemci.auth.signInWithOtp({ email: eposta, options: { shouldCreateUser: true } });
          if (c.error) throw c.error;
          depo.yaz("pg.sonEposta", eposta);
          kodGonderildi();
          kodBekleniyor = true;
          geriSayimBaslat();
          ciz(null, eposta + " adresine bir kod gönderildi. Gelen kutunuzu (ve gereksiz klasörünüzü) kontrol edin.");
        } catch (e) {
          /* Aynı adrese az önce kod gitmiş: yeniden istemek yerine o kod yazılır */
          const m = /after (\d+) seconds?/i.exec(String((e && e.message) || ""));
          if (m && eposta === depo.oku("pg.sonEposta", "")) {
            kodBekleniyor = true;
            geriSayim = Number(m[1]);
            geriSayimBaslat(geriSayim);
            ciz(null, "Bu adrese az önce kod gönderildi; gelen son kodu yazın.");
            return;
          }
          ciz(hataMesaji(e));
        }
      };
      gonder.addEventListener("click", gonderIsi);
      girdi.addEventListener("keydown", e => { if (e.key === "Enter") gonderIsi(); });
      if (!eposta) setTimeout(() => girdi.focus(), 50);
    } else {
      const etiket = olustur("label", "giris-etiket");
      etiket.textContent = "E-postadaki kod";
      etiket.htmlFor = "girisKod";
      const girdi = olustur("input", "giris-girdi kod");
      girdi.id = "girisKod";
      girdi.inputMode = "numeric";
      girdi.autocomplete = "one-time-code";
      girdi.maxLength = 10;
      girdi.placeholder = "••••••";
      const eylem = olustur("div", "eylem");
      const dogrula = olustur("button", "ana");
      dogrula.textContent = "Giriş yap";
      eylem.appendChild(dogrula);
      const yeniden = olustur("button", "giris-bag");
      const yenidenYazisi = () => {
        yeniden.disabled = geriSayim > 0;
        yeniden.textContent = geriSayim > 0 ? "Yeni kod " + geriSayim + " sn sonra istenebilir" : "Yeni kod gönder";
      };
      yenidenYazisi();
      yeniden.dataset.geriSayim = "1";
      yeniden._tazele = yenidenYazisi;
      const degistir = olustur("button", "giris-bag");
      degistir.textContent = "Adresi değiştir";
      kutu.append(etiket, girdi, eylem, yeniden, degistir);
      girdi.addEventListener("input", () => { girdi.value = girdi.value.replace(/\D/g, ""); });
      const dogrulaIsi = async () => {
        if (dogrulaniyor) return;   /* Enter ile ikinci kez gönderilmesin */
        const kod = girdi.value.trim();
        if (kod.length < 6) { ciz("Kod en az 6 haneli olmalı."); return; }
        dogrulaniyor = true;
        dogrula.disabled = true; dogrula.textContent = "Doğrulanıyor…";
        try {
          const c = await istemci.auth.verifyOtp({ email: eposta, token: kod, type: "email" });
          if (c.error) throw c.error;
          if (!c.data || !c.data.session) throw new Error("Oturum açılamadı");
          await oturumAcildi(c.data.session);
        } catch (e) {
          /* Giriş ekranı bu arada kapandıysa (ör. profil adımında hata)
             hata kaybolmasın diye giriş ekranı yeniden açılır */
          if (girisPerdesi && girisPerdesi.contains(kutu)) ciz(hataMesaji(e));
          else girisEkraniAc(hataMesaji(e));
        } finally { dogrulaniyor = false; }
      };
      dogrula.addEventListener("click", dogrulaIsi);
      girdi.addEventListener("keydown", e => { if (e.key === "Enter") dogrulaIsi(); });
      yeniden.addEventListener("click", async () => {
        if (geriSayim > 0) return;
        yeniden.disabled = true;
        try {
          const c = await istemci.auth.signInWithOtp({ email: eposta, options: { shouldCreateUser: true } });
          if (c.error) throw c.error;
          kodGonderildi();
          geriSayimBaslat();
          ciz(null, "Yeni kod gönderildi. En son gelen kodu kullanın.");
        } catch (e) { ciz(hataMesaji(e)); }
      });
      degistir.addEventListener("click", () => { kodBekleniyor = false; depo.sil("pg.bekleyenKod"); ciz(); });
      setTimeout(() => girdi.focus(), 50);
    }

    if (iosMu() && !zatenKurulu()) {
      const not = olustur("p", "giris-bilgi");
      not.textContent = "iPhone'da önce uygulamayı ana ekrana ekleyip oradan açmanız önerilir: Safari'de yaptığınız giriş ana ekrandaki uygulamaya taşınmaz. (Safari'de Paylaş › Ana Ekrana Ekle)";
      kutu.appendChild(not);
    }
    const not = olustur("p", "giris-not");
    not.textContent = "Şifre, öğrenci numarası ya da OBS bilgisi istenmez. Hesap aynı anda bir cihazda açık olabilir. Okuduğunuz konular, boyadığınız yerler ve temrin ilerlemeniz hesabınızda saklanır; cihaz değiştirdiğinizde yeni cihaza gelir.";
    kutu.appendChild(not);
  }

  function geriSayimBaslat(saniye) {
    geriSayim = saniye || KOD_ARALIGI;
    if (sayac) clearInterval(sayac);
    sayac = setInterval(() => {
      geriSayim--;
      const d = kutu.querySelector("[data-geri-sayim]");
      if (d && d._tazele) d._tazele();
      if (geriSayim <= 0) { clearInterval(sayac); sayac = null; }
    }, 1000);
  }

  if (kodBekleniyor) {
    const kalan = KOD_ARALIGI - Math.floor((Date.now() - sonKodGonderimi) / 1000);
    if (kalan > 0) geriSayimBaslat(kalan);
    ciz(null, eposta + " adresine gönderilen kodu yazın.");
  } else ciz();
}

function girisEkraniniKapat() {
  if (girisPerdesi) { girisPerdesi.remove(); girisPerdesi = null; }
}

/* Kod doğrulandı: önce bu cihazın hesabı kullanıp kullanamayacağına bakılır,
   sonra hesap cihaza işlenir; profil ve sözleşme tamamsa uygulama açılır */
async function oturumAcildi(oturum) {
  if (!(await cihazAdimi(oturum.user.email))) return;
  const yeni = { id: oturum.user.id, eposta: oturum.user.email };
  const eski = await vt.oku("durum", "kullanici");
  /* Cihazdaki veri yalnızca aynı hesabınsa korunur (ör. oturumu düşmüş
     hesabın gönderilmemiş değişiklikleri). Hesap izi yoksa da temizlenir:
     çıkışta yarım kalmış bir yazım sahipsiz veri bırakmış olabilir. */
  if (!eski || !eski.deger || eski.deger.id !== yeni.id) {
    const sinir = cihazSiniri;   /* az önce sunucudan öğrenildi; silme sıfırlamasın */
    await yerelVeriyiSil();
    cihazSiniri = sinir;
    depo.yaz("pg.sonEposta", yeni.eposta);
  }
  depo.sil("pg.bekleyenKod"); depo.sil("pg.devralma");
  await vt.yaz("durum", { ad: "kullanici", deger: yeni });
  KULLANICI = yeni;
  girisEkraniniKapat();
  await yerelKayitlariYukle();
  await yerelIcerigiYukle();
  await acilisiTamamla(true);
}

/* ==========================================================================
   Cihaz sınırı
   Hesap aynı anda en çok "azami_cihaz" kadar cihazda açık olabilir
   (varsayılan 1). Kural ve cihaz değişim sayacı veritabanında işler
   (bkz. 01-sema.sql, "Cihaz sınırı"); burada yalnızca ekranlar var.
   ========================================================================== */
let cihazSiniri = 1;

/* { durum: "bu" | "bos" | "baska" | "yetkisiz", azami } */
async function cihazYokla() {
  const r = await istemci.rpc("cihaz_yokla");
  if (r.error) throw r.error;
  const c = r.data || { durum: "yetkisiz" };
  if (typeof c.azami === "number" && c.azami > 0) cihazSiniri = c.azami;
  return c;
}

async function cihaziSahiplen() {
  const r = await istemci.rpc("cihazi_sahiplen");
  if (r.error) throw r.error;
  return r.data;
}

/* Kod doğrulandıktan hemen sonra çağrılır. true: bu cihaz aktif, devam edilir.
   false: kullanıcı vazgeçti, giriş ekranına dönüldü.
   İlk denetim ağ hatası verirse hata yukarı (giriş ekranına) iletilir. */
async function cihazAdimi(eposta) {
  const c = await cihazYokla();
  if (c.durum === "yetkisiz") throw new Error("Bu hesap okul üyesi olarak tanınmadı");
  if (c.durum !== "baska") { await cihaziSahiplen(); return true; }
  /* Devralma kodu istendikten sonra uygulama yeniden yüklendiyse kod giriş
     ekranından yazılmıştır; istek hâlâ geçerliyse sunucu devralmayı kabul
     eder, soru yeniden sorulmaz. */
  const istek = depo.oku("pg.devralma", null);
  if (typeof istek === "number" && Date.now() - istek < 30 * 60 * 1000) {
    try { await cihaziSahiplen(); return true; } catch (e) { /* süresi dolmuş: soruya geç */ }
  }
  return devralmaEkrani(eposta, cihazSiniri);
}

function devralmaEkrani(eposta, azami) {
  return new Promise(coz => {
    if (girisPerdesi) girisPerdesi.remove();
    const perde = olustur("div", "giris-perde");
    const kutu = olustur("div", "giris-kutu");
    perde.appendChild(kutu);
    document.body.appendChild(perde);
    girisPerdesi = perde;

    let asama = "soru";          /* "soru" | "kod" */
    let sayac = null;
    let istekKaydedildi = false;
    let ilkOturumAcik = true;    /* ilk kodla açılan, yer alamamış oturum */
    const cok = azami > 1;

    const kalanSure = () => Math.max(0, KOD_ARALIGI - Math.floor((Date.now() - sonKodGonderimi) / 1000));

    function sayaciKur() {
      if (sayac) clearInterval(sayac);
      sayac = setInterval(() => {
        const d = kutu.querySelector("[data-sure]");
        if (d && d._tazele) d._tazele();
        if (!kalanSure()) { clearInterval(sayac); sayac = null; if (d && d._tazele) d._tazele(); }
      }, 1000);
    }

    function bitir(sonuc) {
      if (sayac) { clearInterval(sayac); sayac = null; }
      coz(sonuc);
    }

    async function vazgec() {
      depo.sil("pg.devralma"); depo.sil("pg.bekleyenKod");
      bilerekCikiliyor = true;
      try { await istemci.auth.signOut({ scope: "local" }); } catch (e) {}
      bilerekCikiliyor = false;
      if (sayac) { clearInterval(sayac); sayac = null; }
      girisEkraniAc(cok ? "Giriş yapılmadı; hesabınız öbür cihazlarında açık kaldı." : "Giriş yapılmadı; hesabınız öbür cihazda açık kaldı.");
      coz(false);
    }

    /* Saniye sayan düğme: süre dolana kadar kapalı kalır */
    function sureliDugme(dugme, etiket) {
      dugme.dataset.sure = "1";
      dugme._tazele = () => {
        const k = kalanSure();
        if (dugme.dataset.mesgul === "1") return;
        dugme.disabled = k > 0;
        dugme.textContent = k > 0 ? etiket + " (" + k + " sn)" : etiket;
      };
      dugme._tazele();
      if (kalanSure()) sayaciKur();
    }

    async function kodGonder(dugme) {
      if (kalanSure()) return;
      dugme.dataset.mesgul = "1";
      dugme.disabled = true;
      dugme.textContent = "Gönderiliyor…";
      try {
        /* İstek bir kez kaydedilir (30 dk geçerli); yeniden kod istemek onu yenilemez */
        if (!istekKaydedildi) {
          const r = await istemci.rpc("devralma_iste");
          if (r.error) throw r.error;
          istekKaydedildi = true;
          depo.yaz("pg.devralma", Date.now());
        }
        const c = await istemci.auth.signInWithOtp({ email: eposta, options: { shouldCreateUser: false } });
        if (c.error) throw c.error;
        sonKodGonderimi = Date.now();
        /* Uygulama yeniden yüklenirse giriş ekranı bu kodu beklesin */
        depo.yaz("pg.bekleyenKod", { eposta, zaman: sonKodGonderimi });
        /* İlk kodla açılan oturumun işi bitti; açık kalıp birikmesin. Hesabın
           öbür cihazlarına dokunulmaz: hangisinin çıkacağına sunucu karar verir. */
        if (ilkOturumAcik) {
          ilkOturumAcik = false;
          bilerekCikiliyor = true;
          try { await istemci.auth.signOut({ scope: "local" }); } catch (e) {}
          bilerekCikiliyor = false;
        }
        asama = "kod";
        ciz(null, eposta + " adresine yeni bir kod gönderildi.");
      } catch (e) {
        /* Supabase "N saniye sonra" diyorsa sayaç ona göre kurulur */
        const m = /after (\d+) seconds?/i.exec(String((e && e.message) || ""));
        if (m) sonKodGonderimi = Date.now() - (KOD_ARALIGI - Number(m[1])) * 1000;
        ciz(/yeniden giriş/i.test(String((e && e.message) || ""))
          ? "Bu ekran çok uzun açık kaldı. Vazgeç'e dokunup yeniden giriş yapın."
          : hataMesaji(e));
      }
    }

    function ciz(hata, bilgi) {
      kutu.innerHTML = "";
      const baslik = olustur("h2", "giris-baslik");
      baslik.textContent = cok ? "Cihaz sınırınız dolu" : "Hesabınız başka bir cihazda açık";
      const alt = olustur("p", "giris-alt");
      alt.textContent = asama === "soru"
        ? (cok
          ? "Hesabınız aynı anda en çok " + azami + " cihazda açık olabilir ve bu sınır dolu. En uzun süredir kullanmadığınız cihazdan çıkış yapmak için mailinize kod gelsin mi?"
          : "Hesap aynı anda yalnızca bir cihazda kullanılabilir. Diğer cihazınızdan çıkış yapmak için mailinize kod gelsin mi?")
        : "E-postanıza gelen yeni kodu yazın. Kod doğrulanınca " + (cok ? "en uzun süredir kullanmadığınız cihazdan" : "öbür cihazdan") +
          " çıkış yapılır ve hesap bu cihazda açılır.";
      kutu.append(baslik, alt);
      if (bilgi) { const b = olustur("p", "giris-bilgi"); b.textContent = bilgi; kutu.appendChild(b); }
      if (hata) { const h = olustur("p", "giris-hata"); h.setAttribute("role", "alert"); h.textContent = hata; kutu.appendChild(h); }

      if (asama === "soru") {
        const uyari = olustur("p", "giris-bilgi");
        uyari.textContent = (cok ? "Çıkarılacak cihazda" : "Öbür cihazda") + " henüz hesaba gönderilmemiş değişiklikler varsa kaybolur. Bunu siz yapmıyorsanız Vazgeç'e dokunun.";
        kutu.appendChild(uyari);
        const eylem = olustur("div", "eylem");
        const hayir = olustur("button");
        hayir.textContent = "Vazgeç";
        hayir.addEventListener("click", vazgec);
        const evet = olustur("button", "ana");
        evet.addEventListener("click", () => kodGonder(evet));
        sureliDugme(evet, "Kod gönder");
        eylem.append(hayir, evet);
        kutu.appendChild(eylem);
        return;
      }

      const etiket = olustur("label", "giris-etiket");
      etiket.textContent = "E-postadaki yeni kod";
      etiket.htmlFor = "devralmaKod";
      const girdi = olustur("input", "giris-girdi kod");
      girdi.id = "devralmaKod";
      girdi.inputMode = "numeric";
      girdi.autocomplete = "one-time-code";
      girdi.maxLength = 10;
      girdi.placeholder = "••••••";
      girdi.addEventListener("input", () => { girdi.value = girdi.value.replace(/\D/g, ""); });
      const eylem = olustur("div", "eylem");
      const dogrula = olustur("button", "ana");
      dogrula.textContent = "Öbür cihazdan çıkar ve gir";
      eylem.appendChild(dogrula);
      const yeniden = olustur("button", "giris-bag");
      yeniden.addEventListener("click", () => kodGonder(yeniden));
      sureliDugme(yeniden, "Yeni kod gönder");
      const hayir = olustur("button", "giris-bag");
      hayir.textContent = "Vazgeç";
      hayir.addEventListener("click", vazgec);
      kutu.append(etiket, girdi, eylem, yeniden, hayir);

      const dogrulaIsi = async () => {
        if (dogrula.disabled) return;   /* Enter ile ikinci kez gönderilmesin */
        const kod = girdi.value.trim();
        if (kod.length < 6) { ciz("Kod en az 6 haneli olmalı."); return; }
        dogrula.disabled = true; dogrula.textContent = "Doğrulanıyor…";
        try {
          /* Yeni kod yeni bir oturum açar; sunucu yalnızca istekten sonra
             açılmış oturumun devralmasına izin verir. */
          const c = await istemci.auth.verifyOtp({ email: eposta, token: kod, type: "email" });
          if (c.error) throw c.error;
          if (!c.data || !c.data.session) throw new Error("Oturum açılamadı");
          /* Çıkarılan cihaz notlara erişimini hemen kaybeder ve bir sonraki
             eşitlemesinde kendini kapatır. */
          await cihaziSahiplen();
          bitir(true);
        } catch (e) {
          ciz(/başka bir cihazda/i.test((e && e.message) || "")
            ? "Devralma isteğinin süresi dolmuş. Vazgeçip yeniden giriş yapın."
            : hataMesaji(e));
        }
      };
      dogrula.addEventListener("click", dogrulaIsi);
      girdi.addEventListener("keydown", e => { if (e.key === "Enter") dogrulaIsi(); });
      setTimeout(() => girdi.focus(), 50);
    }

    ciz();
  });
}

/* ==========================================================================
   Profil (okunan bölüm, sınıf) ve kullanım sözleşmesi
   Sözleşmenin geçerli sürümü onaylanmadan sunucu not göndermez; burada
   yalnızca ekranı gösteriyoruz, asıl denetim veritabanında.
   ========================================================================== */
function profilGecerli(p) {
  return !!(p && p.program && p.sozlesme_surumu === SOZLESME.surum);
}

async function profilGetir() {
  const r = await istemci.from("profiller").select("program,sinif,sozlesme_surumu").maybeSingle();
  if (r.error) throw r.error;
  return r.data;
}

async function programlariGetir() {
  const r = await istemci.from("programlar").select("id,ad,sinif_sayisi,sira").order("sira", { ascending: true });
  if (r.error) throw r.error;
  return r.data || [];
}

async function profiliCihazaYaz(p, programAdi) {
  const kayitli = { program: p.program, programAdi: programAdi || p.program, sinif: p.sinif, sozlesme_surumu: p.sozlesme_surumu };
  await vt.yaz("durum", { ad: "profil", deger: kayitli });
  KULLANICI.profil = kayitli;
}

/* Profil cihazda geçerliyse uygulama hemen açılır, sunucuyla arka planda
   karşılaştırılır. Değilse sunucuya sorulur; orada da yoksa ekran açılır. */
async function acilisiTamamla(yeniGiris) {
  const yerel = await vt.oku("durum", "profil");
  if (yerel && profilGecerli(yerel.deger)) {
    KULLANICI.profil = yerel.deger;
    uygulamayiAc();
    if (yeniGiris) esitle(); else oturumuDogrula();
    return;
  }
  profilEkraniAc();
}

function sozlesmeMaddeleri(hedef) {
  const liste = olustur("ol", "sozlesme-maddeleri");
  SOZLESME.maddeler.forEach(m => {
    const li = olustur("li");
    const parcalar = m.split("{TASHIH}");
    li.appendChild(document.createTextNode(parcalar[0]));
    if (parcalar.length > 1) {
      const bag = olustur("a");
      bag.href = "mailto:" + AYAR.TASHIH_EPOSTA;
      bag.textContent = AYAR.TASHIH_EPOSTA;
      li.append(bag, document.createTextNode(parcalar[1]));
    }
    liste.appendChild(li);
  });
  hedef.appendChild(liste);
}

function profilEkraniAc() {
  if (girisPerdesi) girisPerdesi.remove();
  const perde = olustur("div", "giris-perde");
  const kutu = olustur("div", "giris-kutu");
  perde.appendChild(kutu);
  document.body.appendChild(perde);
  girisPerdesi = perde;

  let programlar = null, mevcut = null, secilenProgram = null, onay = false;

  async function yukle() {
    ciz(null, true);
    try {
      [mevcut, programlar] = await Promise.all([profilGetir(), programlariGetir()]);
      if (!programlar.length) throw new Error("Program listesi boş");
      secilenProgram = (mevcut && programlar.some(p => p.id === mevcut.program)) ? mevcut.program
        : programlar.length === 1 ? programlar[0].id : null;
      if (profilGecerli(mevcut)) { await bitir(mevcut); return; }
      ciz();
    } catch (e) {
      ciz(navigator.onLine ? "Hesap bilgileri alınamadı: " + ((e && e.message) || "bilinmeyen hata")
        : "Sözleşmeyi onaylamak için internet bağlantısı gerekiyor.");
    }
  }

  async function bitir(p) {
    const program = programlar.find(x => x.id === p.program);
    await profiliCihazaYaz(p, program ? program.ad : p.program);
    girisEkraniniKapat();
    uygulamayiAc();
    esitle();
  }

  function ciz(hata, yukleniyor) {
    kutu.innerHTML = "";
    const baslik = olustur("h2", "giris-baslik");
    baslik.textContent = mevcut ? "Sözleşme güncellendi" : "Hesabınızı tamamlayın";
    kutu.appendChild(baslik);
    const alt = olustur("p", "giris-alt");
    alt.textContent = mevcut
      ? "Kullanım sözleşmesi değişti. Devam etmek için yeni metni okuyup onaylamanız gerekiyor."
      : "Notlara geçmeden önce okuduğunuz bölümü ve kullanım sözleşmesini onaylayın.";
    kutu.appendChild(alt);
    if (yukleniyor) {
      const y = olustur("div", "yukleniyor");
      y.innerHTML = '<span class="halka"></span>';
      kutu.appendChild(y);
      return;
    }
    if (hata) { const h = olustur("p", "giris-hata"); h.setAttribute("role", "alert"); h.textContent = hata; kutu.appendChild(h); }

    if (!programlar) {
      const eylem = olustur("div", "eylem");
      const tekrar = olustur("button", "ana");
      tekrar.textContent = "Yeniden dene";
      tekrar.addEventListener("click", yukle);
      eylem.appendChild(tekrar);
      kutu.appendChild(eylem);
      cikisBagi();
      return;
    }

    /* Tek program varken sorulmaz; ileride bölüm eklenince seçtirilir */
    if (programlar.length > 1 && !mevcut) {
      const etiket = olustur("div", "giris-etiket");
      etiket.textContent = "Okuduğunuz bölüm";
      kutu.appendChild(etiket);
      const liste = olustur("div", "kontrol");
      liste.style.marginBottom = "18px";
      programlar.forEach(p => {
        const d = olustur("button", "kontrol-oge" + (secilenProgram === p.id ? " tikli" : ""));
        d.innerHTML = '<span class="kutucuk">✓</span><span></span>';
        d.lastChild.textContent = p.ad;
        d.setAttribute("aria-pressed", secilenProgram === p.id ? "true" : "false");
        d.addEventListener("click", () => { secilenProgram = p.id; ciz(); });
        liste.appendChild(d);
      });
      kutu.appendChild(liste);
    }

    const sozlesme = olustur("div", "sozlesme");
    const sb = olustur("h3");
    sb.textContent = SOZLESME.baslik;
    sozlesme.appendChild(sb);
    sozlesmeMaddeleri(sozlesme);
    kutu.appendChild(sozlesme);

    const kabul = olustur("button", "kontrol-oge" + (onay ? " tikli" : ""));
    kabul.innerHTML = '<span class="kutucuk">✓</span><span>Okudum, kabul ediyorum</span>';
    kabul.setAttribute("role", "checkbox");
    kabul.setAttribute("aria-checked", onay ? "true" : "false");
    kabul.style.marginTop = "14px";
    kabul.addEventListener("click", () => { onay = !onay; ciz(); });
    kutu.appendChild(kabul);

    const eylem = olustur("div", "eylem");
    const devam = olustur("button", "ana");
    devam.textContent = "Kabul et ve devam et";
    devam.disabled = !onay || !secilenProgram;
    devam.addEventListener("click", async () => {
      devam.disabled = true; devam.textContent = "Kaydediliyor…";
      const satir = {
        kullanici: KULLANICI.id,
        program: mevcut ? mevcut.program : secilenProgram,
        sinif: mevcut ? mevcut.sinif : VARSAYILAN_SINIF,
        sozlesme_surumu: SOZLESME.surum
      };
      try {
        const r = await istemci.from("profiller").upsert(satir, { onConflict: "kullanici" }).select("program,sinif,sozlesme_surumu").single();
        if (r.error) throw r.error;
        await bitir(r.data);
      } catch (e) {
        ciz(!navigator.onLine ? "Kaydetmek için internet bağlantısı gerekiyor."
          : /sözleşme/i.test((e && e.message) || "") ? "Uygulamanın bu sürümü eski kalmış; sayfayı yenileyip yeniden deneyin."
          : "Kaydedilemedi: " + ((e && e.message) || "bilinmeyen hata"));
      }
    });
    eylem.appendChild(devam);
    kutu.appendChild(eylem);
    cikisBagi();
  }

  function cikisBagi() {
    const cik = olustur("button", "giris-bag");
    cik.textContent = "Vazgeç ve çıkış yap";
    cik.addEventListener("click", async () => {
      cik.disabled = true;
      if (await yeriBirakVeyaSor()) cikisYap(); else cik.disabled = false;
    });
    kutu.appendChild(cik);
  }

  yukle();
}

/* Açılışta: cihazda bilinen hesap varsa uygulama hemen açılır (bağlantısız da
   çalışsın diye), oturum ve sözleşme onayı arka planda doğrulanır. */
async function oturumuDogrula() {
  if (!istemci) return;
  let sonuc;
  try { sonuc = await istemci.auth.getSession(); }
  catch (e) { esitlemeHatasi = "Bağlantı yok"; hesapIsaretiniTazele(); return; }
  const { data, error } = sonuc;
  if (data && data.session) {
    if (data.session.user.id !== KULLANICI.id) { await cikisYap("Hesap değişti; yeniden giriş yapın."); return; }
    /* Sözleşme sunucuda güncellendiyse yeniden onay istenir */
    try {
      const p = await profilGetir();
      if (!profilGecerli(p)) { uygulamayiKapat(); profilEkraniAc(); return; }
    } catch (e) { /* bağlantı sorunu: cihazdaki onayla devam */ }
    esitle();
    return;
  }
  /* Ağ hatası: oturum düşmedi, yalnızca şu an doğrulanamıyor */
  if (error && (error.name === "AuthRetryableFetchError" || !navigator.onLine || error.status === 0)) {
    esitlemeHatasi = "Bağlantı yok"; hesapIsaretiniTazele(); return;
  }
  await cikisYap("Oturumunuz sona erdi. Okul adresinizle yeniden giriş yapın.");
}

/* ==========================================================================
   Uygulama içi geri: geçmiş yığını
   Telefonun geri tuşu uygulamadan atmasın diye her derinleşmede tarayıcı
   geçmişine bir adım eklenir; geri basıldığında o adımın geri işlevi çalışır.
   ========================================================================== */
const geriYigini = [];

function derinlesGit(geriIslevi) {
  geriYigini.push({ islev: geriIslevi, sekme: aktifSekme });
  try { history.pushState({ pg: geriYigini.length }, ""); } catch (e) {}
}

/* Uygulama içindeki geri düğmeleri de bunu kullanır; böylece ekran ile
   tarayıcı geçmişi birbirinden kopmaz. */
function geriDon() {
  if (geriYigini.length) history.back();
}

/* Etkin sekmeye tekrar dokunulduğunda o sekmede açılmış alt ekranlar
   geçmişten de geri sarılır; yoksa sonraki geri basışları hiçbir şey
   yapmamış gibi görünür. */
function sekmeKokuneDon() {
  let i = geriYigini.length;
  while (i > 0 && geriYigini[i - 1].sekme === aktifSekme) i--;
  const adim = geriYigini.length - i;
  if (adim > 0) { history.go(-adim); return true; }
  return false;
}

/* Geçmiş adımının derinlik damgasına bakılır; böylece birden fazla adım
   birden geri gidilse de yığın ekranla aynı hizada kalır. */
window.addEventListener("popstate", olay => {
  const hedef = (olay.state && olay.state.pg) || 0;
  let girdi = null;
  while (geriYigini.length > hedef) girdi = geriYigini.pop();
  if (girdi) girdi.islev();
  /* Yığın boşsa tarayıcı kendi işini yapar: uygulamadan çıkar. */
});

const BOYUTLAR = [15, 16.5, 18.5, 20.5];
function boyutUygula(kademe) {

boyutUygula(yaziKademesi);
function boyutDegistir(yon) {
  const yeni = Math.min(BOYUTLAR.length - 1, Math.max(0, yaziKademesi + yon));
  if (yeni === yaziKademesi) return;
  yaziKademesi = yeni;
  depo.yaz("pg.boyut", yaziKademesi);
  boyutUygula(yaziKademesi);
}

/* ==========================================================================
   Aranan ifadeyi konu metninde vurgulama
   ========================================================================== */
function vurgula(kok, sorgu) {
  const q = kucult((sorgu || "").trim());
  if (q.length < 2) return null;
  const yurutec = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, null);
  const dugumler = [];
  while (yurutec.nextNode()) dugumler.push(yurutec.currentNode);
  dugumler.forEach(dugum => {
    const metin = dugum.nodeValue;
    const kucuk = kucult(metin);
    let yer = kucuk.indexOf(q);
    if (yer === -1) return;
    const parca = document.createDocumentFragment();
    let son = 0;
    while (yer !== -1) {
      if (yer > son) parca.appendChild(document.createTextNode(metin.slice(son, yer)));
      const isaret = document.createElement("mark");
      isaret.textContent = metin.slice(yer, yer + q.length);
      parca.appendChild(isaret);
      son = yer + q.length;
      yer = kucuk.indexOf(q, son);
    }
    if (son < metin.length) parca.appendChild(document.createTextNode(metin.slice(son)));
    dugum.parentNode.replaceChild(parca, dugum);
  });
  return kok.querySelector("mark");
}

/* ==========================================================================
   Yıldızlanan kelimeler — hesapta tutulur, Ara sekmesinde toplanır
   ========================================================================== */
function yildizlar() {
  return kayitlarTuru("yildiz")
    .sort((a, b) => zamanMs(a.guncellendi) - zamanMs(b.guncellendi))
    .map(r => (r.deger && r.deger.metin) || r.anahtar);
}
function yildizliMi(kelime) {

}
/* Yıldız bir kelime ya da kısa ifade içindir; hesaptaki anahtar sınırı
   (300) aşılırsa o kayıt hiç gönderilemezdi */
const YILDIZ_AZAMI = 80;
function yildizDegistir(kelime) {
  const temiz = (kelime || "").trim();
  if (!temiz || temiz.length > YILDIZ_AZAMI) return false;
  const anahtar = kucult(temiz);
  if (kayit("yildiz", anahtar) !== undefined) { kayitSil("yildiz", anahtar); return false; }
  kayitYaz("yildiz", anahtar, { metin: temiz });

}

/* Kavram araması: hem Ara sekmesi hem seçim paneli bunu kullanır */
function kavramAra(sorgu) {
  const kucuk = kucult((sorgu || "").trim());
  if (!kucuk) return [];
  return ARAMA_INDEKSI.filter(k => k.tur === "kavram" &&
    (kucult(k.terim).indexOf(kucuk) !== -1 || kucult(k.izah).indexOf(kucuk) !== -1));
}

/* Tam metin arama: kavram listesinde olmayan ifadeler de bulunabilsin */
function metindeAra(sorgu) {
  const q = kucult((sorgu || "").trim());
  if (q.length < 3) return [];
  const sonuclar = [];
  KONULAR.forEach(konu => {
    const metin = konu.duz;
    const kucuk = kucult(metin);
    let yer = kucuk.indexOf(q);
    if (yer === -1) return;
    let adet = 0, gezen = yer;
    while (gezen !== -1) { adet++; gezen = kucuk.indexOf(q, gezen + q.length); }
    const bas = Math.max(0, yer - 55);
    const bit = Math.min(metin.length, yer + q.length + 85);
    const kesit = metin.slice(bas, bit).replace(/\s+/g, " ").trim();
    const k = Math.max(0, kucult(kesit).indexOf(q));
    sonuclar.push({
      konu, adet,
      once: (bas > 0 ? "… " : "") + kesit.slice(0, k),
      eslesen: kesit.substr(k, q.length),
      sonra: kesit.slice(k + q.length) + (bit < metin.length ? " …" : "")
    });
  });
  return sonuclar.sort((a, b) => b.adet - a.adet);
}

    ok.textContent = "›";
    giris.append(ad, sayi, ok);
    giris.addEventListener("click", () => muhimlerCiz(okuKokuCiz));
    sayfa.appendChild(giris);
  }

  AGAC.gruplar.forEach(g => {
    const grup = olustur("section", "grup");
    const b = olustur("h2", "grup-baslik");
    b.textContent = g.ad;
    if (g.hususi) b.appendChild(hususiEtiketi());
    grup.appendChild(b);
    const dersSatirlari = liste => (liste || []).forEach(d => grup.appendChild(dersSatiri(d.id)));
    if (Array.isArray(g.donemler)) {
      g.donemler.forEach(dn => {
        const db = olustur("div", "donem-baslik");
        db.textContent = dn.ad;
        grup.appendChild(db);
        if (!dn.dersler || !dn.dersler.length) {
          const bos = olustur("div", "ders-satiri bos");
          bos.innerHTML = '<span class="ad">Bu dönemin dersleri henüz eklenmedi</span>';
          grup.appendChild(bos);
        }
        dersSatirlari(dn.dersler);
      });
    } else dersSatirlari(g.dersler);
    sayfa.appendChild(grup);
  });
}

/* ---------- Mühimmat: bütün derslerdeki mühim konu ve başlıklar ---------- */
function muhimOzeti() {
  let konu = 0, baslik = 0;
  KONULAR.forEach(k => { const d = konuMuhimDurumu(k); if (d.mi) { konu++; baslik += d.basliklar.size; } });
  return { konu, baslik };
}

function muhimlerCiz(geriIslev) {
  if (geriIslev) derinlesGit(geriIslev);
  okuAcik = { tur: "muhim" };
  const sayfa = $("#sayfaOku");
  sayfa.innerHTML = "";
  const geri = olustur("button", "geri");
  geri.textContent = "‹ Dersler";
  geri.addEventListener("click", () => {
    if (geriYigini.length && geriYigini[geriYigini.length - 1].sekme === "oku") geriDon(); else okuKokuCiz();
  });
  sayfa.appendChild(geri);
  const baslik = olustur("h2", "ders-basligi");
  baslik.textContent = "Mühimmat";
  const yol = olustur("div", "ders-yolu");
  yol.textContent = "İşaretlediğiniz ve boyadığınız yerler";
  sayfa.append(baslik, yol);

  let adet = 0;
  DERSLER.forEach((ders, dersId) => {
    const satirlar = [];
    (DERS_KONULARI.get(dersId) || []).forEach(konu => {
      const d = konuMuhimDurumu(konu);
      if (d.mi) satirlar.push({ konu, d });
    });
    if (!satirlar.length) return;
    const db = olustur("div", "donem-baslik");
    db.textContent = ders.ad;
    sayfa.appendChild(db);
    satirlar.forEach(({ konu, d }) => {
      adet++;
      const k = olustur("button", "muhim-konu");
        /* Konunun tamamı elle işaretliyse ya da konuda boya varsa işaret konu satırında da durur */
      k.appendChild(olustur("span", d.elle || d.boyali ? "muhim-imi" : "bos-imi"));
      const ad = olustur("span");
      ad.textContent = konuEtiketi(konu);
      k.appendChild(ad);
      k.addEventListener("click", () => konuAc(konu.id, () => muhimlerCiz(null)));
      sayfa.appendChild(k);
      d.basliklar.forEach((b, metin) => {
        const s = olustur("button", "muhim-baslik" + (b.seviye === 4 ? " alt" : ""));
        s.appendChild(olustur("span", "muhim-imi"));
        const t = olustur("span");
        t.textContent = baslikYazisi(metin);
        s.appendChild(t);
        s.addEventListener("click", () => konuAc(konu.id, () => muhimlerCiz(null), null, 0, metin));
        sayfa.appendChild(s);

    });

  if (!adet) {
    const bos = olustur("p", "bos");
    bos.textContent = "Henüz mühim işaretli yer yok. Okurken konu adının ya da bir alt başlığın yanındaki ayraç işaretine dokunun; " +
      "metinde bir yeri boyadığınızda da o başlık kendiliğinden buraya gelir.";
    sayfa.appendChild(bos);
  } else {
    const ipucu = olustur("p", "bos");
    ipucu.style.marginTop = "18px";
    ipucu.textContent = "Temrin ve 42 Tarzı'nda \u201cYalnızca mühim yerler\u201d seçilirse sorular ve kartlar yalnızca buradaki yerlerden gelir.";
    sayfa.appendChild(ipucu);
  }
  window.scrollTo(0, 0);
}

    agac.appendChild(d);
    /* Mühim başlıklar konunun altında: dokununca doğrudan o başlık açılır */
    muhim.basliklar.forEach((b, metin) => {
