/* ---------- Konu konu çalış ---------- */
function konuSecimiCiz() {
  const sayfa = $("#sayfaCalis");
  sayfa.innerHTML = "";
  const geri = olustur("button", "geri");
  geri.textContent = "‹ Temrin yolları";
  geri.addEventListener("click", geriDon);
  sayfa.appendChild(geri);

  const secili = seciliKonular();
  const liste = olustur("div", "mod-liste");
  liste.style.marginTop = "14px";
  DERS_KONULARI.forEach(konular => konular.forEach(konu => {
    if (!secili.has(konu.id)) return;
    const sorular = konu.sorular.filter(s => muhimSuzgecindenGecer(konu, s.yer));
    if (!sorular.length) return;
    const d = olustur("button", "mod-kart");
    d.innerHTML = '<span class="ad">' + kacir(konuEtiketi(konu)) + '</span><span class="izah">' +
      kacir(dersAdi(konu.ders)) + '</span><span class="sayi">' + sorular.length + " soru</span>";
    d.addEventListener("click", () => {
      derinlesGit(konuSecimiCiz);
      oturumBaslat(karistir(sorular.map(s => SORU_HARITASI.get(s.id))), konuEtiketi(konu));
    });
    liste.appendChild(d);
  }));
  sayfa.appendChild(liste);
}

/* ---------- Soru oturumu ---------- */
let oturum = null;

function oturumBaslat(sorular, baslik) {
  oturum = { sorular, i: 0, dogru: 0, yanlislar: [], cevaplanan: [], baslik };
  soruCiz();
}

function ilerlemeCiz(hedef) {
  const s = olustur("div", "ilerleme");
  const oran = Math.round((oturum.i / oturum.sorular.length) * 100);
  s.innerHTML = "<span>" + kacir(oturum.baslik) + "</span>" +
    '<span class="cubuk"><span class="dolu" style="width:' + oran + '%"></span></span>' +
    "<span>" + (oturum.i + 1) + "/" + oturum.sorular.length + "</span>";
  hedef.appendChild(s);
}

/* Soruyu konusunda, varsa ilgili başlıkta açar; geri gelince soru yerinde durur */
function konudaOkuDugmesi(soru, sinif) {
  const n = olustur("button", sinif || "nereden");
  n.textContent = konuYeri(soru.konu) + (soru.yer ? " › " + soru.yer : "") + " ›";
  n.addEventListener("click", () => {
    const o = oturum;
    sekmeAc("oku", false);
    /* Temrin sayfası sekme değişince silinmez; soru cevaplanmış hâliyle
       durur. Yalnızca oturum başka bir şeyle değiştiyse yeniden çizilir. */
    konuAc(soru.konu.id, () => {
      sekmeAc("calis", false);
      if (o && (oturum !== o || !$("#sayfaCalis").childElementCount)) { oturum = o; soruCiz(); }
    }, null, 0, soru.yer || null);
  });
  return n;
}

function izahKutusu(soru) {
  const k = olustur("div", "izah");
  if (soru.izah) { const p = olustur("span"); p.innerHTML = satiriCiz(soru.izah, soru.konu.ders); k.appendChild(p); }
  k.appendChild(konudaOkuDugmesi(soru));
  return k;
}

function sonrakiDugmesi(hedef, etiket) {
  const alan = olustur("div", "eylem");
  const d = olustur("button", "ana");
  d.textContent = etiket || (oturum.i === oturum.sorular.length - 1 ? "Sonucu gör" : "Sonraki soru");
  d.addEventListener("click", () => { oturum.i++; soruCiz(); });
  alan.appendChild(d);
  hedef.appendChild(alan);
  try { d.focus({ preventScroll: true }); } catch (e) { d.focus(); }
}

function soruCiz() {
  const sayfa = $("#sayfaCalis");
  sayfa.innerHTML = "";
  if (oturum.i >= oturum.sorular.length) { sonucCiz(); return; }
  ilerlemeCiz(sayfa);
  const soru = oturum.sorular[oturum.i];
  const ciziciler = { secme: secmeCiz, izleme: secmeCiz, dy: dyCiz, bosluk: boslukCiz, dizme: dizmeCiz, esles: eslesCiz, hesap: hesapCiz, klasik: klasikCiz };
  (ciziciler[soru.tip] || secmeCiz)(sayfa, soru);
  window.scrollTo(0, 0);
}

/* Her sorunun üst kısmı: etiket, soru metni, varsa kod */
function soruKutusu(soru, metin) {
  const kutu = olustur("div", "soru");
  const etiket = olustur("span", "etiket");
  etiket.textContent = dersAdi(soru.konu.ders, true) + " · " + TUR_ADLARI[soru.tip];
  const p = olustur("p", "metin");
  p.innerHTML = satiriCiz(metin, soru.konu.ders);
  kutu.append(etiket, p);
  if (soru.kod) {
    const pre = olustur("pre", "soru-kod");
    const code = olustur("code");
    code.textContent = soru.kod;
    pre.appendChild(code);
    kutu.appendChild(pre);
  }
  return kutu;
}

function secmeCiz(sayfa, soru) {
  const kutu = soruKutusu(soru, soru.soru);
  const secenekler = olustur("div", "secenekler");
  const harfler = ["A", "B", "C", "D", "E", "F"];
  const dugmeler = [];
  /* Seçenekler her çizimde karıştırılır: doğru cevabın hep aynı şıkta olması
     "içeriği bilmeden şıkkı ezberleme" alışkanlığı doğurur. */
  const sira = karistir(soru.secenekler.map((_, n) => n));
  const dogruYer = sira.indexOf(soru.dogru);
  sira.forEach((asil, i) => {
    const d = olustur("button", "secenek");
    d.innerHTML = '<span class="harf">' + harfler[i] + "</span><span></span>";
    d.lastChild.innerHTML = satiriCiz(soru.secenekler[asil], soru.konu.ders);
    d.addEventListener("click", () => {
      if (d.disabled) return;
      dugmeler.forEach(x => { x.disabled = true; });
      dugmeler[dogruYer].classList.add("dogru");
      if (i !== dogruYer) d.classList.add("yanlis");
      sonucIsle(soru, i === dogruYer);
      kutu.appendChild(izahKutusu(soru));
      sonrakiDugmesi(sayfa);
    });
    dugmeler.push(d);
    secenekler.appendChild(d);
  });
  kutu.appendChild(secenekler);
  sayfa.appendChild(kutu);
}

function dyCiz(sayfa, soru) {
  const kutu = soruKutusu(soru, soru.ifade);
  const alan = olustur("div", "dy-dugmeler");
  const dogruD = olustur("button", "secenek");
  dogruD.textContent = "Doğru";
  const yanlisD = olustur("button", "secenek");
  yanlisD.textContent = "Yanlış";
  const sec = cevap => {
    if (dogruD.disabled) return;
    dogruD.disabled = yanlisD.disabled = true;
    const bilen = cevap === soru.dogru;
    (soru.dogru ? dogruD : yanlisD).classList.add("dogru");
    if (!bilen) (cevap ? dogruD : yanlisD).classList.add("yanlis");
    sonucIsle(soru, bilen);
    kutu.appendChild(izahKutusu(soru));
    sonrakiDugmesi(sayfa);
  };
  dogruD.addEventListener("click", () => sec(true));
  yanlisD.addEventListener("click", () => sec(false));
  alan.append(dogruD, yanlisD);
  kutu.appendChild(alan);
  sayfa.appendChild(kutu);
}

function boslukCiz(sayfa, soru) {
  const kutu = olustur("div", "soru");
  const etiket = olustur("span", "etiket");
  etiket.textContent = dersAdi(soru.konu.ders, true) + " · " + TUR_ADLARI.bosluk;
  const metin = olustur("p", "bosluk-metin");
  /* Metin bütün hâlinde çizilir, boşluklar sonra kutuya çevrilir; böylece
     `usermod ___ -aG sudo` gibi kod içindeki boşluk da kod biçiminde kalır. */
  metin.innerHTML = satiriCiz(soru.metin.split("___").join(""), soru.konu.ders)
    .replace(//g, '<input class="bosluk-girdi">');
  const girdiler = Array.from(metin.querySelectorAll("input.bosluk-girdi"));
  girdiler.forEach((g, i) => {
    g.type = "text";
    g.autocomplete = "off";
    g.autocapitalize = "off";
    g.spellcheck = false;
    g.setAttribute("aria-label", (i + 1) + ". boşluk");
  });
  kutu.append(etiket, metin);
  sayfa.appendChild(kutu);

  const eylem = olustur("div", "eylem");
  const kontrol = olustur("button", "ana");
  kontrol.textContent = "Kontrol et";
  const kontrolEt = () => {
    let hepsi = true;
    girdiler.forEach((g, i) => {
      const kabul = soru.cevaplar[i].map(cevapNormal);
      const dogru = kabul.indexOf(cevapNormal(g.value)) !== -1;
      g.classList.add(dogru ? "dogru" : "yanlis");
      g.readOnly = true;
      if (!dogru) hepsi = false;
    });
    sonucIsle(soru, hepsi);
    if (!hepsi) {
      const d = olustur("div", "izah");
      d.innerHTML = "<strong>Doğrusu:</strong> ";
      d.appendChild(document.createTextNode(soru.cevaplar.map(c => c[0]).join(" · ")));
      kutu.appendChild(d);
    }
    kutu.appendChild(izahKutusu(soru));
    eylem.remove();
    sonrakiDugmesi(sayfa);
  };
  kontrol.addEventListener("click", kontrolEt);
  /* preventDefault: aynı Enter, odağın geçtiği "Sonraki soru" düğmesine
     tıklama olarak ulaşıp sonucu göstermeden soruyu atlamasın */
  girdiler.forEach((g, i) => g.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (i < girdiler.length - 1) girdiler[i + 1].focus(); else if (eylem.isConnected) kontrolEt();
  }));
  eylem.appendChild(kontrol);
  sayfa.appendChild(eylem);
  if (girdiler[0]) setTimeout(() => { try { girdiler[0].focus({ preventScroll: true }); } catch (e) {} }, 60);
}

function dizmeCiz(sayfa, soru) {
  const kutu = soruKutusu(soru, soru.soru);
  kutu.querySelector(".etiket").textContent = dersAdi(soru.konu.ders, true) + " · " + (soru.komut ? "Komut dizme" : TUR_ADLARI.dizme);

  const alan = olustur("div", "dizi-alan bos-alan");
  alan.dataset.ipucu = soru.komut ? "Parçalara dokunarak komutu buraya dizin" : "Parçaları sırayla buraya dizin";
  const havuz = olustur("div", "havuz");
  const secilen = [];
  const bitti = () => alan.classList.contains("dogru-alan") || alan.classList.contains("yanlis-alan");

  function tazele() {
    alan.classList.toggle("bos-alan", secilen.length === 0);
  }
  /* Aynı metinli iki parça olabilir; sıra karşılaştırması metinle yapıldığı
     için hangisinin seçildiği önemli değil. */
  /* Karışık hâl doğru sıranın kendisi olmasın (bütün parçalar aynı değilse) */
  let karisik = karistir(soru.parcalar);
  const hepsiAyni = soru.parcalar.every(p => p === soru.parcalar[0]);
  for (let deneme = 0; !hepsiAyni && deneme < 20 && karisik.every((p, i) => p === soru.parcalar[i]); deneme++) {
    karisik = karistir(soru.parcalar);
  }
  karisik.forEach(parca => {
    const d = olustur("button", "parca");
    d.innerHTML = satiriCiz(parca, soru.konu.ders);
    d.addEventListener("click", () => {
      if (bitti()) return;
      d.style.display = "none";
      const s = olustur("button", "parca");
      s.innerHTML = d.innerHTML;
      s.addEventListener("click", () => {
        if (bitti()) return;
        s.remove();
        d.style.display = "";
        secilen.splice(secilen.indexOf(parca), 1);
        tazele();
      });
      alan.appendChild(s);
      secilen.push(parca);
      tazele();
    });
    havuz.appendChild(d);
  });
  kutu.append(alan, havuz);
  sayfa.appendChild(kutu);

  const eylem = olustur("div", "eylem");
  const kontrol = olustur("button", "ana");
  kontrol.textContent = "Kontrol et";
  kontrol.addEventListener("click", () => {
    const dogruMu = secilen.length === soru.parcalar.length &&
      secilen.every((p, i) => p === soru.parcalar[i]);
    alan.classList.add(dogruMu ? "dogru-alan" : "yanlis-alan");
    sonucIsle(soru, dogruMu);
    if (!dogruMu) {
      const d = olustur("div", "izah");
      d.innerHTML = "<strong>Doğrusu:</strong> ";
      const kod = olustur("code");
      kod.textContent = soru.parcalar.join(soru.komut ? " " : " → ");
      d.appendChild(kod);
      kutu.appendChild(d);
    }
    kutu.appendChild(izahKutusu(soru));
    eylem.remove();
    sonrakiDugmesi(sayfa);
  });
  eylem.appendChild(kontrol);
  sayfa.appendChild(eylem);
}

function eslesCiz(sayfa, soru) {
  const kutu = soruKutusu(soru, soru.soru);
  const izgara = olustur("div", "esles");
  const solSutun = olustur("div", "esles-sutun");
  const sagSutun = olustur("div", "esles-sutun");
  let secili = null, kalan = soru.ciftler.length, hataVar = false;

  karistir(soru.ciftler.map((c, i) => [c[0], i])).forEach(([sol, i]) => {
    const d = olustur("button", "esles-oge");
    d.innerHTML = satiriCiz(sol, soru.konu.ders);
    d.dataset.cift = String(i);
    d.addEventListener("click", () => {
      if (d.classList.contains("tamam")) return;
      if (secili) secili.classList.remove("secili");
      secili = d; d.classList.add("secili");
    });
    solSutun.appendChild(d);
  });
  karistir(soru.ciftler.map((c, i) => [c[1], i])).forEach(([sag, i]) => {
    const d = olustur("button", "esles-oge sag");
    d.innerHTML = satiriCiz(sag, soru.konu.ders);
    d.dataset.cift = String(i);
    d.addEventListener("click", () => {
      if (!secili || d.classList.contains("tamam")) return;
      if (d.dataset.cift === secili.dataset.cift) {
        d.classList.add("tamam"); secili.classList.remove("secili"); secili.classList.add("tamam");
        secili = null; kalan--;
        if (kalan === 0) bitir();
      } else {
        hataVar = true;
        d.classList.add("hata");
        setTimeout(() => d.classList.remove("hata"), 450);
      }
    });
    sagSutun.appendChild(d);
  });

  function bitir() {
    sonucIsle(soru, !hataVar);
    kutu.appendChild(izahKutusu(soru));
    sonrakiDugmesi(sayfa);
  }

  izgara.append(solSutun, sagSutun);
  kutu.appendChild(izgara);
  sayfa.appendChild(kutu);
}

/* Virgül de ondalık ayırıcı sayılır; binlik ayırıcı kabul edilmez */
function sayiOku(s) {
  const t = String(s).trim().replace(/\s+/g, "").replace(",", ".");
  if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

function hesapCiz(sayfa, soru) {
  const kutu = soruKutusu(soru, soru.soru);
  const satir = olustur("div", "hesap-satir");
  const girdi = olustur("input");
  girdi.type = "text";
  girdi.inputMode = "decimal";
  girdi.autocomplete = "off";
  girdi.placeholder = "Sonuç";
  girdi.setAttribute("aria-label", "Sonuç");
  satir.appendChild(girdi);
  if (soru.birim) { const b = olustur("span", "birim"); b.textContent = soru.birim; satir.appendChild(b); }
  kutu.appendChild(satir);
  const uyari = olustur("p", "kart-ipucu uyari");
  uyari.style.textAlign = "left";
  kutu.appendChild(uyari);
  sayfa.appendChild(kutu);

  const eylem = olustur("div", "eylem");
  const kontrol = olustur("button", "ana");
  kontrol.textContent = "Kontrol et";
  const kontrolEt = () => {
    /* "1.024" hem bin yirmi dört hem bir virgül sıfır yirmi dört okunabilir;
       sessizce yanlış okumak yerine sorulur */
    if (/^[-+]?[1-9]\d{0,2}(\.\d{3})+$/.test(girdi.value.trim())) {
      uyari.textContent = "Binlik ayırıcı kullanmayın (1.000 yerine 1000 yazın); ondalık için virgül kullanın.";
      return;
    }
    const n = sayiOku(girdi.value);
    if (n === null) { uyari.textContent = "Bir sayı yazın (ondalık için virgül ya da nokta)."; return; }
    uyari.textContent = "";
    const pay = typeof soru.tolerans === "number" ? soru.tolerans : 0;
    const dogruMu = Math.abs(n - soru.cevap) <= pay + 1e-9 * Math.max(1, Math.abs(soru.cevap));
    girdi.classList.add(dogruMu ? "dogru" : "yanlis");
    girdi.readOnly = true;
    sonucIsle(soru, dogruMu);
    if (!dogruMu) {
      const d = olustur("div", "izah");
      d.innerHTML = "<strong>Doğrusu:</strong> ";
      d.appendChild(document.createTextNode(String(soru.cevap).replace(".", ",") + (soru.birim ? " " + soru.birim : "") +
        (pay ? " (± " + String(pay).replace(".", ",") + " kabul)" : "")));
      kutu.appendChild(d);
    }
    kutu.appendChild(izahKutusu(soru));
    eylem.remove();
    sonrakiDugmesi(sayfa);
  };
  kontrol.addEventListener("click", kontrolEt);
  girdi.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (eylem.isConnected) kontrolEt();
  });
  eylem.appendChild(kontrol);
  sayfa.appendChild(eylem);
  setTimeout(() => { try { girdi.focus({ preventScroll: true }); } catch (e) {} }, 60);
}

function klasikCiz(sayfa, soru) {
  const kutu = soruKutusu(soru, soru.soru);
  const yazi = olustur("textarea", "klasik-girdi");
  yazi.placeholder = "Cevabınızı buraya yazın (isteğe bağlı), sonra örnek cevapla karşılaştırın";
  yazi.setAttribute("aria-label", "Cevabınız");
  kutu.appendChild(yazi);
  sayfa.appendChild(kutu);

  const eylem = olustur("div", "eylem");
  const goster = olustur("button", "ana");
  goster.textContent = "Örnek cevabı göster";
  goster.addEventListener("click", () => {
    eylem.remove();
    yazi.readOnly = true;
    const ornek = olustur("div", "ornek-cevap");
    ornek.innerHTML = markdownCiz(soru.cevap, soru.konu.ders);
    kutu.appendChild(ornek);
    if (Array.isArray(soru.anahtarlar) && soru.anahtarlar.length) {
      const yazilan = cevapNormal(yazi.value);
      const satir = olustur("div", "anahtarlar");
      soru.anahtarlar.forEach(a => {
        const c = olustur("span", "anahtar" + (yazilan && yazilan.indexOf(cevapNormal(a)) !== -1 ? " var" : ""));
        c.textContent = a;
        satir.appendChild(c);
      });
      const b = olustur("div", "kart-ipucu");
      b.style.textAlign = "left";
      b.textContent = yazilan ? "Cevabınızda geçen anahtar kavramlar yeşil:" : "Cevapta bulunması beklenen anahtar kavramlar:";
      kutu.append(b, satir);
    }
    const puan = olustur("div", "oz-puan");
    const sec = (etiket, sinif, dogruMu) => {
      const d = olustur("button", sinif);
      d.textContent = etiket;
      d.addEventListener("click", () => {
        puan.querySelectorAll("button").forEach(x => { x.disabled = true; });
        d.style.background = "var(--vurgu-zemin)";
        sonucIsle(soru, dogruMu);
        kutu.appendChild(izahKutusu(soru));
        sonrakiDugmesi(sayfa);
      });
      puan.appendChild(d);
    };
    sec("Bildim", "bildim", true);
    sec("Kısmen", "", false);
    sec("Bilemedim", "bilemedim", false);
    kutu.appendChild(puan);
  });
  eylem.appendChild(goster);
  sayfa.appendChild(eylem);
}

function sonucCiz() {
  const sayfa = $("#sayfaCalis");
  sayfa.innerHTML = "";
  const toplam = oturum.sorular.length;
  const bitis = olustur("div", "bitis");
  const puan = olustur("div", "puan");
  puan.textContent = oturum.dogru + "/" + toplam;
  const alt = olustur("div", "alt");
  const oran = toplam ? oturum.dogru / toplam : 0;
  alt.textContent = oran === 1 ? "Tamamı doğru. Bu konular sınava hazır."
    : oran >= 0.7 ? "İyi. Yanlışları bir kez daha okuyun, sonra tekrar deneyin."
    : "Bu konuları okuma alanından bir kez daha geçin, sonra tekrar deneyin.";
  bitis.append(puan, alt);

  if (oturum.yanlislar.length) {
    const kutu = olustur("div", "yanlislar");
    const b = olustur("h4");
    b.textContent = "Takıldığınız sorular";
    kutu.appendChild(b);
    oturum.yanlislar.forEach(s => {
      const k = olustur("div", "sonuc-kart");
      const p = olustur("p");
      p.innerHTML = satiriCiz(s.soru || s.ifade || s.metin, s.konu.ders);
      const git = olustur("button", "nereden");
      git.textContent = konuYeri(s.konu) + " ›";
      git.addEventListener("click", () => {
        const o = oturum;
        sekmeAc("oku", false);
        konuAc(s.konu.id, () => { sekmeAc("calis", false); oturum = o; sonucCiz(); }, null, 0, s.yer || null);
      });
      k.append(p, git);
      kutu.appendChild(k);
    });
    bitis.appendChild(kutu);
  }
  sayfa.appendChild(bitis);

  const eylem = olustur("div", "eylem");
  const tekrar = olustur("button", "ana");
  tekrar.textContent = "Baştan çöz";
  tekrar.addEventListener("click", () => oturumBaslat(karistir(oturum.sorular), oturum.baslik));
  const cik = olustur("button");
  cik.textContent = "Temrin yolları";
  cik.addEventListener("click", geriDon);
  eylem.append(tekrar, cik);
  sayfa.appendChild(eylem);
}

/* ==========================================================================
   4) 42 TARZI — sözlü soru-cevap kartları
   ========================================================================== */
function kartDersi() { return depo.oku("pg.kartDers", "tumu"); }
function sadeceBilemediklerim() { return depo.oku("pg.kartBilemedik", false) === true; }
function bilemedimMi(kartId) { const d = kayit("kart", kartId); return !!(d && d.s === "bilemedim"); }
function kartMuhimSuzgeci() { return depo.oku("pg.kartMuhim", false) === true; }
/* Ders seçiliyken konu seçimi: { dersId: [konuId, ...] }; boş ya da yok = bütün konular */
function kartKonulari(dersId) {
  const k = depo.oku("pg.kartKonular", {});
  const liste = k && typeof k === "object" && Array.isArray(k[dersId]) ? k[dersId] : [];
  return liste.filter(id => KONULAR.has(id));
}
function kartKonulariniYaz(dersId, liste) {
  const k = depo.oku("pg.kartKonular", {});
  const yeni = k && typeof k === "object" && !Array.isArray(k) ? k : {};
  if (liste.length) yeni[dersId] = liste; else delete yeni[dersId];
  depo.yaz("pg.kartKonular", yeni);
}

function kartSayfasiCiz() {
  const sayfa = $("#sayfaKart");
  sayfa.innerHTML = "";
  const kartliDersler = Array.from(DERSLER.keys()).filter(id => TUM_KARTLAR.some(k => k.konu.ders === id));
  if (!kartliDersler.length) {
    const bos = olustur("p", "bos");
    bos.textContent = AGAC ? "Henüz kart yok. Notlar eklendikçe her konunun sözlü sınav tarzı soruları burada kart olur."
      : "Notlar indirilince kartlar burada açılacak.";
    sayfa.appendChild(bos);
    return;
  }
  let secili = kartDersi();
  if (secili !== "tumu" && kartliDersler.indexOf(secili) === -1) secili = "tumu";

  const ciplar = olustur("div", "cip-satiri");
  const cip = (id, ad) => {
    const d = olustur("button", "cip" + (secili === id ? " secili" : ""));
    d.textContent = ad;
    d.addEventListener("click", () => { depo.yaz("pg.kartDers", id); kartSayfasiCiz(); });
    ciplar.appendChild(d);
  };
  cip("tumu", "Hepsi");
  kartliDersler.forEach(id => cip(id, dersAdi(id, true)));
  sayfa.appendChild(ciplar);

  /* Bir ders seçiliyse konuları da seçilebilir (birden çok); hiçbiri seçili
     değilse dersin bütün konuları gelir */
  let seciliKonular = [];
  if (secili !== "tumu") {
    const kartliKonular = (DERS_KONULARI.get(secili) || []).filter(k => k.kartlar.length);
    seciliKonular = kartKonulari(secili).filter(id => kartliKonular.some(k => k.id === id));
    if (kartliKonular.length > 1) {
      const konuCiplari = olustur("div", "cip-satiri konu-ciplari");
      konuCiplari.setAttribute("aria-label", "Konular");
      const konuCipi = (id, ad, acik, tikla) => {
        const d = olustur("button", "cip" + (acik ? " secili" : ""));
        d.textContent = ad;
        d.setAttribute("aria-pressed", acik ? "true" : "false");
        d.addEventListener("click", tikla);
        konuCiplari.appendChild(d);
      };
      konuCipi("tumu", "Bütün konular", !seciliKonular.length, () => { kartKonulariniYaz(secili, []); kartSayfasiCiz(); });
      kartliKonular.forEach(k => konuCipi(k.id, konuEtiketi(k), seciliKonular.indexOf(k.id) !== -1, () => {
        const yeni = seciliKonular.indexOf(k.id) !== -1 ? seciliKonular.filter(x => x !== k.id) : seciliKonular.concat([k.id]);
        kartKonulariniYaz(secili, yeni);
        kartSayfasiCiz();
      }));
      sayfa.appendChild(konuCiplari);
    }
  }

  const hepsi = TUM_KARTLAR.filter(k => (secili === "tumu" || k.konu.ders === secili) &&
    (!seciliKonular.length || seciliKonular.indexOf(k.konu.id) !== -1));
  /* İki süzgeç üst üste: önce mühim yerler, sonra bilemediklerim */
  const muhimler = hepsi.filter(k => muhimYerdenMi(k.konu, k.yer));
  const muhimYalniz = kartMuhimSuzgeci() && muhimler.length > 0;
  const taban = muhimYalniz ? muhimler : hepsi;
  const bilemedikler = taban.filter(k => bilemedimMi(k.id));
  const yalniz = sadeceBilemediklerim() && bilemedikler.length > 0;
  const calisilacak = yalniz ? bilemedikler : taban;

  const muhimSatiri = olustur("div", "anahtarli-satir");
  const muhimYazi = olustur("span");
  muhimYazi.textContent = "Yalnızca mühim yerler (" + muhimler.length + ")";
  const muhimAnahtar = olustur("button", "anahtar-dugme");
  muhimAnahtar.setAttribute("role", "switch");
  muhimAnahtar.setAttribute("aria-checked", muhimYalniz ? "true" : "false");
  muhimAnahtar.setAttribute("aria-label", "Yalnızca mühim yerlerin kartları");
  muhimAnahtar.disabled = !muhimler.length;
  muhimAnahtar.addEventListener("click", () => { depo.yaz("pg.kartMuhim", !kartMuhimSuzgeci()); kartSayfasiCiz(); });
  muhimSatiri.append(muhimYazi, muhimAnahtar);
  sayfa.appendChild(muhimSatiri);

  const anahtarSatiri = olustur("div", "anahtarli-satir");
  const yazi = olustur("span");
  yazi.textContent = "Yalnızca bilemediklerim (" + bilemedikler.length + ")";
  const anahtar = olustur("button", "anahtar-dugme");
  anahtar.setAttribute("role", "switch");
  anahtar.setAttribute("aria-checked", yalniz ? "true" : "false");
  anahtar.setAttribute("aria-label", "Yalnızca bilemediğim kartlar");
  anahtar.disabled = !bilemedikler.length;
  anahtar.addEventListener("click", () => { depo.yaz("pg.kartBilemedik", !sadeceBilemediklerim()); kartSayfasiCiz(); });
  anahtarSatiri.append(yazi, anahtar);
  sayfa.appendChild(anahtarSatiri);

  const eylem = olustur("div", "eylem");
  eylem.style.marginTop = "6px";
  const basla = olustur("button", "ana");
  basla.textContent = calisilacak.length + " kartla çalış";
  basla.addEventListener("click", () => {
    derinlesGit(kartSayfasiCiz);
    const baslik = secili === "tumu" ? "42 Tarzı"
      : seciliKonular.length === 1 ? konuEtiketi(KONULAR.get(seciliKonular[0]))
      : dersAdi(secili, true) + (seciliKonular.length ? " · " + seciliKonular.length + " konu" : "");
    kartOturumu(calisilacak, baslik, $("#sayfaKart"), { tur: "kart" });
  });
  eylem.appendChild(basla);
  sayfa.appendChild(eylem);

  /* Liste: konu konu soru ve cevaplar, okuyarak tekrar için (mühim süzgeci açıksa yalnızca onlar) */
  let sonKonu = null;
  taban.forEach(k => {
    if (k.konu !== sonKonu) {
      sonKonu = k.konu;
      const b = olustur("h3");
      b.style.cssText = "font-size:13px;color:var(--vurgu);font-family:var(--mono);margin:22px 0 8px;font-weight:500";
      b.textContent = konuYeri(k.konu);
      sayfa.appendChild(b);
    }
    const kart = olustur("div", "sonuc-kart");
    const s = olustur("p");
    s.style.fontWeight = "600";
    s.innerHTML = (bilemedimMi(k.id) ? '<span style="color:var(--yanlis)">• </span>' : "") + satiriCiz(k.on, k.konu.ders);
    const c = olustur("div");
    c.style.cssText = "margin-top:8px;color:var(--sonuk);font-size:14.5px;line-height:1.6";
    c.innerHTML = markdownCiz(k.arka, k.konu.ders);
    c.querySelectorAll("p").forEach(p => { p.style.margin = "0 0 6px"; });
    kart.append(s, c);
    sayfa.appendChild(kart);
  });
}

/* ==========================================================================
   Kart destesi — 42 Tarzı ve kavram kartları
   Kart bir kez kurulur. Dokununca 3B döner, cevap yüzünde sağa kaydırınca
   "Bildim", sola kaydırınca "Bilemedim" olur; düğmeler de aynı hareketi yapar.
   ========================================================================== */
function kartOturumu(kartlar, baslik, sayfa, secenek) {
  const kayitTut = secenek && secenek.tur === "kart";
  let sira = karistir(kartlar), i = 0, bilinen = 0, bilinmeyenler = [];
  let mesgul = false;
  const klavye = new AbortController();

  function bitti() {
    klavye.abort();
    sayfa.innerHTML = "";
    const bitis = olustur("div", "bitis");
    const p = olustur("div", "puan");
    p.textContent = bilinen + "/" + sira.length;
    const a = olustur("div", "alt");
    a.textContent = "kart bildiniz";
    bitis.append(p, a);
    sayfa.appendChild(bitis);
    const eylem = olustur("div", "eylem");
    if (bilinmeyenler.length) {
      const kalanlar = olustur("button", "ana");
      kalanlar.textContent = "Bilemedikleriniz (" + bilinmeyenler.length + ")";
      kalanlar.addEventListener("click", () => kartOturumu(bilinmeyenler, baslik, sayfa, secenek));
      eylem.appendChild(kalanlar);
    }
    const tekrar = olustur("button", bilinmeyenler.length ? "" : "ana");
    tekrar.textContent = "Yeniden karıştır";
    tekrar.addEventListener("click", () => kartOturumu(kartlar, baslik, sayfa, secenek));
    const cik = olustur("button");
    cik.textContent = "Listeye dön";
    cik.addEventListener("click", geriDon);
    eylem.append(tekrar, cik);
    sayfa.appendChild(eylem);
    window.scrollTo(0, 0);
  }

  if (!sira.length) { bitti(); return; }

  /* ---- Bir kez kurulan iskelet ----
     Sıra: ilerleme, deste, karar yığınları, cevap alanı, ipucu, düğmeler */
  sayfa.innerHTML = "";
  const ilerleme = olustur("div", "ilerleme");
  ilerleme.innerHTML = "<span></span>" + '<span class="cubuk"><span class="dolu"></span></span><span class="sayac"></span>';
  ilerleme.firstChild.textContent = baslik;
  const deste = olustur("div", "deste");
  const yiginlar = olustur("div", "yiginlar");
  const yiginKur = (sinif, imi, ad) => {
    const y = olustur("div", "yigin " + sinif);
    y.innerHTML = '<span class="imi"></span><span class="ad"></span><span class="sayi">0</span>';
    y.querySelector(".imi").textContent = imi;
    y.querySelector(".ad").textContent = ad;
    y.setAttribute("aria-live", "polite");
    return y;
  };
  const yiginBilemedim = yiginKur("bilemedim", "✗", "Bilemedim");
  const yiginBildim = yiginKur("bildim", "✓", "Bildim");
  yiginlar.append(yiginBilemedim, yiginBildim);
  const cevapAlani = olustur("div", "kart-cevap");
  const cevapKutusu = olustur("textarea");
  cevapKutusu.rows = 3;
  cevapKutusu.placeholder = "Cevabınızı yazın (isteğe bağlı), sonra kartı çevirip karşılaştırın";
  cevapKutusu.setAttribute("aria-label", "Kendi cevabınız");
  cevapKutusu.autocapitalize = "sentences";
  /* Ctrl+Enter (Mac'te Cmd+Enter) kartı çevirir; yalnız Enter yeni satırdır */
  cevapKutusu.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); cevir(); }
  });
  const seninCevabin = olustur("div", "senin-cevabin");
  cevapAlani.append(cevapKutusu, seninCevabin);
  const ipucu = olustur("p", "kart-ipucu");
  const eylem = olustur("div", "eylem deste-eylem");
  sayfa.append(ilerleme, deste, yiginlar, cevapAlani, ipucu, eylem);

  function yuzCiz(sinif, kart, arkaMi) {
    const yuz = olustur("div", "kart-yuz " + sinif);
    const ust = olustur("div", "ust-serit");
    const tur = olustur("span", "tur");
    tur.textContent = arkaMi ? "cevap" : "soru";
    const yer = olustur("span");
    yer.textContent = kart.konu ? dersAdi(kart.konu.ders, true) + " › " + (kart.konu.sira ? kart.konu.sira + ". " : "") + kart.konu.baslik : "";
    yer.style.cssText = "overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0";
    ust.append(tur, yer);
    const icerik = olustur("div", "icerik");
    if (arkaMi) icerik.innerHTML = markdownCiz(kart.arka, kart.konu && kart.konu.ders);
    else icerik.innerHTML = satiriCiz(kart.on, kart.konu && kart.konu.ders);
    yuz.append(ust, icerik);
    if (!arkaMi) { const ip = olustur("div", "ipucu"); ip.textContent = "Çevirmek için dokunun"; yuz.appendChild(ip); }
    return yuz;
  }

  function kartKur(kart, sonrakiMi) {
    const yer = olustur("div", "kart-yeri" + (sonrakiMi ? " sonraki" : ""));
    const ic = olustur("div", "kart-ic");
    ic.append(yuzCiz("on", kart, false), yuzCiz("arka", kart, true));
    yer.appendChild(ic);
    if (!sonrakiMi) {
      const d1 = olustur("div", "damga bildim"); d1.textContent = "BİLDİM";
      const d2 = olustur("div", "damga bilemedim"); d2.textContent = "BİLEMEDİM";
      yer.append(d1, d2);
      yer.setAttribute("role", "button");
      yer.setAttribute("tabindex", "0");
      yer.setAttribute("aria-label", "Kart: çevirmek için dokunun");
    } else yer.setAttribute("aria-hidden", "true");
    return yer;
  }

  /* Yükseklik: iki yüzün uzun olanına göre; altında yığınlar ve cevap alanı
     da ekrana sığsın diye ekranın yarısını geçmez */
  function yukseklikAyarla(yer) {
    const olc = el => {
      const icerik = el.querySelector(".icerik");
      const ust = el.querySelector(".ust-serit");
      const ip = el.querySelector(".ipucu");
      return (ust ? ust.offsetHeight : 0) + (icerik ? icerik.scrollHeight : 0) + (ip ? ip.offsetHeight : 0) + 4;
    };
    const yuzler = yer.querySelectorAll(".kart-yuz");
    const istenen = Math.max(220, ...Array.from(yuzler).map(olc));
    const sinir = Math.max(240, Math.round(window.innerHeight * 0.5));
    deste.style.height = Math.min(istenen, sinir) + "px";
  }

  let simdiki = null, sonraki = null, cevrik = false;

  /* Cevap alanı: ön yüzde yazılır; çevrilince yazılan "Senin cevabın"
     kutusunda kalır ki kartın arkasıyla karşılaştırılsın */
  function cevapAlaniniTazele() {
    const yazilan = cevapKutusu.value.trim();
    cevapKutusu.hidden = cevrik;
    seninCevabin.hidden = !cevrik || !yazilan;
    if (cevrik && yazilan) {
      seninCevabin.innerHTML = '<span class="etiket">Sizin cevabınız</span>';
      seninCevabin.appendChild(document.createTextNode(yazilan));
    }
  }

  function goster() {
    if (i >= sira.length) { bitti(); return; }
    cevrik = false;
    deste.innerHTML = "";
    sonraki = i + 1 < sira.length ? kartKur(sira[i + 1], true) : null;
    simdiki = kartKur(sira[i], false);
    if (sonraki) deste.appendChild(sonraki);
    deste.appendChild(simdiki);
    yukseklikAyarla(simdiki);
    ilerleme.querySelector(".dolu").style.width = Math.round((i / sira.length) * 100) + "%";
    ilerleme.querySelector(".sayac").textContent = (i + 1) + "/" + sira.length;
    ipucu.textContent = "";
    ipucu.classList.remove("uyari");
    cevapKutusu.value = "";
    cevapAlaniniTazele();
    surukleKur(simdiki);
    simdiki.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); cevir(); } });
    dugmeleriCiz();
  }

  function dugmeleriCiz() {
    eylem.innerHTML = "";
    if (!cevrik) {
      const cevirD = olustur("button", "ana");
      cevirD.textContent = "Cevabı göster";
      cevirD.addEventListener("click", cevir);
      eylem.appendChild(cevirD);
    } else {
      const yok = olustur("button");
      yok.textContent = "✗ Bilemedim";
      yok.addEventListener("click", () => karar(false));
      const var_ = olustur("button", "ana");
      var_.textContent = "✓ Bildim";
      var_.addEventListener("click", () => karar(true));
      eylem.append(yok, var_);
    }
  }

  function cevir() {
    if (mesgul || !simdiki) return;
    cevrik = !cevrik;
    simdiki.querySelector(".kart-ic").classList.toggle("cevrik", cevrik);
    simdiki.setAttribute("aria-label", cevrik ? "Kart: cevap gösteriliyor" : "Kart: çevirmek için dokunun");
    /* Telefonda klavye kapansın: cevap ve karar düğmeleri görünsün */
    if (cevrik && document.activeElement === cevapKutusu) cevapKutusu.blur();
    cevapAlaniniTazele();
    ipucu.classList.remove("uyari");
    ipucu.textContent = cevrik
      ? (cevapKutusu.value.trim() ? "Cevabınız doğru muydu? " : "") + "Sağa kaydırın: bildim · Sola kaydırın: bilemedim"
      : "";
    dugmeleriCiz();
  }

  /* Sürüklerken: arkadaki kart öne yaklaşır, gidilen yöndeki yığın parlar */
  function yaklasmaGoster(oran, yon) {
    const o = Math.max(0, Math.min(1, oran));
    if (sonraki) {
      sonraki.style.transition = "none";
      sonraki.style.transform = "translateY(" + (12 - 12 * o) + "px) scale(" + (0.955 + 0.045 * o) + ")";
      sonraki.style.opacity = String(0.55 + 0.45 * o);
    }
    yiginBildim.classList.toggle("yakin", yon > 0 && o >= 1);
    yiginBilemedim.classList.toggle("yakin", yon < 0 && o >= 1);
    yiginBildim.style.transform = yon > 0 ? "scale(" + (1 + 0.06 * o) + ")" : "";
    yiginBilemedim.style.transform = yon < 0 ? "scale(" + (1 + 0.06 * o) + ")" : "";
  }
  function yaklasmayiSifirla() {
    if (sonraki) { sonraki.style.transition = ""; sonraki.style.transform = ""; sonraki.style.opacity = ""; }
    [yiginBildim, yiginBilemedim].forEach(y => { y.classList.remove("yakin"); y.style.transform = ""; });
  }

  /* Kart bulunduğu yerden karar yığınına uçar, küçülerek içine düşer.
     sure: hızlı fırlatılan kart daha çabuk varır. */
  function yiginaUcur(yer, bildi, sure) {
    const yigin = bildi ? yiginBildim : yiginBilemedim;
    const yon = bildi ? 1 : -1;
    if (hareketAz() || typeof yer.animate !== "function") {
      yer.style.opacity = "0";
      return Promise.resolve(yigin);
    }
    const d = deste.getBoundingClientRect(), y = yigin.getBoundingClientRect();
    const tx = (y.left + y.width / 2) - (d.left + d.width / 2);
    const ty = (y.top + y.height / 2) - (d.top + d.height / 2);
    const bas = yer.style.transform || "translate(0px, 0px)";
    yer.classList.remove("surukleniyor", "geri-yay");
    yer.style.transition = "none";
    const ara = "translate(" + (tx * 0.55 + yon * 24) + "px, " + (ty * 0.25 - 18) + "px) rotate(" + (yon * 14) + "deg) scale(.7)";
    const varis = "translate(" + tx + "px, " + ty + "px) rotate(" + (yon * 24) + "deg) scale(.12)";
    /* Kart yığına varana dek görünür kalır, son anda içine düşerek kaybolur */
    const a = yer.animate([
      { transform: bas, opacity: 1 },
      { transform: ara, opacity: 1, offset: 0.55 },
      { transform: varis, opacity: 0.85, offset: 0.9 },
      { transform: varis, opacity: 0 }
    ], { duration: sure, easing: "cubic-bezier(.35,.15,.25,1)", fill: "forwards" });
    /* Eski tarayıcılarda animate var ama finished yok: süre kadar beklenir */
    if (!a.finished) return new Promise(coz => setTimeout(() => coz(yigin), sure));
    return a.finished.then(() => yigin, () => yigin);
  }

  async function karar(bildi, sure) {
    if (mesgul || !cevrik) return;
    mesgul = true;
    const kart = sira[i];
    if (bildi) bilinen++;
    else if (bilinmeyenler.indexOf(kart) === -1) bilinmeyenler.push(kart);
    if (kayitTut && kart.id) kayitYaz("kart", kart.id, { s: bildi ? "bildim" : "bilemedim" });
    yaklasmaGoster(1, bildi ? 1 : -1);
    if (sonraki) {
      /* Arkadaki kart öne geçer (sürükleme sırasında verilen satır içi
         değerler bırakılır; geçiş sınıftan gelir) */
      sonraki.style.transition = ""; sonraki.style.transform = ""; sonraki.style.opacity = "";
      sonraki.classList.add("one-cik");
    }
    const yigin = await yiginaUcur(simdiki, bildi, sure || 480);
    /* Uçuş sürerken geri basıldıysa deste sayfadan kalkmıştır: hiçbir şey çizilmez */
    if (!deste.isConnected) { klavye.abort(); return; }
    yaklasmayiSifirla();
    const sayi = yigin.querySelector(".sayi");
    sayi.textContent = String(Number(sayi.textContent) + 1);
    yigin.classList.remove("zipla");
    void yigin.offsetWidth;   /* aynı sınıf yeniden eklenince animasyon baştan oynasın */
    yigin.classList.add("zipla");
    i++;
    mesgul = false;
    goster();
  }

  /* ---- Sürükleme ---- */
  function surukleKur(yer) {
    let basX = 0, basY = 0, dx = 0, dy = 0, zaman = 0, aktif = false, yatay = false, iskaretci = null, esikGecildi = false;
    let sonX = 0, sonZaman = 0, hiz = 0;
    const damgaBildim = yer.querySelector(".damga.bildim");
    const damgaBilemedim = yer.querySelector(".damga.bilemedim");
    const damgalar = (oran) => {
      damgaBildim.style.opacity = String(Math.max(0, Math.min(1, oran)));
      damgaBilemedim.style.opacity = String(Math.max(0, Math.min(1, -oran)));
    };
    const esik = () => yer.offsetWidth * 0.28;
    yer.addEventListener("pointerdown", e => {
      if (mesgul || (e.pointerType === "mouse" && e.button !== 0)) return;
      /* Kartın içindeki uzun cevabı kaydırırken sürükleme başlamasın diye
         karar ilk harekete bırakılır */
      aktif = true; yatay = false; dx = 0; dy = 0; esikGecildi = false; hiz = 0;
      basX = sonX = e.clientX; basY = e.clientY; zaman = sonZaman = performance.now();
      iskaretci = e.pointerId;
    });
    yer.addEventListener("pointermove", e => {
      if (!aktif || e.pointerId !== iskaretci) return;
      const x = e.clientX - basX, y = e.clientY - basY;
      if (!yatay) {
        if (Math.abs(x) < 8 && Math.abs(y) < 8) return;
        if (Math.abs(y) > Math.abs(x)) { aktif = false; return; }   /* dikey: sayfa kaysın */
        yatay = true;
        try { yer.setPointerCapture(iskaretci); } catch (err) {}
        yer.classList.remove("geri-yay");
        yer.classList.add("surukleniyor");
      }
      /* Son anlardaki hız: bırakınca fırlatma mı, yavaş bırakma mı ayırt edilir */
      const simdi = performance.now();
      if (simdi > sonZaman) { hiz = 0.7 * ((e.clientX - sonX) / (simdi - sonZaman)) + 0.3 * hiz; }
      sonX = e.clientX; sonZaman = simdi;
      /* Ön yüzdeyken karar verilemez: kart direnir */
      dx = cevrik ? x : x * 0.3;
      dy = cevrik ? y * 0.18 : 0;
      yer.style.transform = "translate(" + dx + "px, " + dy + "px) rotate(" + (dx / 18) + "deg)";
      if (!cevrik) return;
      const oran = Math.abs(dx) / esik();
      damgalar((dx > 0 ? 1 : -1) * Math.min(1, oran));
      yaklasmaGoster(oran, dx);
      /* Eşik geçilince telefonda kısa bir titreşim (destekleyen cihazlarda) */
      if (oran >= 1 && !esikGecildi) {
        esikGecildi = true;
        try { if (navigator.vibrate) navigator.vibrate(8); } catch (err) {}
      } else if (oran < 1) esikGecildi = false;
    });
    const birak = e => {
      if (!aktif || e.pointerId !== iskaretci) return;
      aktif = false;
      if (!yatay) {
        /* Hareketsiz dokunuş: çevir */
        if (e.type === "pointerup") cevir();
        return;
      }
      yer.classList.remove("surukleniyor");
      const genelHiz = dx / Math.max(1, performance.now() - zaman);
      const anlik = Math.abs(hiz) > Math.abs(genelHiz) ? hiz : genelHiz;
      const firlatma = Math.abs(anlik) > 0.6 && Math.sign(anlik) === Math.sign(dx) && Math.abs(dx) > 30;
      if (e.type === "pointerup" && cevrik && (Math.abs(dx) > esik() || firlatma)) {
        /* Hızlı fırlatılan kart yığına daha çabuk varır */
        karar(dx > 0, firlatma ? Math.max(340, 480 - Math.abs(anlik) * 100) : 480);
        return;
      }
      /* Eşiğe varmadı: kart yaylanarak yerine döner */
      yer.classList.add("geri-yay");
      yer.style.transform = "";
      damgalar(0);
      yaklasmayiSifirla();
      if (!cevrik && Math.abs(dx) > 12) {
        ipucu.textContent = "Önce cevabı görün, sonra kaydırın.";
        ipucu.classList.add("uyari");
      }
    };
    yer.addEventListener("pointerup", birak);
    yer.addEventListener("pointercancel", birak);
  }

  /* Masaüstünde klavye: boşluk çevirir, oklar karar verir */
  document.addEventListener("keydown", e => {
    if (!deste.isConnected) { klavye.abort(); return; }
    /* Deste başka sekmenin altında gizliyken tuşlar ona gitmesin */
    if (deste.offsetParent === null) return;
    const hedef = e.target && e.target.tagName;
    if (hedef === "INPUT" || hedef === "TEXTAREA" || document.querySelector(".panel-perde")) return;
    if (e.key === "ArrowRight" && cevrik) { e.preventDefault(); karar(true); }
    else if (e.key === "ArrowLeft" && cevrik) { e.preventDefault(); karar(false); }
    else if (e.key === " " && e.target === document.body) { e.preventDefault(); cevir(); }
  }, { signal: klavye.signal });

  goster();
  window.scrollTo(0, 0);
}

const GUNCELLEME = {
  surum: "2.0",
  baslik: "Programcılık'a hoş geldiniz",
  maddeler: [
    ["Notlar ders ders", "Oku sekmesinde Sınıf › Dönem › Ders › Konu sırasıyla ilerlersiniz. Hocalar not paylaştıkça yeni konular kendiliğinden gelir; bir kez inen konu internetsiz de okunur."],
    ["Temrinde önce kapsam", "Temrin sekmesinde önce hangi derslerin hangi konularından çalışacağınızı seçersiniz; sorular yalnızca oradan gelir."],
    ["Yeni soru türleri", "Çoktan seçmeli, doğru-yanlış, boşluk doldurma, sıralama, eşleştirme, kod izleme, hesaplama ve klasik sorular var."],
    ["42 Tarzı", "Sözlü sınav tarzı soru-cevap kartları. Dokunarak çevirin; cevabı gördükten sonra sağa kaydırırsanız bildiniz, sola kaydırırsanız bilemediniz."],
    ["Mühim yerler", "Konu adının ya da bir alt başlığın yanındaki ayraç işaretiyle o yeri mühim işaretlersiniz; metinde bir yeri boyadığınızda da başlığı kendiliğinden mühim olur. Hepsi Oku sekmesindeki Mühimmat listesinde toplanır. Temrin ve 42 Tarzı'nda \u201cYalnızca mühim yerler\u201d seçilirse sorular yalnızca oradan gelir."],
    ["Her şey hesabınızda", "Okuduğunuz konular, kırmızıya boyadığınız yerler, yıldızlarınız ve yanlışlarınız okul hesabınızda tutulur. Hesap aynı anda bir cihazda açık olur; başka cihaza geçtiğinizde e-postanıza gelen kodla devralırsınız ve ilerlemeniz oraya gelir."]
  ]
};

let guncellemeNotuAcik = false;

function guncellemeNotuKapat() {
  const perde = document.querySelector(".not-perde");
  if (perde) perde.remove();
  guncellemeNotuAcik = false;
  depo.yaz("pg.notSurumu", GUNCELLEME.surum);
  /* Kurulum şeridi hemen değil, kısa bir aradan sonra: iki kutu üst üste binmesin */
  setTimeout(kurulumSeridiniGoster, 1200);
}

function guncellemeNotuGoster() {
  if (depo.oku("pg.notSurumu", null) === GUNCELLEME.surum) return;
  const perde = olustur("div", "not-perde");
  const kutu = olustur("div", "not-kutu");

  const ust = olustur("div", "not-ust");
  const baslik = olustur("h3");
  baslik.textContent = GUNCELLEME.baslik;
  const surum = olustur("span", "not-surum");
  surum.textContent = "s" + GUNCELLEME.surum;
  ust.append(baslik, surum);
  kutu.appendChild(ust);

  const govde = olustur("div", "not-govde");
  GUNCELLEME.maddeler.forEach(([ad, izah]) => {
    const madde = olustur("div", "not-madde");
    const b = olustur("strong");
    b.textContent = ad;
    const p = olustur("p");
    p.textContent = izah;
    madde.append(b, p);
    govde.appendChild(madde);
  });
  kutu.appendChild(govde);

  const eylem = olustur("div", "eylem");
  const tamam = olustur("button", "ana");
  tamam.textContent = "Anladım";
  tamam.addEventListener("click", () => geriDon());
  eylem.appendChild(tamam);
  kutu.appendChild(eylem);

  perde.appendChild(kutu);
  document.body.appendChild(perde);
  guncellemeNotuAcik = true;
  derinlesGit(guncellemeNotuKapat);   /* geri tuşu da kapatsın */
}

/* ==========================================================================
   Kurulum şeridi — ana ekrana ekleme
   ========================================================================== */
function zatenKurulu() {
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
         window.navigator.standalone === true;
}

/* Yerel istem gelmeyen tarayıcılar için elle kurulum adımları */
function kurulumAdimlari() {
  const ua = navigator.userAgent || "";
  if (iosMu()) return ["Safari'de alt çubuktaki Paylaş düğmesine dokunun", "Listeden “Ana Ekrana Ekle”yi seçin", "Sağ üstten “Ekle”ye dokunun", "Uygulamayı ana ekrandan açıp okul adresinizle giriş yapın"];
  if (/Android/.test(ua)) return ["Tarayıcının ⋮ menüsünü açın", "“Uygulamayı yükle” ya da “Ana ekrana ekle”ye dokunun", "Açılan kutuda onaylayın"];
  return ["Adres çubuğunun sağındaki yükleme simgesine tıklayın", "Ya da ⋮ menüsünden “Yükle”yi seçin", "Açılan kutuda onaylayın"];
}

let kurulumSeridi = null;

function kurulumSeridiniKapat(kalici) {
  if (kurulumSeridi) { kurulumSeridi.remove(); kurulumSeridi = null; }
  if (kalici) depo.yaz("pg.kurulum", "gizli");
}

function kurulumSeridiniGoster() {
  if (!uygulamaAcik || kurulumSeridi || zatenKurulu() || guncellemeNotuAcik) return;
  /* Okuma çubuğu ekrandayken şeridi rahatsız etmesin, sonra çıkar */
  if (document.querySelector(".oynatma")) { setTimeout(kurulumSeridiniGoster, 5000); return; }
  if (depo.oku("pg.kurulum", null) === "gizli") return;

  const serit = olustur("div", "kurulum");
  serit.setAttribute("role", "dialog");
  serit.setAttribute("aria-label", "Uygulamayı ana ekrana ekle");
  const baslik = olustur("p", "baslik");
  baslik.textContent = "Ana ekrana ekle";
  const metin = olustur("p", "metin");
  metin.textContent = "Tam ekran açılsın ve yolda internetsiz de çalışsın diye uygulamayı telefonunuza kurabilirsiniz.";
  serit.append(baslik, metin);

  const eylem = olustur("div", "eylem");
  const kapat = olustur("button");
  kapat.textContent = "Şimdi değil";
  kapat.addEventListener("click", () => kurulumSeridiniKapat(true));

  const kur = olustur("button", "ana");
  kur.textContent = "Yükle";
  kur.addEventListener("click", async () => {
    const olay = window.kurulumOlayi;
    if (olay) {
      window.kurulumOlayi = null;
      try {
        olay.prompt();
        const sonuc = await olay.userChoice;
        kurulumSeridiniKapat(sonuc && sonuc.outcome === "accepted");
        if (!(sonuc && sonuc.outcome === "accepted")) kurulumSeridiniGoster();
      } catch (e) { adimlariAc(); }
      return;
    }
    adimlariAc();
  });

  function adimlariAc() {
    /* Tarayıcı yerel istemi vermiyorsa elle kurulum yolunu göster */
    metin.textContent = "Tarayıcınız otomatik kurulum penceresi açmıyor. Şu adımlarla ekleyebilirsiniz:";
    if (!serit.querySelector(".adimlar")) {
      const liste = olustur("ol", "adimlar");
      kurulumAdimlari().forEach(a => { const li = olustur("li"); li.textContent = a; liste.appendChild(li); });
      serit.insertBefore(liste, eylem);
    }
    kur.textContent = "Anladım";
    kur.onclick = () => kurulumSeridiniKapat(true);
  }

  eylem.append(kapat, kur);
  serit.appendChild(eylem);
  document.body.appendChild(serit);
  kurulumSeridi = serit;
}

window.addEventListener("kurulum-hazir", kurulumSeridiniGoster);
window.addEventListener("kurulum-bitti", () => kurulumSeridiniKapat(true));

(async function basla() {
  altCubukCiz();
  if (!ayarTamam) { girisEkraniAc(); return; }
  try { await acilis(); }
  catch (e) {
    /* Boş ekranda kalmasın: hata görünür ve giriş yeniden denenebilir */
    console.error("açılış tamamlanamadı", e);
    if (!uygulamaAcik) girisEkraniAc("Uygulama açılırken bir sorun çıktı (" + ((e && e.message) || "bilinmeyen hata") + "). Sayfayı yenileyip yeniden deneyin.");
  }
})();

async function acilis() {
  await vt.ac();
  let bilinen = null;
  try { bilinen = await vt.oku("durum", "kullanici"); } catch (e) { bilinen = null; }
  if (bilinen && bilinen.deger && bilinen.deger.id) {
    KULLANICI = bilinen.deger;
    try { await yerelKayitlariYukle(); await yerelIcerigiYukle(); }
    catch (e) { console.warn("yerel veri okunamadı", e); }
    await acilisiTamamla(false);
  } else {
    /* Cihazda hesap izi yok: eski bir oturum kalmışsa da temiz başlanır */
    try { await istemci.auth.signOut({ scope: "local" }); } catch (e) {}
    girisEkraniAc();
  }
}
