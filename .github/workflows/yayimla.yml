# Yalnızca uygulama/ klasörü yayımlanır; icerik/ asla Pages'e çıkmaz.
name: Uygulamayı yayımla

on:
  push:
    branches: [main]
    paths:
      - "uygulama/**"
      - ".github/workflows/yayimla.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  yayimla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Kabukta içerik olmadığını denetle
        run: |
          if grep -rl --include='*.json' '"sorular"' uygulama/; then
            echo "uygulama/ içinde içerik dosyası var; yayım durduruldu"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: uygulama
      - id: dagitim
        uses: actions/deploy-pages@v4
