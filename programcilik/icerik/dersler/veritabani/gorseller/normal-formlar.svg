<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250" role="img">
<title>3NF, 2NF'nin; 2NF de 1NF'nin içindedir</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="14" y="14" width="372" height="208" rx="12" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.8"/>
<text x="28.0" y="40.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#2B6CB0" font-weight="600" text-anchor="start">1NF'ye uygun tablolar</text>
<rect x="44" y="60" width="312" height="144" rx="12" fill="#F3EEFF" stroke="#6B46C1" stroke-width="1.8"/>
<text x="58.0" y="86.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#6B46C1" font-weight="600" text-anchor="start">2NF'ye uygun tablolar</text>
<rect x="74" y="106" width="252" height="80" rx="12" fill="#E9F7EF" stroke="#2F855A" stroke-width="1.8"/>
<text x="88.0" y="132.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#2F855A" font-weight="600" text-anchor="start">3NF'ye uygun tablolar</text>
<text x="200.0" y="244.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">3NF'deki her tablo 2NF'ye ve 1NF'ye de uygundur.</text>
</svg>
