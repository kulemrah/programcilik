<svg xmlns="http://www.w3.org/2000/svg" width="400" height="336" viewBox="0 0 400 336" role="img">
<title>Ham tablodan 1NF, 2NF ve 3NF'ye</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
