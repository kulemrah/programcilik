<text x="102.0" y="280.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#1A202C" text-anchor="start">Anahtar olmayan bir sütuna bağlı</text>
<text x="102.0" y="297.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#1A202C" text-anchor="start">sütunlar ayrı tabloya</text>
