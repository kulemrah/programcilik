<text x="51.0" y="45.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">Ham tablo</text>
<line x1="51.0" y1="68.0" x2="51.0" y2="92.0" stroke="#2B6CB0" stroke-width="2"/>
<polygon points="51.0,92.0 47.5,83.7 54.5,83.7" fill="#2B6CB0"/>
<rect x="14" y="94" width="74" height="54" rx="10" fill="#2B6CB0"/>
<text x="51.0" y="127.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">1NF</text>
<text x="102.0" y="116.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#1A202C" text-anchor="start">Tekrarlanan sütunlar ve tek alanda</text>
<text x="102.0" y="133.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#1A202C" text-anchor="start">birden çok bilgi yeni tabloya</text>
