<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img">
<title>Her enerji dönüşümünde enerjinin bir kısmı dağınık bir şekle girer</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="180.0" y="24.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#6B46C1" font-weight="600" text-anchor="middle">İkinci termodinamik yasası</text>
<rect x="110.0" y="40.0" width="140.0" height="40.0" rx="10" fill="#FFF8DB" stroke="#B7791F" stroke-width="1.4"/>
<text x="180.0" y="65.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#975A16" font-weight="600" text-anchor="middle">Girdi enerjisi</text>
<line x1="180.0" y1="80.0" x2="180.0" y2="110.0" stroke="#4A5568" stroke-width="2"/>
<polygon points="180.0,110.0 176.5,101.7 183.5,101.7" fill="#4A5568"/>
<rect x="120.0" y="112.0" width="120.0" height="40.0" rx="10" fill="#EFE9FB" stroke="#6B46C1" stroke-width="1.4"/>
<text x="180.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#6B46C1" font-weight="600" text-anchor="middle">Dönüşüm</text>
<line x1="150.0" y1="152.0" x2="92.0" y2="194.0" stroke="#4A5568" stroke-width="2"/>
<polygon points="92.0,194.0 96.7,186.3 100.8,192.0" fill="#4A5568"/>
<line x1="210.0" y1="152.0" x2="268.0" y2="194.0" stroke="#4A5568" stroke-width="2"/>
<polygon points="268.0,194.0 259.2,192.0 263.3,186.3" fill="#4A5568"/>
<rect x="10.0" y="196.0" width="160.0" height="68.0" rx="10" fill="#E6F4EA" stroke="#276749" stroke-width="1.6"/>
<text x="90.0" y="224.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#276749" font-weight="600" text-anchor="middle">Faydalı iş / düzen</text>
<rect x="190.0" y="196.0" width="160.0" height="68.0" rx="10" fill="#FEEBD6" stroke="#C05621" stroke-width="1.6"/>
<text x="270.0" y="218.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#C05621" font-weight="600" text-anchor="middle">Dağılan ve</text>
<text x="270.0" y="233.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#C05621" font-weight="600" text-anchor="middle">kullanılamayan ısı</text>
<text x="270.0" y="248.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#C05621" font-weight="600" text-anchor="middle">(entropi artışı)</text>
<text x="180.0" y="292.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#1A202C" font-weight="600" text-anchor="middle">Enerjinin bir kısmı iş yapamayacak</text>
<text x="180.0" y="308.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#1A202C" font-weight="600" text-anchor="middle">kadar dağınık bir şekle girer.</text>
</svg>
