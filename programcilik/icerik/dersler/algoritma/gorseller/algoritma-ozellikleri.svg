<svg xmlns="http://www.w3.org/2000/svg" width="400" height="384" viewBox="0 0 400 384" role="img">
<title>Algoritmanın beş özelliği</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="10" y="10" width="380" height="64" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.6"/>
<rect x="10" y="10" width="8" height="64" rx="4" fill="#2B6CB0"/>
<text x="32.0" y="37.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#2B6CB0" font-weight="600" text-anchor="start">Etkinlik</text>
<text x="32.0" y="58.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#1A202C" text-anchor="start">adımlar anlaşılır, basit, kesin; yorum gerektirmez</text>
<rect x="10" y="84" width="380" height="64" rx="10" fill="#FFFFFF" stroke="#6B46C1" stroke-width="1.6"/>
<rect x="10" y="84" width="8" height="64" rx="4" fill="#6B46C1"/>
<text x="32.0" y="111.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#6B46C1" font-weight="600" text-anchor="start">Sonluluk</text>
<text x="32.0" y="132.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#1A202C" text-anchor="start">başlangıç, adımlar, bitiş; sonsuz döngü yok</text>
<rect x="10" y="158" width="380" height="64" rx="10" fill="#FFFFFF" stroke="#2C7A7B" stroke-width="1.6"/>
<rect x="10" y="158" width="8" height="64" rx="4" fill="#2C7A7B"/>
<text x="32.0" y="185.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#2C7A7B" font-weight="600" text-anchor="start">Kesinlik</text>
<text x="32.0" y="206.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#1A202C" text-anchor="start">aynı veriyle her çalıştırmada aynı sonuç</text>
<rect x="10" y="232" width="380" height="64" rx="10" fill="#FFFFFF" stroke="#2F855A" stroke-width="1.6"/>
<rect x="10" y="232" width="8" height="64" rx="4" fill="#2F855A"/>
<text x="32.0" y="259.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#2F855A" font-weight="600" text-anchor="start">Giriş/çıkış</text>
<text x="32.0" y="280.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#1A202C" text-anchor="start">işlenecek değerler girer, sonuçlar çıkar</text>
<rect x="10" y="306" width="380" height="64" rx="10" fill="#FFFFFF" stroke="#C05621" stroke-width="1.6"/>
<rect x="10" y="306" width="8" height="64" rx="4" fill="#C05621"/>
<text x="32.0" y="333.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#C05621" font-weight="600" text-anchor="start">Başarım</text>
<text x="32.0" y="354.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#1A202C" text-anchor="start">bellek ve süre dikkate alınır</text>
</svg>
