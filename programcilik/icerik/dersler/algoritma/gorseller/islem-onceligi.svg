<svg xmlns="http://www.w3.org/2000/svg" width="400" height="268" viewBox="0 0 400 268" role="img">
<title>İşlem önceliği: X=2*3/6+2</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="70.2" y="20" width="38.4" height="28" rx="5" fill="#FFF4E5"/>
<line x1="71.2" y1="46.0" x2="107.6" y2="46.0" stroke="#C05621" stroke-width="2"/>
<text x="30.0" y="40.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#1A202C" text-anchor="start">X = 2*3/6+2</text>
<text x="206.0" y="36.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#4A5568" text-anchor="start">1. çarpma ve bölme önce;</text>
<text x="206.0" y="52.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#4A5568" text-anchor="start">aynı öncelik: soldan sağa</text>
<line x1="60.0" y1="52.0" x2="60.0" y2="72.0" stroke="#A0AEC0" stroke-width="1.4"/>
<polygon points="60.0,72.0 56.5,63.7 63.5,63.7" fill="#A0AEC0"/>
<rect x="70.2" y="78" width="38.4" height="28" rx="5" fill="#FFF4E5"/>
<line x1="71.2" y1="104.0" x2="107.6" y2="104.0" stroke="#C05621" stroke-width="2"/>
<text x="30.0" y="98.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#1A202C" text-anchor="start">X = 6/6+2</text>
<text x="206.0" y="94.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#4A5568" text-anchor="start">2. sıradaki bölme</text>
<line x1="60.0" y1="110.0" x2="60.0" y2="130.0" stroke="#A0AEC0" stroke-width="1.4"/>
<polygon points="60.0,130.0 56.5,121.7 63.5,121.7" fill="#A0AEC0"/>
<rect x="70.2" y="136" width="38.4" height="28" rx="5" fill="#FFF4E5"/>
<line x1="71.2" y1="162.0" x2="107.6" y2="162.0" stroke="#C05621" stroke-width="2"/>
<text x="30.0" y="156.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#1A202C" text-anchor="start">X = 1+2</text>
<text x="206.0" y="152.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#4A5568" text-anchor="start">3. toplama en son</text>
<line x1="60.0" y1="168.0" x2="60.0" y2="188.0" stroke="#A0AEC0" stroke-width="1.4"/>
<polygon points="60.0,188.0 56.5,179.7 63.5,179.7" fill="#A0AEC0"/>
<text x="30.0" y="214.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#1A202C" text-anchor="start">X = 3</text>
<text x="206.0" y="210.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#4A5568" text-anchor="start">sonuç</text>
<rect x="20" y="190" width="80" height="34" rx="6" fill="none" stroke="#2F855A" stroke-width="1.8"/>
<text x="200.0" y="258.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#C05621" font-weight="600" text-anchor="middle">öncelik: () → ^ → * / → + -</text>
</svg>
