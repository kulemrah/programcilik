<rect x="206" y="36" width="184" height="14" fill="#2C7A7B"/>
<text x="298.0" y="36.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">Yorumlayıcı</text>
<text x="298.0" y="84.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#1A202C" text-anchor="middle">o anda çevirir; her</text>
<text x="298.0" y="106.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#1A202C" font-weight="600" text-anchor="middle">çalıştırmada yeniden</text>
<text x="298.0" y="138.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#1A202C" text-anchor="middle">makine dili kodu</text>
<text x="298.0" y="160.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#1A202C" font-weight="600" text-anchor="middle">saklanmaz</text>
<line x1="226.0" y1="216.0" x2="370.0" y2="216.0" stroke="#E2E8F0" stroke-width="1.2"/>
<text x="298.0" y="240.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" fill="#4A5568" text-anchor="middle">hocanın örnekleri:</text>
