<svg xmlns="http://www.w3.org/2000/svg" width="360" height="372" viewBox="0 0 360 372" role="img">
<title>1500 öncesi organik dünya görüşü ve 17. asırdan sonraki yang'cı düşünce</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="10.0" y="10.0" width="340.0" height="196.0" rx="10" fill="#E6F4EA" stroke="#276749" stroke-width="1.6"/>
<text x="180.0" y="36.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#4A5568" text-anchor="middle">1500'lü yıllardan önce</text>
<text x="180.0" y="58.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#276749" font-weight="600" text-anchor="middle">Organik dünya görüşü</text>
<text x="180.0" y="82.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#1A202C" font-weight="600" text-anchor="middle">fikirler «yin» paralelinde</text>
<text x="180.0" y="108.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#1A202C" text-anchor="middle">Bilim, «Tanrı'nın yüce şanı için» ya da</text>
<text x="180.0" y="124.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#1A202C" text-anchor="middle">«doğal düzenin yolunda gitmek» ve</text>
<text x="180.0" y="140.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#1A202C" text-anchor="middle">«Tao'nun akışını izlemek» için yapılır.</text>
<line x1="40.0" y1="156.0" x2="320.0" y2="156.0" stroke="#9AE6B4" stroke-width="1"/>
<text x="180.0" y="176.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#276749" font-weight="600" text-anchor="middle">Bilimin amacı: doğanın düzenini anlamak</text>
<text x="180.0" y="192.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#276749" font-weight="600" text-anchor="middle">ve uyum içinde yaşamak</text>
<line x1="180.0" y1="212.0" x2="180.0" y2="246.0" stroke="#4A5568" stroke-width="2"/>
<polygon points="180.0,246.0 176.5,237.7 183.5,237.7" fill="#4A5568"/>
<text x="194.0" y="234.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#4A5568" text-anchor="start">17. asırdan sonra</text>
<rect x="10.0" y="252.0" width="340.0" height="110.0" rx="10" fill="#FEEBD6" stroke="#C05621" stroke-width="1.6"/>
<text x="180.0" y="280.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#C05621" font-weight="600" text-anchor="middle">17. asır paradigması</text>
<text x="180.0" y="304.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#1A202C" font-weight="600" text-anchor="middle">düşünce «yang»cı oldu</text>
<text x="180.0" y="328.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">Görselde: doğayı fethetmek ve kontrol etmek,</text>
<text x="180.0" y="344.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">bilimin yeni amacı</text>
</svg>
